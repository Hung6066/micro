---
- name: Bootstrap data-plane secrets from Vault/CSI-synced source namespace
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    data_plane_secrets_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('artifacts/kubeconfig-production.yaml', true) }}"
  roles:
    - role: data-plane-secrets
