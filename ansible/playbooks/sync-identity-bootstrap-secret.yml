---
- name: Sync Identity bootstrap secret from protected operator file
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    identity_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('artifacts/kubeconfig-production.yaml', true) }}"
    identity_namespace: his-hope
    identity_admin_file: "{{ lookup('env', 'IDENTITY_ADMIN_FILE') | default('D:/secure/his-hope/admin-user', true) }}"
  tasks:
    - name: Validate protected admin file and kubeconfig
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ identity_admin_file }}"
        - "{{ identity_kubeconfig }}"
      register: identity_inputs
      failed_when: not identity_inputs.stat.exists

    - name: Apply bootstrap secret without exposing the password
      ansible.builtin.shell: |
        set -euo pipefail
        password=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["password"])' '{{ identity_admin_file }}')
        test -n "$password"
        kubectl --kubeconfig '{{ identity_kubeconfig }}' -n '{{ identity_namespace }}' create secret generic identity-bootstrap-admin \
          --from-literal=password="$password" --dry-run=client -o yaml |
          kubectl --kubeconfig '{{ identity_kubeconfig }}' -n '{{ identity_namespace }}' apply -f - >/dev/null
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Verify bootstrap secret key exists without reading its value
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ identity_kubeconfig }} -n {{ identity_namespace }} get secret identity-bootstrap-admin -o jsonpath='{.data.password}'
      register: identity_secret_check
      changed_when: false
      no_log: true
      failed_when: identity_secret_check.stdout | length == 0

    - name: Report secret sync result
      ansible.builtin.debug:
        msg: "identity-bootstrap-admin is present in namespace {{ identity_namespace }}"
