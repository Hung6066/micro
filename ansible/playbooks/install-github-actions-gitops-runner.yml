---
- name: Install the dedicated GitHub Actions GitOps mirror runner
  hosts: gitops_runners
  become: true
  gather_facts: true
  vars:
    runner_user: github-runner
    runner_root: /opt/actions-runner
    runner_labels: self-hosted,linux,gitops-mirror
    runner_arch: x64
    e2e_hosts:
      - app.his-hope.local
      - dashboard.his-hope.local
      - admin.his-hope.local
    runner_version: "{{ vault_github_actions_runner_version }}"
    runner_sha256: "{{ vault_github_actions_runner_sha256 }}"
    runner_download_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    git_mirror_host: git-mirror.his-hope.local
    git_mirror_vip: 172.16.102.100
    git_mirror_ca_chain_src: /mnt/d/secure/his-hope/vault_pki_ca_chain.pem
  tasks:
    - name: Require protected registration inputs
      ansible.builtin.assert:
        that:
          - vault_github_actions_url is match('^https://github.com/[^/]+/[^/]+$')
          - vault_github_actions_runner_token | length > 20
          - runner_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
          - runner_sha256 is match('^[a-f0-9]{64}$')
        fail_msg: Set all GitHub runner values in Ansible Vault before running this playbook.

    - name: Install runner prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, jq, tar]
        state: present
        update_cache: true

    - name: Install Microsoft package repository for PowerShell
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
        dest: /tmp/packages-microsoft-prod.deb
        mode: '0600'

    - name: Register Microsoft package repository
      ansible.builtin.command: dpkg -i /tmp/packages-microsoft-prod.deb
      args:
        creates: /etc/apt/sources.list.d/microsoft-prod.list

    - name: Install PowerShell for workflow pwsh steps
      ansible.builtin.apt:
        name: powershell
        state: present
        update_cache: true

    - name: Pin internal Git mirror address on the runner
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^\\S+\\s+{{ git_mirror_host | regex_escape }}$"
        line: "{{ git_mirror_vip }} {{ git_mirror_host }}"
        state: present

    - name: Pin protected E2E application hosts on the runner
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^\\S+\\s+{{ item | regex_escape }}$"
        line: "{{ git_mirror_vip }} {{ item }}"
        state: present
      loop: "{{ e2e_hosts }}"

    - name: Copy enterprise CA chain for the Git mirror
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', git_mirror_ca_chain_src) }}"
        dest: /tmp/his-hope-vault-pki-chain.pem
        mode: '0644'

    - name: Split enterprise CA chain into trust-store certificates
      ansible.builtin.shell: |
        set -euo pipefail
        rm -f /usr/local/share/ca-certificates/his-hope-vault-pki-*.crt
        csplit -s -f /tmp/his-hope-ca- /tmp/his-hope-vault-pki-chain.pem '/-----BEGIN CERTIFICATE-----/' '{*}' || true
        i=0
        for cert in /tmp/his-hope-ca-*; do
          if grep -q -- '-----BEGIN CERTIFICATE-----' "$cert"; then
            i=$((i + 1))
            cp "$cert" "/usr/local/share/ca-certificates/his-hope-vault-pki-$i.crt"
          fi
        done
      args:
        executable: /bin/bash

    - name: Refresh enterprise CA trust store
      ansible.builtin.command: update-ca-certificates
      changed_when: true

    - name: Create restricted runner user
      ansible.builtin.user:
        name: "{{ runner_user }}"
        system: true
        create_home: true
        home: "{{ runner_root }}"
        shell: /usr/sbin/nologin

    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_root }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0750"

    - name: Download pinned runner archive
      ansible.builtin.get_url:
        url: "{{ runner_download_url }}"
        dest: /tmp/actions-runner.tar.gz
        checksum: "sha256:{{ runner_sha256 }}"
        mode: "0600"

    - name: Extract runner
      ansible.builtin.unarchive:
        src: /tmp/actions-runner.tar.gz
        dest: "{{ runner_root }}"
        remote_src: true
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        creates: "{{ runner_root }}/run.sh"

    - name: Register runner with GitHub
      become_user: "{{ runner_user }}"
      ansible.builtin.command:
        argv:
          - "{{ runner_root }}/config.sh"
          - --unattended
          - --url
          - "{{ vault_github_actions_url }}"
          - --token
          - "{{ vault_github_actions_runner_token }}"
          - --name
          - "{{ inventory_hostname }}"
          - --labels
          - "{{ runner_labels }}"
          - --work
          - _work
          - --replace
        creates: "{{ runner_root }}/.runner"
      no_log: true

    - name: Install runner service
      ansible.builtin.command: "{{ runner_root }}/svc.sh install {{ runner_user }}"
      args:
        chdir: "{{ runner_root }}"
        creates: /etc/systemd/system/actions.runner.service
      changed_when: true

    - name: Start runner service
      ansible.builtin.command: "{{ runner_root }}/svc.sh start"
      args:
        chdir: "{{ runner_root }}"
      changed_when: true

    - name: Enable runner service
      ansible.builtin.systemd:
        name: actions.runner.service
        enabled: true
        daemon_reload: true

    - name: Remove downloaded archive
      ansible.builtin.file:
        path: /tmp/actions-runner.tar.gz
        state: absent
