---
- name: Install the dedicated GitHub Actions GitOps mirror runner
  hosts: gitops_runners
  become: true
  gather_facts: true
  vars:
    runner_user: github-runner
    runner_root: /opt/actions-runner
    runner_labels: self-hosted,linux,gitops-mirror
    runner_arch: x64
    runner_version: "{{ vault_github_actions_runner_version }}"
    runner_sha256: "{{ vault_github_actions_runner_sha256 }}"
    runner_download_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
  tasks:
    - name: Require protected registration inputs
      ansible.builtin.assert:
        that:
          - vault_github_actions_url is match('^https://github.com/[^/]+/[^/]+$')
          - vault_github_actions_runner_token | length > 20
          - runner_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
          - runner_sha256 is match('^[a-f0-9]{64}$')
        fail_msg: Set all GitHub runner values in Ansible Vault before running this playbook.

    - name: Install runner prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, jq, tar]
        state: present
        update_cache: true

    - name: Create restricted runner user
      ansible.builtin.user:
        name: "{{ runner_user }}"
        system: true
        create_home: true
        home: "{{ runner_root }}"
        shell: /usr/sbin/nologin

    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_root }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0750"

    - name: Download pinned runner archive
      ansible.builtin.get_url:
        url: "{{ runner_download_url }}"
        dest: /tmp/actions-runner.tar.gz
        checksum: "sha256:{{ runner_sha256 }}"
        mode: "0600"

    - name: Extract runner
      ansible.builtin.unarchive:
        src: /tmp/actions-runner.tar.gz
        dest: "{{ runner_root }}"
        remote_src: true
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        creates: "{{ runner_root }}/run.sh"

    - name: Register runner with GitHub
      become_user: "{{ runner_user }}"
      ansible.builtin.command:
        argv:
          - "{{ runner_root }}/config.sh"
          - --unattended
          - --url
          - "{{ vault_github_actions_url }}"
          - --token
          - "{{ vault_github_actions_runner_token }}"
          - --name
          - "{{ inventory_hostname }}"
          - --labels
          - "{{ runner_labels }}"
          - --work
          - _work
          - --replace
        creates: "{{ runner_root }}/.runner"
      no_log: true

    - name: Install runner service
      ansible.builtin.command: "{{ runner_root }}/svc.sh install {{ runner_user }}"
      args:
        chdir: "{{ runner_root }}"
        creates: /etc/systemd/system/actions.runner.service
      changed_when: true

    - name: Start runner service
      ansible.builtin.command: "{{ runner_root }}/svc.sh start"
      args:
        chdir: "{{ runner_root }}"
      changed_when: true

    - name: Enable runner service
      ansible.builtin.systemd:
        name: actions.runner.service
        enabled: true
        daemon_reload: true

    - name: Remove downloaded archive
      ansible.builtin.file:
        path: /tmp/actions-runner.tar.gz
        state: absent
