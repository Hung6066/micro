---
- name: Validate mirror prerequisites
  ansible.builtin.assert:
    that:
      - git_mirror_kubeconfig is file
      - git_mirror_issuer_manifest is file
      - git_mirror_ca_bundle_src is file
    fail_msg: "Kubeconfig not found: {{ git_mirror_kubeconfig }}"

- name: Apply Vault PKI issuer for the Git mirror
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ git_mirror_kubeconfig }}"
      - apply
      - -f
      - "{{ git_mirror_issuer_manifest }}"
  changed_when: "'created' in git_mirror_issuer_apply.stdout or 'configured' in git_mirror_issuer_apply.stdout"
  register: git_mirror_issuer_apply

- name: Inject protected Vault CA bundle into the issuer
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ git_mirror_kubeconfig }}"
      - patch
      - clusterissuer
      - vault-issuer-gitops-mirror
      - --type=merge
      - --patch
      - "{{ {'spec': {'vault': {'caBundle': lookup('ansible.builtin.file', git_mirror_ca_bundle_src) | b64encode}}} | to_json }}"
  changed_when: true

- name: Apply internal Git mirror manifests
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ git_mirror_kubeconfig }}"
      - apply
      - -k
      - "{{ git_mirror_manifest_dir }}"
  register: git_mirror_apply
  changed_when: "'configured' in git_mirror_apply.stdout or 'created' in git_mirror_apply.stdout"

- name: Wait for Gitea rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ git_mirror_kubeconfig }}"
      - -n
      - git-mirror
      - rollout
      - status
      - deployment/gitea
      - --timeout=180s
  changed_when: false

- name: Verify internal Git mirror service
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ git_mirror_kubeconfig }}"
      - -n
      - git-mirror
      - get
      - svc/gitea
      - -o
      - jsonpath={.spec.clusterIP}
  register: git_mirror_service
  changed_when: false

- name: Report internal Git mirror endpoint
  ansible.builtin.debug:
    msg: "Gitea endpoint: http://gitea.git-mirror.svc.cluster.local:3000 (ClusterIP {{ git_mirror_service.stdout }})"
