---
- name: Create K3s agent configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write K3s agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Wait for K3s API registration endpoint
  ansible.builtin.wait_for:
    host: "{{ k3s_api_registration_endpoint }}"
    port: "{{ k3s_api_registration_port }}"
    timeout: 120

- name: Download the pinned K3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/src/k3s-install.sh
    checksum: "{{ k3s_install_script_checksum }}"
    owner: root
    group: root
    mode: '0700'

- name: Install version-pinned K3s agent
  ansible.builtin.command: /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
  args:
    creates: /usr/local/bin/k3s
  no_log: true

- name: Ensure K3s agent is enabled and started
  ansible.builtin.systemd_service:
    name: k3s-agent
    enabled: true
    state: started

- name: Apply worker labels
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl label node {{ inventory_hostname }} {{ item }} --overwrite
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  loop: "{{ k3s_worker_labels | default([]) }}"
  changed_when: true
  register: k3s_worker_label_result
  retries: 12
  delay: 5
  until: k3s_worker_label_result.rc == 0
