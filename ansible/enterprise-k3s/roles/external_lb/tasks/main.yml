---
- name: Install HAProxy and Keepalived
  ansible.builtin.apt:
    name:
      - haproxy
      - keepalived
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap for the load-balancer host
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Create HAProxy certificate directory
  ansible.builtin.file:
    path: /etc/haproxy/certs
    state: directory
    owner: root
    group: haproxy
    mode: '0750'

- name: Install Harbor public certificate bundle
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', lb_harbor_public_cert_src) }}\n{{ lookup('ansible.builtin.file', lb_harbor_public_key_src) }}\n"
    dest: /etc/haproxy/certs/harbor-public.pem
    owner: root
    group: haproxy
    mode: '0640'
  notify: Restart HAProxy

- name: Install Harbor backend CA
  ansible.builtin.copy:
    src: "{{ lb_harbor_backend_ca_src }}"
    dest: /etc/haproxy/certs/harbor-backend-ca.pem
    owner: root
    group: haproxy
    mode: '0640'
  notify: Restart HAProxy

- name: Install HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart HAProxy

- name: Install Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart Keepalived

- name: Validate HAProxy configuration
  ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
  changed_when: false

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started

- name: Enable and start Keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
