---
# Protected procedure: rotate K3s datastore encryption keys and re-encrypt
# existing Kubernetes Secrets. Run only from the protected workflow after a
# fresh etcd snapshot and an approved maintenance window.
- name: Rotate K3s secrets encryption keys
  hosts: k3s_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_secrets_rotation_approved: false
    k3s_rotation_snapshot_path: ''
  pre_tasks:
    - name: Require explicit rotation approval
      ansible.builtin.assert:
        that:
          - k3s_secrets_rotation_approved | bool
        fail_msg: Set k3s_secrets_rotation_approved=true only from the protected rotation workflow.
    - name: Confirm K3s API is ready before rotation
      ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
      register: k3s_readyz_before
      changed_when: false
      failed_when: k3s_readyz_before.rc != 0 or (k3s_readyz_before.stdout | trim) != 'ok'
    - name: Require a fresh etcd snapshot before rotation
      ansible.builtin.stat:
        path: "{{ k3s_rotation_snapshot_path }}"
      register: k3s_rotation_snapshot
      when: inventory_hostname == groups['k3s_servers'][0]
    - name: Assert snapshot exists on the first control-plane server
      ansible.builtin.assert:
        that:
          - k3s_rotation_snapshot_path | length > 0
          - k3s_rotation_snapshot.stat.exists | bool
        fail_msg: A reviewed etcd snapshot path is required before encryption rotation.
      when: inventory_hostname == groups['k3s_servers'][0]
  tasks:
    - name: Read encryption status before rotation
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: k3s_encryption_before
      changed_when: false

    - name: Require encryption to be enabled before rotation
      ansible.builtin.assert:
        that:
          - k3s_encryption_before.stdout is search('Encryption Status: Enabled')
        fail_msg: K3s secrets encryption must already be enabled; aborting rotation.

    - name: Rotate K3s encryption keys once on the first control-plane server
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt rotate-keys
      when: inventory_hostname == groups['k3s_servers'][0]
      register: k3s_rotate_keys
      changed_when: true

    - name: Wait for K3s to finish re-encrypting existing Secrets on the first server
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: k3s_reencrypt_status
      retries: 120
      delay: 5
      until: "k3s_reencrypt_status.rc == 0 and k3s_reencrypt_status.stdout is search('Current Rotation Stage: reencrypt_finished')"
      changed_when: false
      when: inventory_hostname == groups['k3s_servers'][0]

    - name: Restart this control-plane member after rotation
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for this control-plane API after rotation
      ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
      register: k3s_readyz_after
      retries: 36
      delay: 5
      until: k3s_readyz_after.rc == 0 and (k3s_readyz_after.stdout | trim) == 'ok'
      changed_when: false

    - name: Read encryption status after rotation
      ansible.builtin.command: /usr/local/bin/k3s secrets-encrypt status
      register: k3s_encryption_after
      changed_when: false

    - name: Require rotated encryption status
      ansible.builtin.assert:
        that:
          - k3s_encryption_after.stdout is search('Encryption Status: Enabled')
          - k3s_encryption_after.stdout is search('Reencrypt Finished: true')
        fail_msg: K3s encryption rotation or re-encryption did not finish on {{ inventory_hostname }}.
