lb_interface: ens192
lb_vip: 172.16.102.100
lb_vip_cidr: 24
lb_virtual_router_id: 52
lb_keepalived_auth_pass: "{{ vault_lb_keepalived_auth_pass }}"

lb_k3s_api_port: 6443
lb_k3s_api_backends:
  - name: k3s-server-1
    address: 172.16.102.7
  - name: k3s-server-2
    address: 172.16.102.8
  - name: k3s-server-3
    address: 172.16.102.9

lb_ingress_http_port: 80
lb_ingress_http_node_port: 30080
lb_ingress_backends:
  - name: k3s-worker-1
    address: 172.16.102.10
  - name: k3s-worker-2
    address: 172.16.102.12

# Harbor registry HTTPS and the internal Git mirror share the VIP on the
# standard HTTPS port. HAProxy only inspects SNI and passes TLS through so
# cert-manager/Vault can rotate backend certificates without private keys on
# the load balancers.
lb_harbor_https_port: 443
# Route the public hostname through Traefik so the harbor-public ingress can
# select harbor-public-tls. Harbor's internal nginx NodePort (30003) serves
# the legacy harbor.his-hope.local certificate and must not terminate the
# public hostname.
lb_harbor_https_node_port: 30443
lb_harbor_https_backends:
  - name: k3s-worker-1
    address: 172.16.102.10
  - name: k3s-worker-2
    address: 172.16.102.12

# Internal Git mirror is routed by SNI on the same VIP.
lb_git_mirror_host: git-mirror.his-hope.local
lb_git_mirror_https_node_port: 30443
lb_git_mirror_backends:
  - name: k3s-worker-1
    address: 172.16.102.10
  - name: k3s-worker-2
    address: 172.16.102.12
