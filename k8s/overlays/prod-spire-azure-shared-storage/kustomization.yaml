apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production data-plane variant for the externally managed Viettel CSI class.
# The CSI driver, StorageClass and snapshot controller are platform-owned and
# must exist before Argo CD is allowed to sync this overlay.
resources:
  - ../prod-spire-azure

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: .*
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: viettel-shared
  - target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: .*
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: viettel-shared
