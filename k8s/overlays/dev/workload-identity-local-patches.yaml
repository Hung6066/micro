apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  template:
    spec:
      containers:
        - name: patient-service
          env:
            - name: Vault__Address
              value: https://vault-active.his-hope-dev.svc.cluster.local:8200
            - name: Vault__AuthMount
              value: kubernetes
            - name: Vault__Role
              value: patient-service
            - name: Vault__JwtTokenFile
              value: /var/run/secrets/tokens/vault
            - name: Vault__RequireVault
              value: "true"
            - name: Vault__AllowStaticToken
              value: "false"
          volumeMounts:
            - name: vault-workload-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: vault-workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault
                  audience: vault
                  expirationSeconds: 3600
---
