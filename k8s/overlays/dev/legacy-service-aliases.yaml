# Compatibility DNS names for the existing API Gateway/BFF route manifests.
# Docker Compose uses these names; the dev k3d topology keeps them as aliases
# until all route configuration is environment-driven.
apiVersion: v1
kind: Service
metadata:
  name: apigateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http-compose
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http-compose
      port: 5001
      targetPort: 5003
    - name: grpc-compose
      port: 5012
      targetPort: 5007
---
