apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-app
spec:
  template:
    spec:
      containers:
        - name: dashboard-app
          command: ["/bin/sh", "-c"]
          args:
            - >-
              sed -e 's#resolver 127.0.0.11#resolver 10.43.0.10#g' -e 's#apigateway:5000#apigateway.his-hope-dev.svc.cluster.local:5000#g' -e 's#systemdashboard-bff:5700#systemdashboard-bff.his-hope-dev.svc.cluster.local:5700#g' -e 's#proxy_pass \$upstream_gateway;#proxy_pass http://apigateway.his-hope-dev.svc.cluster.local:5000;#g' -e 's#proxy_pass \$upstream_backend;#proxy_pass http://systemdashboard-bff.his-hope-dev.svc.cluster.local:5700;#g'
              /etc/nginx/conf.d/default.conf > /tmp/default.conf;
              cp /etc/nginx/nginx.conf /tmp/nginx.conf;
              sed -i 's#/etc/nginx/conf.d/\*\.conf#/tmp/default.conf#g'
              /tmp/nginx.conf;
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
