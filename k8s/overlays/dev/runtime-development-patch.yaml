apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
data:
  ASPNETCORE_ENVIRONMENT: Development
  Jwt__AllowHttp: "true"
  # Share the Identity and BFF cookies across the local app subdomains.
  # Production uses the explicit parent domain from appsettings.Production.json.
  Authentication__CookieDomain: .his-hope.local
  Persistence__RunMigrationsOnStartup: "true"
  ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=identitydb;Username=his_hope;Password=postgres
  RabbitMQ__Host: rabbitmq
  EventBus__HostName: rabbitmq
  EventBus__UserName: his_hope
  EventBus__Password: rabbitmq
  EventBus__Port: "5672"
  Redis__ConnectionString: redis:6379
  ConnectionStrings__Redis: redis:6379,abortConnect=false
  vault_address: ""
---
