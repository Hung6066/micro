apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-production-egress
  namespace: his-hope-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: his-hope
      ports:
        - port: 80
          protocol: TCP
        - port: 5000
          protocol: TCP
        - port: 5003
          protocol: TCP
        - port: 5100
          protocol: TCP
        - port: 5200
          protocol: TCP
        - port: 5300
          protocol: TCP
        - port: 5400
          protocol: TCP
        - port: 5500
          protocol: TCP
        - port: 5700
          protocol: TCP
    # k3d kube-proxy rewrites ClusterIP and endpoint traffic before the
    # namespace selector is evaluated. Keep the local cluster CIDRs explicit
    # so Traefik can reach production BFF endpoints, not only port 80 shells.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 5000
          protocol: TCP
        - port: 5003
          protocol: TCP
        - port: 5100
          protocol: TCP
        - port: 5200
          protocol: TCP
        - port: 5300
          protocol: TCP
        - port: 5400
          protocol: TCP
        - port: 5500
          protocol: TCP
        - port: 5700
          protocol: TCP
