apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: his-hope-dev

namePrefix: his-hope-

commonLabels:
  app.kubernetes.io/part-of: his-hope
  app.kubernetes.io/managed-by: kustomize
  environment: dev

bases:
  - ../../base

resources:
  - ../../linkerd/server.yaml
  - ../../linkerd/server-authorization.yaml
  - ../../linkerd/traffic-split.yaml
  - ../../linkerd/service-profiles.yaml
  - ../../linkerd/pod-monitor.yaml
  - ../../infrastructure/pgbouncer-configmap.yaml
  - ../../infrastructure/pgbouncer-secret.yaml
  - ../../infrastructure/unleash-deployment.yaml
  - ../../priority/priority-classes.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 128m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
