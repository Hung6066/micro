    app.kubernetes.io/name: rabbitmq-secret
    app.kubernetes.io/component: messaging
type: Opaque
stringData:
  password: ${DEV_RABBITMQ_PASSWORD}
  erlang_cookie: ${DEV_RABBITMQ_ERLANG_COOKIE}
