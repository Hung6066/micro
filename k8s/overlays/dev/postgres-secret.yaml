apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/component: database
type: Opaque
stringData:
  password: ${DEV_POSTGRES_PASSWORD}
  clinical_connection_string: ""
  patient_connection_string: ""
  identity_connection_string: ""
  appointment_connection_string: ""
