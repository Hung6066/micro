apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: api-gateway
          env:
            - name: Otlp__Endpoint
              valueFrom: {configMapKeyRef: {name: runtime-contract-config, key: OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT}}
---
