apiVersion: v1
kind: Secret
metadata:
  name: unleash-secret
type: Opaque
stringData:
  DATABASE_URL: postgres://his_hope:postgres@postgres:5432/unleashdb?sslmode=disable
  INIT_ADMIN_API_TOKENS: '*:*.development.unleash-internal'
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
spec:
  selector:
    app.kubernetes.io/name: unleash
  ports:
    - name: http-api
      port: 4242
      targetPort: 4242
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unleash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unleash
        app: unleash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unleash
          image: unleashorg/unleash-server:6.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http-api
              containerPort: 4242
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unleash-secret
                  key: DATABASE_URL
            - name: DATABASE_SSL
              value: "false"
            - name: INIT_ADMIN_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: unleash-secret
                  key: INIT_ADMIN_API_TOKENS
            - name: LOG_LEVEL
              value: warn
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
