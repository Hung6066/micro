apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-app-to-systemdashboard-bff
spec:
  podSelector:
    matchLabels:
      app: dashboard-app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: systemdashboard-bff
      ports:
        - protocol: TCP
          port: 5700
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-app-ingress-to-systemdashboard-bff
spec:
  podSelector:
    matchLabels:
      app: systemdashboard-bff
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dashboard-app
      ports:
        - protocol: TCP
          port: 5700
