apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This overlay is intentionally separate from the normal production overlay.
# It is usable only after the storage owner installs and approves the external
# CSI StorageClass named "viettel-shared" (vSAN CSI or NFS CSI). It never
# installs a fake StorageClass and therefore fails at PVC binding until the
# platform prerequisite is present.
resources:
  - ../prod

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: .*
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: viettel-shared
  - target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: .*
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: viettel-shared
