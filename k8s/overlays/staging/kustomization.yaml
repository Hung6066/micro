apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: his-hope-staging

namePrefix: his-hope-

commonLabels:
  app.kubernetes.io/part-of: his-hope
  app.kubernetes.io/managed-by: kustomize
  environment: staging

bases:
  - ../../base

resources:
  - ../../base/postgres.yaml
  - ../../base/postgres-pdb.yaml
  - ../../base/rabbitmq.yaml
  - ../../base/redis.yaml
  - ../../linkerd/traffic-split-crd.yaml
  - ../../base/seccomp-profiles.yaml
  - ../../base/seccomp-daemonset.yaml
  - ../../linkerd/server.yaml
  - ../../linkerd/server-authorization.yaml
  - ../../linkerd/traffic-split.yaml
  - ../../linkerd/service-profiles.yaml
  - ../../linkerd/pod-monitor.yaml
  - ../../infrastructure/pgbouncer-configmap.yaml
  - ../../infrastructure/pgbouncer-secret.yaml
  - ../../infrastructure/unleash-deployment.yaml
  - ../../priority/priority-classes.yaml
patchesStrategicMerge:
  - runtime-contract-patch.yaml
  - namespace-policy-patch.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
