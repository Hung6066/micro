apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: his-hope-staging

namePrefix: his-hope-

commonLabels:
  app.kubernetes.io/part-of: his-hope
  app.kubernetes.io/managed-by: kustomize
  environment: staging

bases:
  - ../../base

resources:
  - ../../base/postgres.yaml
  - ../../base/postgres-pdb.yaml
  - ../../base/rabbitmq.yaml
  - ../../base/redis.yaml
  - ../../linkerd/traffic-split-crd.yaml
  - ../../base/seccomp-profiles.yaml
  - ../../linkerd/server.yaml
  - ../../linkerd/server-authorization.yaml
  - ../../linkerd/traffic-split.yaml
  - ../../linkerd/service-profiles.yaml
  - ../../linkerd/pod-monitor.yaml
  - ../../infrastructure/pgbouncer-configmap.yaml
  - ../../infrastructure/pgbouncer-secret.yaml
  - ../../infrastructure/unleash-deployment.yaml
  - ../../priority/priority-classes.yaml

# The production branch is the reviewed release source for every Argo
# application. Reuse the signed Harbor digest component so staging cannot
# bypass the cluster-wide image signature policy with mutable :latest tags.
components:
  - ../prod/image-digests

patchesStrategicMerge:
  - runtime-contract-patch.yaml
  - namespace-policy-patch.yaml
  # Existing staging PVCs are bound to k3s local-path. Keep the immutable
  # StatefulSet claim template aligned with the live storage contract.
  - storage-class-postgres-patch.yaml
  - storage-class-redis-patch.yaml
  - storage-class-rabbitmq-patch.yaml

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=his-hope
    path: linkerd-digest-patch.yaml

  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
