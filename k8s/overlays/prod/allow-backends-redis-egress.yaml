apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-redis-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Redis Cluster advertises pod IPs in MOVED responses; permit the
    # pod network explicitly so clients can follow those redirects.
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 6379
