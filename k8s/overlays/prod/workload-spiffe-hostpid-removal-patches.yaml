# The SPIRE socket fetcher does not require access to the host process
# namespace. Keep hostPID disabled while the remaining socket integration is
# migrated only after Vault Kubernetes-auth smoke tests pass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  template:
    spec:
      hostPID: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: appointment-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
---
