apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      hostPID: false
      containers:
        - name: identity-service
          env:
            - name: Vault__AuthMethod
              value: kubernetes
            - name: Vault__AuthMount
              value: kubernetes
            - name: Vault__JwtTokenFile
              value: /var/run/secrets/tokens/vault
            - name: Vault__SpiffeJwtTokenFile
              $patch: delete
            - name: Vault__SpiffeAudience
              $patch: delete
          volumeMounts:
            - name: vault-jwt
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: vault-jwt
          projected:
            sources:
              - serviceAccountToken:
                  path: vault
                  audience: vault
                  expirationSeconds: 3600
