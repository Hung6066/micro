# The two workers are currently request-saturated. Permit backend replicas to
# use a tainted control-plane node as a capacity fallback; the scheduler still
# prefers workers and no workload is forced onto a control-plane node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
---
