# Complete the restricted production container contract for every application
# container. Strategic merge preserves existing image-specific users/groups,
# mounts and probes while adding only the admission-required fields.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
