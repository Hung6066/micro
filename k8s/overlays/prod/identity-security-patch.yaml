apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  template:
    spec:
      volumes:
        - name: identity-service-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: identity-service-secrets
      containers:
        - name: identity-service
          env:
            - name: AllowedHosts
              value: "*"
            - name: ASPNETCORE_AllowedHosts
              value: "*"
            - name: Persistence__RunMigrationsOnStartup
              value: "false"
            - name: Ldap__Enabled
              value: "false"
            - name: Redis__TlsCaFile
              value: "/etc/tls/redis/ca.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/ca-certificates.crt"
            - name: OpenIddict__Signing__PrivateKeyPath
              value: "/mnt/secrets-store/jwt_private_key"
            - name: Jwt__RsaPublicKeyPath
              value: "/mnt/secrets-store/jwt_public_key"
            - name: OpenIddict__Encryption__PrivateKeyPath
              value: "/mnt/oidc-secrets/private_key"
            - name: Saml2__IdPMetadata
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: Saml2__IdPMetadata
            - name: Ldap__Server
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: Ldap__Server
            - name: Ldap__BindDn
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: Ldap__BindDn
            - name: Ldap__BindPassword
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: Ldap__BindPassword
            - name: Ldap__SearchBase
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: Ldap__SearchBase
            - name: PushProviders__FirebaseCredentialsJson
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: PushProviders__FirebaseCredentialsJson
            - name: PushProviders__ApnsKeyId
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: PushProviders__ApnsKeyId
            - name: PushProviders__ApnsTeamId
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: PushProviders__ApnsTeamId
            - name: PushProviders__ApnsPrivateKey
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: PushProviders__ApnsPrivateKey
            - name: PushProviders__ApnsBundleId
              $patch: replace
              valueFrom:
                secretKeyRef:
                  name: identity-service-security
                  key: PushProviders__ApnsBundleId
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
          startupProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
          volumeMounts:
            - name: identity-service-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
