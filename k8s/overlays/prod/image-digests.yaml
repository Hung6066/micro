patches:
  #############################################################################
  # Set imagePullPolicy to IfNotPresent when using pinned digests
  #############################################################################
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=his-hope"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: StatefulSet
      labelSelector: "app.kubernetes.io/part-of=his-hope"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
