# =============================================================================
# DEPRECATED: production now consumes image-digests/kustomization.yaml.
# Keep this historical file for migration traceability; do not update it.
#
# His.Hope Production Image Digest Pinning Component
#
# This Kustomize component pins all container images to their content-addressable
# digests (SHA256). This ensures immutable, verifiable deployments.
#
# USAGE:
#   The canonical production overlay includes:
#     k8s/overlays/prod/image-digests/kustomization.yaml
#
# WORKFLOW (Cosign-based signing & verification):
#   1. After building an image, tag it and push:
#      docker tag his-hope/api-gateway:1.0.0 registry.example.com/his-hope/api-gateway:1.0.0
#      docker push registry.example.com/his-hope/api-gateway:1.0.0
#
#   2. Sign the image with Cosign (key-based):
#      cosign sign --key cosign.key registry.example.com/his-hope/api-gateway@sha256:<digest>
#
#   3. Verify the signature before deployment:
#      cosign verify --key cosign.pub registry.example.com/his-hope/api-gateway@sha256:<digest>
#
#   4. Update this file with the resolved digest:
#      docker inspect --format='{{index .RepoDigests 0}}' his-hope/api-gateway:1.0.0
#      # Output: registry.example.com/his-hope/api-gateway@sha256:abc123...
#
#   5. The ArgoCD PR will gate on Cosign verification via a pre-sync hook.
#
# COSIGN VERIFICATION GATE (ArgoCD Pre-Sync):
#   Create an ArgoCD ResourceHook that runs cosign verify before applying:
#   ---
#   apiVersion: argoproj.io/v1alpha1
#   kind: ArgoCD
#   spec:
#     resourceHooks:
#       - name: cosign-verify
#         events: ["Sync"]
#         selector:
#           apps: "true"
#         commands:
#           - args: ["cosign", "verify", "--key", "/etc/cosign/cosign.pub", 
#                    "{{.metadata.annotations.cosign/image}}"]
#           - args: ["cosign", "verify-attestation", "--key", "/etc/cosign/cosign.pub",
#                    "{{.metadata.annotations.cosign/image}}"]
#
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

