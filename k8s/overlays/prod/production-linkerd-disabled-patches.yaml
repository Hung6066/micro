# Explicit per-resource patches avoid relying on namespace-wide Linkerd
# injection. The restricted production admission policy remains fail-closed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
