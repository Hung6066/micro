apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-local
  namespace: his-hope
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # This profile uses a NodePort for the internal edge; there is no
    # LoadBalancer status for Argo CD to observe. Route reachability is
    # validated by the protected HTTP smoke gate instead.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: identity.his-hope.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: his-hope-identity-service
                port:
                  number: 5003
    - host: admin.his-hope.local
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /connect
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /Account
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/auth
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/federation
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/admin
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/admin
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: his-hope-admin-app, port: { number: 80 } } }
    - host: dashboard.his-hope.local
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /connect
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /Account
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/auth
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/federation
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/admin
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/resources
            pathType: Prefix
            backend: { service: { name: his-hope-systemdashboard-bff, port: { number: 5700 } } }
          - path: /api/alerts
            pathType: Prefix
            backend: { service: { name: his-hope-systemdashboard-bff, port: { number: 5700 } } }
          - path: /api/traces
            pathType: Prefix
            backend: { service: { name: his-hope-systemdashboard-bff, port: { number: 5700 } } }
          - path: /api/metrics
            pathType: Prefix
            backend: { service: { name: his-hope-systemdashboard-bff, port: { number: 5700 } } }
          - path: /api/logs
            pathType: Prefix
            backend: { service: { name: his-hope-systemdashboard-bff, port: { number: 5700 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: his-hope-dashboard-app, port: { number: 80 } } }
    - host: app.his-hope.local
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /connect
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /Account
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/auth
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/federation
            pathType: Prefix
            backend: { service: { name: his-hope-identity-service, port: { number: 5003 } } }
          - path: /api/v1/admin
            pathType: Prefix
            backend: { service: { name: his-hope-api-gateway, port: { number: 5000 } } }
          - path: /api/v1/appointments
            pathType: Prefix
            backend: { service: { name: his-hope-api-gateway, port: { number: 5000 } } }
          - path: /hubs/lab-critical-alerts
            pathType: Prefix
            backend: { service: { name: his-hope-api-gateway, port: { number: 5000 } } }
          - path: /api/v1/patients
            pathType: Prefix
            backend: { service: { name: his-hope-patient-bff, port: { number: 5100 } } }
          - path: /api/v1/clinical
            pathType: Prefix
            backend: { service: { name: his-hope-clinical-bff, port: { number: 5200 } } }
          - path: /api/v1/lab
            pathType: Prefix
            backend: { service: { name: his-hope-lab-bff, port: { number: 5300 } } }
          - path: /api/v1/labs
            pathType: Prefix
            backend: { service: { name: his-hope-lab-bff, port: { number: 5300 } } }
          - path: /api/v1/lab-orders
            pathType: Prefix
            backend: { service: { name: his-hope-lab-bff, port: { number: 5300 } } }
          - path: /api/v1/critical-alerts
            pathType: Prefix
            backend: { service: { name: his-hope-lab-bff, port: { number: 5300 } } }
          - path: /api/v1/critical-alert-rules
            pathType: Prefix
            backend: { service: { name: his-hope-lab-bff, port: { number: 5300 } } }
          - path: /api/v1/billing
            pathType: Prefix
            backend: { service: { name: his-hope-billing-bff, port: { number: 5400 } } }
          - path: /api/v1/pharmacy
            pathType: Prefix
            backend: { service: { name: his-hope-pharmacy-bff, port: { number: 5500 } } }
          # Keep the canonical resource URLs on the app host while routing
          # them to their BFFs before the generic API gateway fallback.
          - path: /api/v1/encounters
            pathType: Prefix
            backend: { service: { name: his-hope-clinical-bff, port: { number: 5200 } } }
          - path: /api/v1/invoices
            pathType: Prefix
            backend: { service: { name: his-hope-billing-bff, port: { number: 5400 } } }
          - path: /api/v1/medications
            pathType: Prefix
            backend: { service: { name: his-hope-pharmacy-bff, port: { number: 5500 } } }
          - path: /api/v1/prescriptions
            pathType: Prefix
            backend: { service: { name: his-hope-pharmacy-bff, port: { number: 5500 } } }
          - path: /api/v1/dashboard
            pathType: Prefix
            backend: { service: { name: his-hope-dashboard-bff, port: { number: 5600 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: his-hope-api-gateway, port: { number: 5000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: his-hope-frontend, port: { number: 80 } } }
