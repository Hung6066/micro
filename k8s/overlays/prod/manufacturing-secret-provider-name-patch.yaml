# namePrefix does not rewrite the CSI volumeAttributes.secretProviderClass
# scalar. Keep the references aligned with the prefixed SecretProviderClass
# resources rendered by this overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-service
spec:
  template:
    spec:
      volumes:
        - name: vault-secrets
          csi:
            volumeAttributes:
              secretProviderClass: his-hope-commerce-service-secrets
---
