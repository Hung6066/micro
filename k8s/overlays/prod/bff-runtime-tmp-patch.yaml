# Strategic merge keeps any existing secret, TLS, or identity mounts and adds
# the writable /tmp volume required by read-only .NET runtime filesystems.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-bff
spec:
  template:
    spec:
      volumes:
        - name: runtime-tmp
          emptyDir: {}
      containers:
        - name: billing-bff
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
---
