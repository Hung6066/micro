# Local k3d validation profile: keep the production contracts and security
# settings, but allow the single-node-capacity test cluster to converge.
# Production HA overlays must override these minima explicitly.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appointment-service
spec:
  minReplicas: 1
  maxReplicas: 1
