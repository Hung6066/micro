# BFF sessions and Data Protection keys are stored in Redis. In production,
# validate the Redis server certificate against the provisioned CA rather than
# relying on the container trust store alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-bff
spec:
  template:
    spec:
      containers:
        - name: billing-bff
          env:
            - name: Redis__TlsCaFile
              value: /etc/tls/redis/ca.crt
          volumeMounts:
            - name: redis-tls-ca
              mountPath: /etc/tls/redis
              readOnly: true
      volumes:
        - name: redis-tls-ca
          secret:
            secretName: redis-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
