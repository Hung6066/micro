apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-continuity
spec:
  template:
    spec:
      containers:
        - name: database-continuity
          env:
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: systemdashboard-bff-secrets
                  key: redis-url
          volumeMounts:
            - name: redis-tls-ca
              mountPath: /etc/tls/redis/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: redis-tls-ca
          secret:
            secretName: redis-tls
            items:
              - key: ca.crt
                path: ca.crt
