# The checked-in localhost seccomp profile is not compatible with the current
# .NET 8 and PgBouncer runtime (SIGTRAP/Operation not permitted during exec).
# Keep workload privilege/capability restrictions, but use the container
# runtime's maintained profile until a node-specific audit profile is rebuilt
# and verified against every image in this overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault, localhostProfile: null }
      containers:
        - name: api-gateway
          securityContext: { seccompProfile: { type: RuntimeDefault, localhostProfile: null } }
---
