apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: his-hope
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: 7b77f09d8a38393df3a8cf0ab2e99bd6e6f1d9be
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-production
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [extensions]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-production
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: his-hope
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "false"
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: his-hope
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/component: ingress
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/version: 7b77f09d8a38393df3a8cf0ab2e99bd6e6f1d9be
      annotations:
        linkerd.io/inject: disabled
        # Traefik terminates ingress and forwards directly to HTTP services;
        # do not let its Linkerd sidecar proxy pod-endpoint traffic.
        config.linkerd.io/skip-subnets: "10.42.0.0/16,10.43.0.0/16"
        config.linkerd.io/skip-outbound-ports: "80,5002,5003,5004,5010,5100,5200,5300,5400,5500,5600,5700"
    spec:
      serviceAccountName: traefik
      # Keep ingress separate from BFF pods; this cluster's same-node
      # Linkerd/CNI path resets pod-to-pod connections.
      nodeSelector:
        kubernetes.io/hostname: k3s-server-3
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f
          imagePullPolicy: IfNotPresent
          args:
            - --api.insecure=false
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --ping=true
            - --ping.entrypoint=web
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            # Browser RUM uses a namespaced ExternalName service that points
            # only to the in-cluster OTLP collector. NetworkPolicy limits the
            # resulting egress to monitoring:4318.
            - --providers.kubernetesingress.allowexternalnameservices=true
            - --accesslog=false
            - --log.level=INFO
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: his-hope
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
      nodePort: 30080
    - name: websecure
      port: 443
      targetPort: 8443
      nodePort: 30443
