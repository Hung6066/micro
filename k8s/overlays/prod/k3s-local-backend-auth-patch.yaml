# Local K3s JWT key mounting compatibility. The final production overlay
# applies enterprise-runtime-security-patch.yaml after this file and enforces
# HTTPS metadata plus Jwt__AllowHttp=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  template:
    spec:
      volumes:
        - name: jwt-public-key
          secret:
            secretName: identity-service-jwt
            items:
              - key: public_key
                path: jwt_public_key
            defaultMode: 0444
      containers:
        - name: appointment-service
          volumeMounts:
            - name: jwt-public-key
              mountPath: /mnt/jwt-secrets
              readOnly: true
          env:
            - name: Jwt__AllowHttp
              value: "true"
            - name: Jwt__Authority
              value: http://his-hope-identity-service.his-hope.svc.cluster.local:5003
            - name: Jwt__MetadataAddress
              value: http://his-hope-identity-service.his-hope.svc.cluster.local:5003/.well-known/openid-configuration
            - name: Jwt__Issuer
              value: His.Hope.IdentityService
            - name: Jwt__RsaPublicKeyPath
              value: /mnt/jwt-secrets/jwt_public_key
---
