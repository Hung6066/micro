# The BFFs expose the canonical /health endpoint.  The old /health/ready
# probe was copied from the backend services and kept every BFF unready even
# after the process had started successfully.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-bff
spec:
  template:
    spec:
      containers:
        - name: billing-bff
          livenessProbe:
            httpGet:
              path: /health
          readinessProbe:
            httpGet:
              path: /health
