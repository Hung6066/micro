apiVersion: batch/v1
kind: CronJob
metadata:
  name: outbox-cleanup
  namespace: his-hope
  labels:
    app: outbox-cleanup
    component: data-lifecycle
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: outbox-cleanup
            component: data-lifecycle
        spec:
          serviceAccountName: outbox-cleanup
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            env:
            - name: PGHOST
              value: postgres-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: RETENTION_DAYS
              value: "30"
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              RETENTION_DAYS=${RETENTION_DAYS:-30}
              echo "=== Outbox Cleanup - $(date -u -Iseconds) ==="
              echo "Retention period: ${RETENTION_DAYS} days"
              DATABASES="patientdb appointmentdb clinicaldb identitydb labdb billingdb pharmacydb"
              for db in $DATABASES; do
                echo ">>> Cleaning ${db}.outbox_messages ..."
                psql -d "$db" -v ON_ERROR_STOP=1 -c "
                  DELETE FROM outbox_messages
                  WHERE status IN ('Completed', 'Skipped')
                    AND processed_on IS NOT NULL
                    AND processed_on < NOW() - INTERVAL '${RETENTION_DAYS} days';
                "
                echo "<<< Done: ${db}"
              done
              echo "=== Outbox cleanup completed successfully ==="
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-cleanup
  namespace: his-hope
  labels:
    app: outbox-cleanup
    component: data-lifecycle
