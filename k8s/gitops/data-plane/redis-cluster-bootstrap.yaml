apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: redis-cluster-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cluster-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-cli
          image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          command: ["sh", "-ec"]
          args:
            - |
              nodes="his-hope-redis-0.his-hope-redis.his-hope-data.svc.cluster.local:6379 his-hope-redis-1.his-hope-redis.his-hope-data.svc.cluster.local:6379 his-hope-redis-2.his-hope-redis.his-hope-data.svc.cluster.local:6379"
              for attempt in $(seq 1 60); do
                if redis-cli --tls --insecure -a "$REDIS_PASSWORD" -h his-hope-redis-0.his-hope-redis.his-hope-data.svc.cluster.local cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then
                  exit 0
                fi
                ready=1
                for node in $nodes; do
                  host=${node%:*}; port=${node#*:}
                  redis-cli --tls --insecure -a "$REDIS_PASSWORD" -h "$host" -p "$port" ping 2>/dev/null | grep -q PONG || ready=0
                done
                if [ "$ready" = 1 ]; then
                  echo yes | redis-cli --tls --insecure -a "$REDIS_PASSWORD" --cluster create $nodes --cluster-replicas 0 --cluster-yes >/tmp/cluster-create.log 2>&1 &
                  create_pid=$!
                  for check in $(seq 1 60); do
                    if redis-cli --tls --insecure -a "$REDIS_PASSWORD" -h his-hope-redis-0.his-hope-redis.his-hope-data.svc.cluster.local cluster info 2>/dev/null | grep -q '^cluster_state:ok'; then
                      kill "$create_pid" 2>/dev/null || true
                      wait "$create_pid" 2>/dev/null || true
                      exit 0
                    fi
                    sleep 2
                  done
                  cat /tmp/cluster-create.log >&2
                  kill "$create_pid" 2>/dev/null || true
                  wait "$create_pid" 2>/dev/null || true
                  exit 1
                fi
                sleep 5
              done
              echo 'Redis cluster did not become reachable before deadline' >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
