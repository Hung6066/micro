---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  template:
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: rabbitmq
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              $patch: replace
              drop: ["ALL"]
          volumeMounts:
            - name: rabbitmq-cookie
              $patch: delete
            - name: rabbitmq-cookie-runtime
              mountPath: /var/lib/rabbitmq/.erlang.cookie
              subPath: .erlang.cookie
              readOnly: true
      initContainers:
        - name: rabbitmq-cookie-init
          image: harbor.his-hope.local:9443/his-hope/busybox:1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          command: ["sh", "-c", "cp /bootstrap/.erlang.cookie /runtime/.erlang.cookie && chmod 0600 /runtime/.erlang.cookie"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rabbitmq-cookie-source
              mountPath: /bootstrap
              readOnly: true
            - name: rabbitmq-cookie-runtime
              mountPath: /runtime
      volumes:
        - name: rabbitmq-cookie
          $patch: delete
        - name: rabbitmq-cookie-source
          secret:
            secretName: rabbitmq-secret
            defaultMode: 0444
            items:
              - key: erlang_cookie
                path: .erlang.cookie
        - name: rabbitmq-cookie-runtime
          emptyDir: {}
