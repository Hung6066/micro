apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app-project.yaml
  - applications.yaml
  - argocd-health-config.yaml
  - argocd-repo-egress.yaml
  - argocd-repo-ca.yaml
patches:
  - path: application-retry-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: .*
