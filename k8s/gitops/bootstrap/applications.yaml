apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: his-hope-data-plane
  namespace: argocd
  annotations:
    his-hope.io/promotion-mode: reviewed-pr-manual-sync
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: his-hope
  source:
    repoURL: https://git-mirror.his-hope.local/gitops-admin/micro.git
    targetRevision: production
    path: k8s/gitops/data-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: his-hope-data
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - FailOnSharedResource=true
  revisionHistoryLimit: 10
---
