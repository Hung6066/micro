apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: his-hope-production
  namespace: argocd
  annotations:
    his-hope.io/auto-sync-approved: "true"
    his-hope.io/promotion-mode: reviewed-branch-auto-sync
spec:
  project: his-hope
  source:
    repoURL: https://git-mirror.his-hope.local/gitops-admin/micro.git
    targetRevision: production
    path: k8s/overlays/prod
  ignoreDifferences:
    # HPA owns replica counts at runtime; do not report a healthy deployment
    # OutOfSync solely because autoscaling changed spec.replicas.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: PersistentVolumeClaim
      name: his-hope-database-continuity-backups
      jsonPointers:
        - /spec/volumeName
  destination:
    server: https://kubernetes.default.svc
    namespace: his-hope
  # Production is reconciled automatically only after the reviewed production
  # branch reaches the internal mirror. The explicit approval annotation is
  # required by validate-argocd-bootstrap.ps1 and prevents accidental auto-sync
  # on unreviewed branches.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
  revisionHistoryLimit: 10
