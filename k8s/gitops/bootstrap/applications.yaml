apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: his-hope-production
  namespace: argocd
  annotations:
    his-hope.io/promotion-mode: reviewed-branch-auto-sync
    his-hope.io/auto-sync-approved: "true"
spec:
  project: his-hope
  source:
    repoURL: https://git-mirror.his-hope.local/gitops-admin/micro.git
    targetRevision: production
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: his-hope
  # The continuity backup claim is an existing bound local-path PVC. Its
  # controller-assigned volumeName is immutable and must not be reconciled.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: his-hope-database-continuity-backups
      namespace: his-hope
      jsonPointers:
        - /spec/volumeName
  # This branch is the reviewed deployment branch for the current production
  # change window. Argo continuously reconciles it after the GitHub push.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
      # Replace avoids stale client-side three-way patches from legacy
      # Deployment annotations (notably empty valueFrom/probe handlers).
      # The rendered production manifests remain the source of truth.
      - Replace=true
  revisionHistoryLimit: 10
