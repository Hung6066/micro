apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: his-hope-production
  namespace: argocd
  annotations:
    his-hope.io/promotion-mode: reviewed-branch-auto-sync
    his-hope.io/auto-sync-approved: "true"
spec:
  project: his-hope
  source:
    repoURL: http://gitea.git-mirror.svc.cluster.local:3000/gitops-admin/micro.git
    targetRevision: production
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: his-hope
  # This branch is the reviewed deployment branch for the current production
  # change window. Argo continuously reconciles it after the GitHub push.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
  revisionHistoryLimit: 10
