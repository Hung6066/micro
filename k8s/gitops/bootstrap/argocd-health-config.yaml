# Applied after the official Argo CD install manifest. Server-side apply merges
# these keys into argocd-cm and does not replace unrelated Argo configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  resource.customizations.health.apps_Deployment: |
    hs = {}
    if obj.status == nil then
      hs.status = "Progressing"
      hs.message = "Deployment status is not available"
    elseif obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
      hs.status = "Progressing"
      hs.message = "Waiting for the latest deployment generation"
    elseif obj.status.updatedReplicas ~= obj.spec.replicas then
      hs.status = "Progressing"
      hs.message = "Waiting for updated replicas"
    elseif obj.status.availableReplicas ~= obj.spec.replicas then
      hs.status = "Progressing"
      hs.message = "Waiting for available replicas"
    else
      hs.status = "Healthy"
      hs.message = "All replicas are available"
    end
    return hs
  resource.customizations.health.batch_Job: |
    hs = {}
    if obj.status ~= nil and obj.status.succeeded ~= nil and obj.status.succeeded > 0 then
      hs.status = "Healthy"
      hs.message = "Job completed successfully"
    elseif obj.status ~= nil and obj.status.failed ~= nil and obj.status.failed > 0 then
      hs.status = "Degraded"
      hs.message = "Job failed"
    else
      hs.status = "Progressing"
      hs.message = "Job is running"
    end
    return hs
  resource.customizations.health.v1_Service: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Service resource is present"
    return hs
  resource.customizations.health.policy.linkerd.io_Server: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          hs.status = "Healthy"
          hs.message = "Linkerd Server is ready"
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Linkerd Server Ready condition"
    return hs
  resource.customizations.health.monitoring.coreos.com_PrometheusRule: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Prometheus rule resource is accepted by the monitoring API"
    return hs
  resource.customizations.health.monitoring.coreos.com_ServiceMonitor: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "ServiceMonitor resource is accepted by the monitoring API"
    return hs
  resource.customizations.health.secrets-store.csi.x-k8s.io_SecretProviderClass: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "SecretProviderClass resource is present"
    return hs
