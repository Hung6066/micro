apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: observability
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: observability-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: observability
spec:
  provider: vault
  parameters:
    roleName: observability
    vaultAuthMountPath: "kubernetes"
    audience: "vault"
    vaultAddress: "https://vault-active.his-hope.svc.cluster.local:8200"
    vaultSkipTLSVerify: "false"
    vaultCACertPath: "/vault/tls/ca.crt"
    objects: |
      - objectName: "grafana_oidc_client_id"
        secretPath: "secret/data/his-hope/observability/grafana-oidc"
        secretKey: "client_id"
      - objectName: "grafana_oidc_client_secret"
        secretPath: "secret/data/his-hope/observability/grafana-oidc"
        secretKey: "client_secret"
      - objectName: "grafana_admin_username"
        secretPath: "secret/data/his-hope/observability/grafana-admin"
        secretKey: "username"
      - objectName: "grafana_admin_password"
        secretPath: "secret/data/his-hope/observability/grafana-admin"
        secretKey: "password"
      - objectName: "smtp_host"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_host"
      - objectName: "smtp_port"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_port"
      - objectName: "smtp_username"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_username"
      - objectName: "smtp_password"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_password"
      - objectName: "smtp_from"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_from"
      - objectName: "smtp_to"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "smtp_to"
      - objectName: "discord_webhook_url"
        secretPath: "secret/data/his-hope/observability/alertmanager"
        secretKey: "discord_webhook_url"
      - objectName: "remediation_webhook_token"
        secretPath: "secret/data/his-hope/operator/remediation"
        secretKey: "webhook_bearer_token"
      - objectName: "object_store_endpoint"
        secretPath: "secret/data/his-hope/observability/object-store"
        secretKey: "endpoint"
      - objectName: "object_store_bucket"
        secretPath: "secret/data/his-hope/observability/object-store"
        secretKey: "bucket"
      - objectName: "object_store_region"
        secretPath: "secret/data/his-hope/observability/object-store"
        secretKey: "region"
      - objectName: "object_store_access_key_id"
        secretPath: "secret/data/his-hope/observability/object-store"
        secretKey: "access_key_id"
      - objectName: "object_store_secret_access_key"
        secretPath: "secret/data/his-hope/observability/object-store"
        secretKey: "secret_access_key"
  secretObjects:
    - secretName: grafana-oidc
      type: Opaque
      data:
        - objectName: grafana_oidc_client_id
          key: client_id
        - objectName: grafana_oidc_client_secret
          key: client_secret
    - secretName: grafana-admin
      type: Opaque
      data:
        - objectName: grafana_admin_username
          key: username
        - objectName: grafana_admin_password
          key: password
    - secretName: alertmanager-receivers
      type: Opaque
      data:
        - objectName: smtp_host
          key: smtp_host
        - objectName: smtp_port
          key: smtp_port
        - objectName: smtp_username
          key: smtp_username
        - objectName: smtp_password
          key: smtp_password
        - objectName: smtp_from
          key: smtp_from
        - objectName: smtp_to
          key: smtp_to
        - objectName: discord_webhook_url
          key: discord_webhook_url
        - objectName: remediation_webhook_token
          key: remediation_webhook_token
    - secretName: observability-object-store
      type: Opaque
      data:
        - objectName: object_store_endpoint
          key: endpoint
        - objectName: object_store_bucket
          key: bucket
        - objectName: object_store_region
          key: region
        - objectName: object_store_access_key_id
          key: access_key_id
        - objectName: object_store_secret_access_key
          key: secret_access_key
