apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-production-config
  namespace: monitoring
data:
  grafana.ini: |
    [users]
    allow_sign_up = false
    [auth]
    disable_login_form = false
    [auth.generic_oauth]
    enabled = true
    name = His.Hope Identity
    allow_sign_up = true
    scopes = openid profile email roles
    auth_url = https://identity.his-hope.example/connect/authorize
    token_url = https://identity.his-hope.example/connect/token
    api_url = https://identity.his-hope.example/connect/userinfo
    role_attribute_path = contains(roles[*], 'Admin') && 'Admin' || 'Viewer'
    [security]
    cookie_secure = true
    cookie_samesite = strict
