apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared CSI variant for environments where VM-local disks cannot be expanded.
# The external StorageClass must be validated before this overlay is synced.
resources:
  - ../prod

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: .*
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: viettel-shared
  - target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: .*
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: viettel-shared
