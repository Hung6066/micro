apiVersion: batch/v1
kind: Job
metadata:
  name: spire-jwt-svid-test
  namespace: spire
  labels:
    app.kubernetes.io/name: spire-jwt-svid-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-jwt-svid-test
    spec:
      restartPolicy: Never
      serviceAccountName: spire-test
      containers:
        - name: fetch
          image: ghcr.io/spiffe/spire-agent:1.15.2
          imagePullPolicy: IfNotPresent
          command: ["/opt/spire/bin/spire-agent"]
          args:
            - api
            - fetch
            - jwt
            - -audience
            - vault
            - -socketPath
            - /run/spire/sockets/agent.sock
          volumeMounts:
            - name: agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory

