apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
  labels:
    app.kubernetes.io/name: spire-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: spire-server
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - >-
              sed -e "s|__SPIRE_DB_PASSWORD__|${SPIRE_DB_PASSWORD}|g"
              -e "s|__SPIRE_DB_HOST__|${SPIRE_DB_HOST}|g"
              /run/spire/config/server.conf > /run/spire/rendered/server.conf
          env:
            - name: SPIRE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-postgres
                  key: password
            - name: SPIRE_DB_HOST
              value: postgres.his-hope-dev.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: rendered
              mountPath: /run/spire/rendered
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.2
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /run/spire/rendered/server.conf
          ports:
            - name: grpc
              containerPort: 8081
            - name: health
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: rendered
              mountPath: /run/spire/rendered
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: runtime
              mountPath: /run/spire-server
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: runtime
          emptyDir: {}
        - name: rendered
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
