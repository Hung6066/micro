apiVersion: v1
kind: Secret
metadata:
  name: vault-production-entrypoint-secret
  namespace: his-hope
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
type: Opaque
stringData:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    : "${POD_NAME:?POD_NAME is required}"
    : "${AZURE_TENANT_ID:?AZURE_TENANT_ID is required}"
    : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID is required}"
    : "${AZURE_CLIENT_SECRET:?AZURE_CLIENT_SECRET is required}"
    : "${VAULT_AZUREKEYVAULT_VAULT_NAME:?VAULT_AZUREKEYVAULT_VAULT_NAME is required}"
    : "${VAULT_AZUREKEYVAULT_KEY_NAME:?VAULT_AZUREKEYVAULT_KEY_NAME is required}"
    test -s /run/tls/tls.crt
    test -s /run/tls/tls.key
    test -s /run/tls/ca.crt
    cat > /tmp/vault.hcl <<EOF
    ui = true
    disable_mlock = true

    storage "raft" {
      path = "/vault/data"
      node_id = "${POD_NAME}"
      retry_join {
        leader_api_addr = "https://vault-0.vault-internal.his-hope.svc.cluster.local:8200"
        leader_ca_cert_file = "/run/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://vault-1.vault-internal.his-hope.svc.cluster.local:8200"
        leader_ca_cert_file = "/run/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://vault-2.vault-internal.his-hope.svc.cluster.local:8200"
        leader_ca_cert_file = "/run/tls/ca.crt"
      }
      autopilot {
        cleanup_dead_servers = true
        last_contact_threshold = "200ms"
        max_trailing_logs = 100000
        server_stabilization_time = "10s"
        dead_server_last_contact_threshold = "24h"
        min_quorum = 2
      }
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable = false
      tls_cert_file = "/run/tls/tls.crt"
      tls_key_file = "/run/tls/tls.key"
      tls_client_ca_file = "/run/tls/ca.crt"
      tls_min_version = "tls13"
    }

    api_addr = "https://${POD_NAME}.vault-internal.his-hope.svc.cluster.local:8200"
    cluster_addr = "https://${POD_NAME}.vault-internal.his-hope.svc.cluster.local:8201"

    seal "azurekeyvault" {
      tenant_id = "${AZURE_TENANT_ID}"
      client_id = "${AZURE_CLIENT_ID}"
      client_secret = "${AZURE_CLIENT_SECRET}"
      vault_name = "${VAULT_AZUREKEYVAULT_VAULT_NAME}"
      key_name = "${VAULT_AZUREKEYVAULT_KEY_NAME}"
    }
    EOF
    exec vault server -config=/tmp/vault.hcl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: his-hope
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-binding
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: his-hope
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-server-proxy
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-server-proxy-binding
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-server-proxy
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: his-hope
---
apiVersion: v1
kind: Service
metadata:
  name: vault-active
  namespace: his-hope
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
  ports:
    - name: api
      port: 8200
      targetPort: api
    - name: cluster
      port: 8201
      targetPort: cluster
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: his-hope
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
  ports:
    - name: api
      port: 8200
      targetPort: api
    - name: cluster
      port: 8201
      targetPort: cluster
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault
  namespace: his-hope
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: his-hope
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  serviceName: vault-internal
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vault
          image: hashicorp/vault:1.16@sha256:c5e04689611cb864b8b6247a6a845e0bdc059998f39b5c8a659562287379525c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "/run/vault/entrypoint.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-azure-unseal
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-azure-unseal
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-azure-unseal
                  key: AZURE_CLIENT_SECRET
            - name: VAULT_AZUREKEYVAULT_VAULT_NAME
              valueFrom:
                secretKeyRef:
                  name: vault-azure-unseal
                  key: VAULT_AZUREKEYVAULT_VAULT_NAME
            - name: VAULT_AZUREKEYVAULT_KEY_NAME
              valueFrom:
                secretKeyRef:
                  name: vault-azure-unseal
                  key: VAULT_AZUREKEYVAULT_KEY_NAME
          ports:
            - name: api
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          volumeMounts:
            - name: entrypoint
              mountPath: /run/vault
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: raft-data
              mountPath: /vault/data
            # The entrypoint writes the generated Vault config here while the
            # container root filesystem remains read-only.
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?standbyok=true&sealedcode=503&uninitcode=503
              port: api
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?standbyok=true&sealedcode=503&uninitcode=503&standbycode=200
              port: api
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        # Keep the live volume names and order so Argo can update the pod
        # template without changing the StatefulSet's immutable PVC spec.
        - name: entrypoint
          secret:
            secretName: vault-production-entrypoint-secret
            defaultMode: 0550
        - name: tls
          projected:
            sources:
              - secret:
                  name: vault-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: vault-tls-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        # This PVC name is already provisioned by the live Vault StatefulSet.
        name: raft-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
