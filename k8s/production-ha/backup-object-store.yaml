apiVersion: v1
kind: Namespace
metadata:
  name: backup
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: backup-object-store
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: backup
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-object-store
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: backup
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-object-store
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: backup
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-object-store
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: backup-object-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: minio
      containers:
        - name: minio
          image: harbor.his-hope.local:9443/his-hope/minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:880f12126899be71b36cbb23841450f48484f471472a9a9d9cee4d384a355530
          imagePullPolicy: IfNotPresent
          args:
            - server
            - https://minio-{0...3}.minio-headless.backup.svc.cluster.local/data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: minio-tls
              mountPath: /root/.minio/certs
              readOnly: true
      volumes:
        - name: minio-tls
          secret:
            secretName: minio-tls
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-backup-bucket
  namespace: backup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: minio-backup-bucket
    app.kubernetes.io/component: backup-object-store
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-backup-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: harbor.his-hope.local:9443/his-hope/minio/mc:RELEASE.2024-12-18T13-15-44Z@sha256:89160f479df826fbba9761d0aa38bed3e8c732845d8bdbee5d4a41939d2ea606
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: SSL_CERT_FILE
              value: /etc/minio-tls/ca.crt
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-tls
              mountPath: /etc/minio-tls
              readOnly: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set local https://minio.backup.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done
              mc mb --with-lock --ignore-existing local/his-hope-spire
              mc version enable local/his-hope-spire
              mc retention set --default COMPLIANCE 30d local/his-hope-spire
              mc anonymous set none local/his-hope-spire
      volumes:
        - name: minio-tls
          secret:
            secretName: minio-tls
            defaultMode: 0400
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-ingress
  namespace: backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress, Egress]
  # MinIO is a cluster-internal endpoint. The bucket policy remains
  # least-privilege; allow only MinIO's own namespace and the CNPG backup
  # workload namespace. Do not expose the object store to arbitrary pods.
  ingress:
    -
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire
          podSelector:
            matchLabels:
              cnpg.io/cluster: spire-postgres
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio-backup-bucket
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
