apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
data:
  SPAN_STORAGE_TYPE: badger
  BADGER_EPHEMERAL: "false"
  BADGER_DIRECTORY_KEY: /badger/key
  BADGER_DIRECTORY_VALUE: /badger/data
  COLLECTOR_OTLP_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: tracing
    spec:
      serviceAccountName: jaeger
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one@sha256:6430459b95bd15dd1f0cb63b2d4e6da3b3021b337e14b513314912a642c0e839
          imagePullPolicy: IfNotPresent
          args:
            - --collector.otlp.grpc.host-port=0.0.0.0:4317
            - --collector.otlp.http.host-port=0.0.0.0:4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          ports:
            - name: ui
              containerPort: 16686
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: jaeger-thrift
              containerPort: 14278
              protocol: TCP
            - name: agent-compact
              containerPort: 6831
              protocol: UDP
          envFrom:
            - configMapRef:
                name: jaeger-config
          env:
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: COLLECTOR_OTLP_GRPC_HOST_PORT
              value: "0.0.0.0:4317"
            - name: COLLECTOR_OTLP_HTTP_HOST_PORT
              value: "0.0.0.0:4318"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: jaeger-data
              mountPath: /badger
              subPath: jaeger
      volumes:
        - name: jaeger-data
          persistentVolumeClaim:
            claimName: jaeger-data
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: jaeger-thrift
      port: 14278
      targetPort: 14278
      protocol: TCP
    - name: agent-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jaeger-pdb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jaeger
  minReplicas: 1
  # Jaeger all-in-one uses a single ReadWriteOnce Badger volume.
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
