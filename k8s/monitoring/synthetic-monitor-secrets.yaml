apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: synthetic-monitor-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: synthetic-monitoring
spec:
  provider: vault
  parameters:
    roleName: observability
    vaultAuthMountPath: "kubernetes"
    audience: "vault"
    vaultAddress: "https://vault-active.his-hope.svc.cluster.local:8200"
    vaultSkipTLSVerify: "false"
    vaultCACertPath: "/vault/tls/ca.crt"
    objects: |
      - objectName: "synthetic_monitor_username"
        secretPath: "secret/data/his-hope/observability/synthetic-monitor"
        secretKey: "username"
      - objectName: "synthetic_monitor_password"
        secretPath: "secret/data/his-hope/observability/synthetic-monitor"
        secretKey: "password"
  secretObjects:
    - secretName: synthetic-monitor-credentials
      type: Opaque
      data:
        - objectName: synthetic_monitor_username
          key: username
        - objectName: synthetic_monitor_password
          key: password
