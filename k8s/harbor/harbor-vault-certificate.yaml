apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-public
  namespace: harbor
  labels:
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/component: registry
spec:
  secretName: harbor-public-tls
  issuerRef:
    name: vault-issuer-harbor
    kind: ClusterIssuer
  commonName: harbor.myduchospital.com
  dnsNames:
    - harbor.myduchospital.com
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 3072
    rotationPolicy: Always
  usages:
    - server auth
