apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serverstransports.traefik.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  group: traefik.io
  names:
    kind: ServersTransport
    listKind: ServersTransportList
    plural: serverstransports
    singular: serverstransport
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [metadata, spec]
          properties:
            spec:
              type: object
              properties:
                rootCAsSecrets:
                  type: array
                  items:
                    type: string
                serverName:
                  type: string
                insecureSkipVerify:
                  type: boolean
                certificatesSecrets:
                  type: array
                  items:
                    type: string
