# Vault CSI contracts for the manufacturing platform services.  Secret values
# stay in Vault; Kubernetes only receives the short-lived synced objects needed
# by the workload and its MigrationOnly Job.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: commerce-service-secrets
  namespace: his-hope
  labels: { app.kubernetes.io/name: commerce-service, app.kubernetes.io/component: secrets-provider }
spec:
  provider: vault
  parameters:
    roleName: commerce-service
    vaultAuthMountPath: kubernetes-jwt
    audience: vault
    vaultAddress: https://vault-active.his-hope.svc.cluster.local:8200
    vaultSkipTLSVerify: "false"
    vaultCACertPath: /vault/tls/ca.crt
    objects: |
      - objectName: data_protection_pfx
        secretPath: secret/data/his-hope/commerce-service/data-protection
        secretKey: pfx
      - objectName: data_protection_password
        secretPath: secret/data/his-hope/commerce-service/data-protection
        secretKey: password
  secretObjects:
    - secretName: commerce-service-data-protection
      type: Opaque
      data:
        - objectName: data_protection_pfx
          key: tls.pfx
        - objectName: data_protection_password
          key: password
---
