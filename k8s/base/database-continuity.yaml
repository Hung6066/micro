apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-continuity
  labels:
    app.kubernetes.io/name: database-continuity
    app.kubernetes.io/component: platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-continuity
  labels:
    app.kubernetes.io/name: database-continuity
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database-continuity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-continuity
        app.kubernetes.io/component: platform
        app: database-continuity
    spec:
      serviceAccountName: database-continuity
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database-continuity
          image: his-hope/database-continuity:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsUser: 1654
            runAsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 5800
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5800
            - name: ConnectionStrings__Redis
              valueFrom:
                configMapKeyRef:
                  name: runtime-contract-config
                  key: ADAPTER_REDIS_CONNECTION_STRING
            - name: PGHOST
              value: his-hope-postgres.his-hope.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: his_hope
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: BACKUP_STORAGE_PATH
              value: /var/lib/his-hope/backups
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: runtime-contract-config
                  key: ADAPTER_VAULT_ADDRESS
            - name: VAULT_TRANSIT_KEY
              value: his-hope-backup-encryption
            - name: DATABASE_CONTINUITY_DATABASES
              value: identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb
          volumeMounts:
            - name: backups
              mountPath: /var/lib/his-hope/backups
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5800
            initialDelaySeconds: 120
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5800
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: database-continuity-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-continuity-backups
  labels:
    app.kubernetes.io/name: database-continuity
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: database-continuity
  labels:
    app.kubernetes.io/name: database-continuity
    app.kubernetes.io/component: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: database-continuity
  ports:
    - name: http
      port: 5800
      targetPort: 5800
