apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Values are injected by the environment-specific secret workflow.
  # Production must use Vault/CSI; this base fixture intentionally contains no
  # usable credential.
  password: ${POSTGRES_PASSWORD}
  clinical_connection_string: ""
  patient_connection_string: ""
  identity_connection_string: ""
  appointment_connection_string: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  labels:
    app.kubernetes.io/name: redis-secret
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  password: ${REDIS_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  labels:
    app.kubernetes.io/name: rabbitmq-secret
    app.kubernetes.io/component: messaging
type: Opaque
stringData:
  password: ${RABBITMQ_PASSWORD}
  erlang_cookie: ${RABBITMQ_ERLANG_COOKIE}
