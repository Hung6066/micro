apiVersion: v1
kind: ServiceAccount
metadata:
  name: clinical-service
  labels:
    app.kubernetes.io/name: clinical-service
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinical-service-config
  labels:
    app.kubernetes.io/name: clinical-service
data:
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMQ__Host: rabbitmq
  Redis__ConnectionString: redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-service
  labels:
    app.kubernetes.io/name: clinical-service
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-service
        app.kubernetes.io/component: backend
        app: clinical-service
      annotations:
        # Keep Linkerd for HTTP/observability, but let the cleartext gRPC
        # listener receive h2c directly; proxy protocol negotiation otherwise
        # downgrades the 5009 listener and returns HTTP_1_1_REQUIRED.
        config.linkerd.io/skip-inbound-ports: "5009"
    spec:
      serviceAccountName: clinical-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: Localhost
          localhostProfile: his-hope-dotnet-strict.json
      containers:
        - name: clinical-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Localhost
              localhostProfile: his-hope-dotnet-strict.json
            runAsUser: 1654
            runAsGroup: 1654
          image: his-hope/clinical-service:latest
          imagePullPolicy: Always
          volumeMounts: []
          ports:
            - name: http
              containerPort: 5005
              protocol: TCP
            - name: grpc
              containerPort: 5009
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clinical-service-config
            - configMapRef:
                name: runtime-contract-config
          env:
            - name: ConnectionStrings__ClinicalDb
              valueFrom:
                configMapKeyRef:
                  name: runtime-contract-config
                  key: ADAPTER_CONNECTIONSTRINGS_CLINICALDB
            - name: Consul__Address
              valueFrom:
                configMapKeyRef:
                  name: runtime-contract-config
                  key: ADAPTER_CONSUL_ADDRESS
            - name: OpenTelemetry__JaegerEndpoint
              valueFrom:
                configMapKeyRef:
                  name: runtime-contract-config
                  key: ADAPTER_JAEGER_TRACES_ENDPOINT
          resources:
            requests:
              cpu: 512m
              memory: 1Gi
            limits:
              cpu: 512m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5005
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health/live
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 40
        # ── PgBouncer Sidecar ──────────────────────────────────────────────
        # Lightweight connection pooler for PostgreSQL/CockroachDB
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.1-p0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 100
            runAsGroup: 100
            seccompProfile:
              type: Localhost
              localhostProfile: his-hope-dotnet-strict.json
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          env:
            - name: POSTGRESQL_HOST
              value: "postgres"
            - name: POSTGRESQL_PORT
              value: "5432"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - pgbouncer
                - --version
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pgbouncer-volume
              mountPath: /etc/pgbouncer
              readOnly: true
      volumes:
        - name: pgbouncer-volume
          projected:
            sources:
              - configMap:
                  name: pgbouncer-config
                  items:
                    - key: pgbouncer.ini
                      path: pgbouncer.ini
              - secret:
                  name: pgbouncer-secret
                  items:
                    - key: userlist.txt
                      path: userlist.txt
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-service
  labels:
    app.kubernetes.io/name: clinical-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clinical-service
  ports:
    - name: http
      port: 5005
      targetPort: 5005
      protocol: TCP
    - name: grpc
      port: 5009
      targetPort: 5009
      appProtocol: grpc
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinical-service
  labels:
    app.kubernetes.io/name: clinical-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinical-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    - type: Object
      object:
        describedObject:
          kind: Service
          name: clinical-service
        metric:
          name: requests_per_second
        target:
          type: AverageValue
          averageValue: "400"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinical-service-pdb
  labels:
    app.kubernetes.io/name: clinical-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-service
