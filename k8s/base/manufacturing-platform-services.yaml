---
# Production migration hooks.  API replicas never run migrations; Argo runs
# one bounded MigrationOnly Job per owned database before wave 30 workloads.
apiVersion: batch/v1
kind: Job
metadata:
  name: production-migrate-commerce
  labels:
    app.kubernetes.io/name: production-migrate-commerce
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: his-hope
    his-hope.io/operation: database-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: production-migrate-commerce
        app.kubernetes.io/part-of: his-hope
        his-hope.io/operation: database-migration
      annotations: { linkerd.io/inject: disabled }
    spec:
      serviceAccountName: commerce-service
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets: [{ name: harbor-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 1654, runAsGroup: 1654, fsGroup: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: commerce-service
          image: his-hope/commerce-service:production
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: commerce-service-config }
            - configMapRef: { name: runtime-contract-config }
          env:
            - name: ConnectionStrings__CommerceDb
              valueFrom: { configMapKeyRef: { name: runtime-contract-config, key: ADAPTER_CONNECTIONSTRINGS_COMMERCEDB } }
            - name: ConnectionStrings__Redis
              valueFrom: { configMapKeyRef: { name: runtime-contract-config, key: ADAPTER_REDIS_CONNECTION_STRING } }
            - name: Persistence__RunMigrationsOnStartup
              value: "true"
            - name: Persistence__MigrationOnly
              value: "true"
            - name: DataProtection__CertificatePath
              value: /etc/his-hope/data-protection/tls.pfx
            - name: DataProtection__CertificatePassword
              valueFrom: { secretKeyRef: { name: commerce-service-data-protection, key: password } }
            - name: Vault__AuthMethod
              value: spiffe-jwt
            - name: Vault__AuthMount
              value: jwt-spiffe
            - name: Vault__Role
              value: commerce-service
            - name: Vault__SpiffeJwtTokenFile
              value: /run/spire/jwt/vault.jwt
            - name: Vault__SpiffeAudience
              value: vault
            - name: Vault__Database__Enabled
              value: "true"
            - name: Vault__AllowStaticToken
              value: "false"
            - name: Vault__TlsCaFile
              value: /etc/tls/vault/ca.crt
            - name: Redis__TlsCaFile
              value: /etc/tls/redis/ca.crt
            - name: EventBus__UserName
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: username } }
            - name: EventBus__Password
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: password } }
          securityContext: { runAsNonRoot: true, runAsUser: 1654, runAsGroup: 1654, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1000m, memory: 1Gi } }
          volumeMounts:
            - { name: runtime-tmp, mountPath: /tmp }
            - { name: data-protection, mountPath: /etc/his-hope/data-protection, readOnly: true }
            - { name: vault-secrets, mountPath: /mnt/vault-secrets, readOnly: true }
            - { name: vault-tls-ca, mountPath: /etc/tls/vault, readOnly: true }
            - { name: redis-tls-ca, mountPath: /etc/tls/redis, readOnly: true }
            - { name: spire-jwt, mountPath: /run/spire/jwt, readOnly: true }
        - name: spire-jwt-fetcher
          image: harbor.his-hope.local:9443/his-hope/spire-fetcher:1.15.2@sha256:fd30ab2c9ea11fe706725f52e4c04cc708294d2998c0746c73574a13be9b8599
          imagePullPolicy: IfNotPresent
          env: [{ name: SPIFFE_ID, value: spiffe://his-hope.local/ns/his-hope/sa/commerce-service }]
          securityContext: { runAsUser: 0, runAsGroup: 0, runAsNonRoot: false, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          volumeMounts:
            - { name: agent-socket, mountPath: /run/spire/sockets, readOnly: true }
            - { name: spire-jwt, mountPath: /run/spire/jwt }
      volumes:
        - { name: runtime-tmp, emptyDir: {} }
        - { name: data-protection, secret: { secretName: commerce-service-data-protection, defaultMode: 0440 } }
        - { name: vault-secrets, csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: commerce-service-secrets } } }
        - { name: vault-tls-ca, secret: { secretName: vault-tls-ca, defaultMode: 0440 } }
        - { name: redis-tls-ca, secret: { secretName: redis-tls, defaultMode: 0440 } }
        - { name: spire-jwt, emptyDir: { medium: Memory } }
        - { name: agent-socket, hostPath: { path: /run/spire/sockets, type: Socket } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: production-migrate-content
  labels:
    app.kubernetes.io/name: production-migrate-content
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: his-hope
    his-hope.io/operation: database-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: production-migrate-content, app.kubernetes.io/part-of: his-hope, his-hope.io/operation: database-migration }
      annotations: { linkerd.io/inject: disabled }
    spec:
      serviceAccountName: content-service
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets: [{ name: harbor-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 1654, runAsGroup: 1654, fsGroup: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: content-service
          image: his-hope/content-service:production
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: content-service-config }
            - configMapRef: { name: runtime-contract-config }
          env:
            - name: ConnectionStrings__ContentDb
              valueFrom: { configMapKeyRef: { name: runtime-contract-config, key: ADAPTER_CONNECTIONSTRINGS_CONTENTDB } }
            - name: ConnectionStrings__Redis
              valueFrom: { configMapKeyRef: { name: runtime-contract-config, key: ADAPTER_REDIS_CONNECTION_STRING } }
            - name: Persistence__RunMigrationsOnStartup
              value: "true"
            - name: Persistence__MigrationOnly
              value: "true"
            - name: DataProtection__CertificatePath
              value: /etc/his-hope/data-protection/tls.pfx
            - name: DataProtection__CertificatePassword
              valueFrom: { secretKeyRef: { name: content-service-data-protection, key: password } }
            - name: Vault__AuthMethod
              value: spiffe-jwt
            - name: Vault__AuthMount
              value: jwt-spiffe
            - name: Vault__Role
              value: content-service
            - name: Vault__SpiffeJwtTokenFile
              value: /run/spire/jwt/vault.jwt
            - name: Vault__SpiffeAudience
              value: vault
            - name: Vault__Database__Enabled
              value: "true"
            - name: Vault__AllowStaticToken
              value: "false"
            - name: Vault__TlsCaFile
              value: /etc/tls/vault/ca.crt
            - name: Redis__TlsCaFile
              value: /etc/tls/redis/ca.crt
          securityContext: { runAsNonRoot: true, runAsUser: 1654, runAsGroup: 1654, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1000m, memory: 1Gi } }
          volumeMounts:
            - { name: runtime-tmp, mountPath: /tmp }
            - { name: data-protection, mountPath: /etc/his-hope/data-protection, readOnly: true }
            - { name: vault-tls-ca, mountPath: /etc/tls/vault, readOnly: true }
            - { name: redis-tls-ca, mountPath: /etc/tls/redis, readOnly: true }
            - { name: spire-jwt, mountPath: /run/spire/jwt, readOnly: true }
        - name: spire-jwt-fetcher
          image: harbor.his-hope.local:9443/his-hope/spire-fetcher:1.15.2@sha256:fd30ab2c9ea11fe706725f52e4c04cc708294d2998c0746c73574a13be9b8599
          imagePullPolicy: IfNotPresent
          env: [{ name: SPIFFE_ID, value: spiffe://his-hope.local/ns/his-hope/sa/content-service }]
          securityContext: { runAsUser: 0, runAsGroup: 0, runAsNonRoot: false, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          volumeMounts:
            - { name: agent-socket, mountPath: /run/spire/sockets, readOnly: true }
            - { name: spire-jwt, mountPath: /run/spire/jwt }
      volumes:
        - { name: runtime-tmp, emptyDir: {} }
        - { name: data-protection, secret: { secretName: content-service-data-protection, defaultMode: 0440 } }
        - { name: vault-secrets, csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: content-service-secrets } } }
        - { name: vault-tls-ca, secret: { secretName: vault-tls-ca, defaultMode: 0440 } }
        - { name: redis-tls-ca, secret: { secretName: redis-tls, defaultMode: 0440 } }
        - { name: spire-jwt, emptyDir: { medium: Memory } }
        - { name: agent-socket, hostPath: { path: /run/spire/sockets, type: Socket } }
---
