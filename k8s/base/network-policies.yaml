        - podSelector:
            matchLabels:
              app: patient-service
      ports:
        - port: 5002
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: identity-service
      ports:
        - port: 5003
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: appointment-service
      ports:
        - port: 5004
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: clinical-service
      ports:
        - port: 5005
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: lab-service
      ports:
        - port: 5010
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: billing-service
      ports:
        - port: 5020
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: pharmacy-service
      ports:
        - port: 5030
          protocol: TCP
    # Dashboard aggregation uses the backend gRPC listeners directly.
    - to:
        - podSelector:
            matchLabels:
              app: patient-service
      ports:
        - port: 5006
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: clinical-service
      ports:
        - port: 5009
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: lab-service
      ports:
        - port: 5012
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: billing-service
      ports:
        - port: 5022
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: pharmacy-service
      ports:
        - port: 5032
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: appointment-service
      ports:
        - port: 5008
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP
    # BFF services
    - to:
        - podSelector:
            matchLabels:
