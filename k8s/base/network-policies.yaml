          protocol: TCP
        - port: 5007
          protocol: TCP
        - port: 5008
          protocol: TCP
        - port: 5009
          protocol: TCP
        - port: 5010
          protocol: TCP
        - port: 5012
          protocol: TCP
        - port: 5020
          protocol: TCP
        - port: 5022
          protocol: TCP
        - port: 5030
          protocol: TCP
        - port: 5032
          protocol: TCP
        - port: 5100
          protocol: TCP
        - port: 5200
          protocol: TCP
        - port: 5300
          protocol: TCP
        - port: 5400
          protocol: TCP
        - port: 5500
          protocol: TCP
