    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - port: 443
          protocol: TCP
        - port: 8200
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - port: 6443
          protocol: TCP

    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP

