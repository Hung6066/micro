---
# Allow Linkerd's transparent proxy path for meshed backend-to-backend calls.
# Application traffic is still authorized by the service-specific policies
# above; these ports only carry traffic after Linkerd's CNI redirect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-linkerd-backend-mesh
  labels:
    app.kubernetes.io/part-of: his-hope
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: his-hope-dev
      ports:
        - port: 4143
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: his-hope-dev
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - port: 4140
          protocol: TCP

---
# Linkerd proxies must reach identity, destination, and policy controllers.
# Keep this separate from application traffic policies so service-to-service
# authorization remains explicit while the mesh control path stays available.
