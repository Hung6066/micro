---
# ---------------------------------------------------------------------------
# 15. VAULT EGRESS (for Vault Agent sidecar and Vault clients)
# ----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-vault
  labels:
    app.kubernetes.io/part-of: his-hope
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: his-hope
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - vault
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
    # K3s service-cluster traffic is addressed through the Vault ClusterIP.
    # Keep this explicit so kube-proxy can route Vault auth/secret requests
    # without relying on pod-label matching for StatefulSet members.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
