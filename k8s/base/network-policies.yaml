          protocol: TCP
        # appointment-service HTTP
        - port: 5004
          protocol: TCP
        # clinical-service HTTP
        - port: 5005
          protocol: TCP
        # lab-service HTTP
        - port: 5010
          protocol: TCP
        # billing-service HTTP
        - port: 5020
          protocol: TCP
        # pharmacy-service HTTP
        - port: 5030
          protocol: TCP
        # lab-bff HTTP
        - port: 5300
          protocol: TCP
        # clinical-bff HTTP
        - port: 5200
          protocol: TCP
        # patient-bff HTTP
        - port: 5100
          protocol: TCP
        # billing-bff HTTP
        - port: 5400
          protocol: TCP
        # pharmacy-bff HTTP
        - port: 5500
          protocol: TCP
        # dashboard-bff HTTP
        - port: 5600
          protocol: TCP

---
# ---------------------------------------------------------------------------
# 6. SERVICE-TO-SERVICE gRPC (patient-service)
# ---------------------------------------------------------------------------
# patient-service gRPC (5006) called by: clinical-service, lab-service, 
#   billing-service, pharmacy-service, identity-service, appointment-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-patient-service
  labels:
    app.kubernetes.io/part-of: his-hope
spec:
  podSelector:
    matchLabels:
      app: patient-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: identity-service
        - podSelector:
            matchLabels:
              app: clinical-service
        - podSelector:
            matchLabels:
              app: lab-service
        - podSelector:
            matchLabels:
              app: billing-service
        - podSelector:
            matchLabels:
              app: pharmacy-service
        # k3d/Flannel cross-node traffic is SNATed to the pod CIDR gateway
        # before it reaches the destination node. Linkerd remains the
        # identity/authentication boundary for this transport allowance.
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        # Linkerd redirects meshed inbound traffic to its proxy listener.
        - port: 4143
          protocol: TCP
        - port: 5002
          protocol: TCP
        - port: 5006
          protocol: TCP
  # patient-service also needs egress to its dependencies
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP

