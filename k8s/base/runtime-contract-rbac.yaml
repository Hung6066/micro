apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-config-reader
  labels:
    app.kubernetes.io/component: runtime-configuration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["runtime-contract"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-config-reader
subjects:
  - kind: ServiceAccount
    name: runtime-config-reader
