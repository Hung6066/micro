apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: git-mirror
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: his-hope-gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: his-hope-gitops
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: gitea/gitea:1.24.6-rootless
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /var/lib/gitea/data/gitea.db
            - name: GITEA__server__DOMAIN
              value: git-mirror.his-hope.local
            - name: GITEA__server__PROTOCOL
              value: https
            - name: GITEA__server__ROOT_URL
              value: https://git-mirror.his-hope.local/
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
