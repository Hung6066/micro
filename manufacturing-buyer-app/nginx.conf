server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Identity session cookies are chunked and can exceed nginx defaults.
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;

  # Resolve the gateway at request time so a restarted container does not
  # leave nginx pinned to a stale Docker IP.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $upstream_gateway "http://api-gateway:5000";

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass $upstream_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /connect/ {
    proxy_pass $upstream_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # BFF SSO uses the same public origin for the Identity account form.
  location /Account/ {
    proxy_pass $upstream_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  location /.well-known/ {
    proxy_pass $upstream_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
