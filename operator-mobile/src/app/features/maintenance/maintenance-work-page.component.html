<section class="maintenance-page"><p class="eyebrow">{{ "mobile.operatorMaintenanceEyebrow" | hhTranslate: "ASSET CARE" }}</p><h2>{{ "mobile.operatorMaintenanceTitle" | hhTranslate: "Complete maintenance" }}</h2><p>{{ "mobile.operatorMaintenanceDescription" | hhTranslate }}</p><article><label>{{ "mobile.operatorMachineId" | hhTranslate }}<input [(ngModel)]="machineId" /></label><label>{{ "mobile.operatorWorkOrderId" | hhTranslate }}<input [(ngModel)]="workOrderId" /></label><label>{{ "mobile.operatorTechnician" | hhTranslate }}<input [(ngModel)]="technician" /></label><label><input type="checkbox" [(ngModel)]="checklistComplete" /> {{ "mobile.operatorIsolationChecklist" | hhTranslate }}</label><button type="button" [disabled]="!checklistComplete" (click)="completeWorkOrder()">{{ "mobile.operatorCompleteWorkOrder" | hhTranslate }}</button>@if (message) { <p role="status">{{ message }}</p> }</article></section>
