<section class="quality-page"><p class="eyebrow">{{ "mobile.operatorQualityEyebrow" | hhTranslate: "QUALITY CONTROL" }}</p><h2>{{ "mobile.operatorQualityTitle" | hhTranslate: "Record inspection" }}</h2><p>{{ "mobile.operatorQualityDescription" | hhTranslate }}</p><article><label>{{ "mobile.operatorLotId" | hhTranslate }}<input [(ngModel)]="lotId" [placeholder]="'mobile.operatorLotPlaceholder' | hhTranslate: 'Lot identifier'" /></label><label>{{ "mobile.operatorInspector" | hhTranslate }}<input [(ngModel)]="inspector" [placeholder]="'mobile.operatorInspectorPlaceholder' | hhTranslate: 'Your name'" /></label><label>{{ "mobile.operatorMoisture" | hhTranslate }}<input type="number" [(ngModel)]="moisturePercent" /></label><label>{{ "mobile.operatorStatus" | hhTranslate }}<select [(ngModel)]="status"><option>Pass</option><option>Fail</option><option>Pending</option></select></label><button type="button" (click)="submitInspection()">{{ "mobile.operatorSaveInspection" | hhTranslate }}</button>@if (message) { <p role="status">{{ message }}</p> }</article></section>
