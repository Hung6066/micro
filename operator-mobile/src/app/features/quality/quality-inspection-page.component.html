<section class="quality-page"><p class="eyebrow">QUALITY CONTROL</p><h2>Record inspection</h2><p>Capture a result against a lot. Pending records remain visible until synchronised.</p><article><label>Lot ID<input [(ngModel)]="lotId" placeholder="Lot identifier" /></label><label>Inspector<input [(ngModel)]="inspector" placeholder="Your name" /></label><label>Moisture %<input type="number" [(ngModel)]="moisturePercent" /></label><label>Status<select [(ngModel)]="status"><option>Pass</option><option>Fail</option><option>Pending</option></select></label><button type="button" (click)="submitInspection()">Save inspection</button>@if (message) { <p role="status">{{ message }}</p> }</article></section>
