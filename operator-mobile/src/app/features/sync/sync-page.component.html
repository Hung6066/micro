<section class="sync-page"><p class="eyebrow">DEVICE QUEUE</p><h2>Sync status</h2><p>Offline records remain encrypted on this device until the server confirms them.</p><button type="button" (click)="refresh()">Refresh</button>@if (!entries.length) { <article class="empty">No queued operations.</article> } @for (entry of entries; track entry.id) { <article><div><strong>{{ entry.endpoint }}</strong><span>{{ entry.status }}</span></div>@if (entry.error) { <p>{{ entry.error }}</p> }<button type="button" (click)="discard(entry)">Discard local record</button></article> }</section>
