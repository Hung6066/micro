name: DORA Metrics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Collection window in days
        required: false
        default: '30'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dora-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test DORA calculations
        shell: bash
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Collect DORA metrics from production promotion runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DORA_DAYS: ${{ inputs.days || '30' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect-dora-metrics.py --days "${DORA_DAYS}" --output-dir artifacts/dora
      - name: Upload auditable DORA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dora-metrics-${{ github.run_id }}
          path: artifacts/dora/
          if-no-files-found: error
