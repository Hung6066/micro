name: Sync production to internal Git mirror

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-mirror-production
  cancel-in-progress: false

jobs:
  sync-production:
    name: Sync reviewed production commit to Gitea
    runs-on: [self-hosted, gitops-runner]
    environment: production
    steps:
      - name: Checkout reviewed production commit
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Push and verify the mirror branch
        shell: bash
        env:
          MIRROR_URL: ${{ secrets.GITOPS_MIRROR_REPO_URL }}
          MIRROR_USERNAME: ${{ secrets.GITOPS_MIRROR_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.GITOPS_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MIRROR_URL" || { echo 'GITOPS_MIRROR_REPO_URL is required'; exit 1; }
          test -n "$MIRROR_USERNAME" || { echo 'GITOPS_MIRROR_USERNAME is required'; exit 1; }
          test -n "$MIRROR_TOKEN" || { echo 'GITOPS_MIRROR_TOKEN is required'; exit 1; }

          git remote add mirror "$MIRROR_URL"
          auth="$(printf '%s:%s' "$MIRROR_USERNAME" "$MIRROR_TOKEN" | base64 -w0)"
          git -c "http.extraheader=Authorization: Basic $auth" fetch --no-tags mirror production || true

          source_sha="$(git rev-parse refs/remotes/origin/production)"
          git -c "http.extraheader=Authorization: Basic $auth" push mirror \
            "refs/remotes/origin/production:refs/heads/production"

          mirror_sha="$(git -c "http.extraheader=Authorization: Basic $auth" \
            ls-remote "$MIRROR_URL" refs/heads/production | awk '{print $1}')"
          test "$mirror_sha" = "$source_sha" || {
            echo "Mirror SHA mismatch: expected $source_sha, got $mirror_sha"
            exit 1
          }
          echo "Mirror production synchronized at $mirror_sha"
