name: Application Restore Smoke DR Drill

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [staging, production]
      apply:
        description: Execute restore and application smoke (false is dry-run)
        required: true
        default: false
        type: boolean
      continuity_url:
        description: Database Continuity API base URL
        required: true
        type: string
      application_url:
        description: Application ingress base URL
        required: true
        type: string
      oidc_discovery_url:
        description: OIDC discovery URL
        required: true
        type: string
      authenticated_smoke_path:
        description: Protected API path for the authenticated smoke
        required: true
        default: /api/v1/dashboard/stats
        type: string
      rpo_minutes:
        description: Measured age of the restore source at drill start
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: application-restore-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.35.5'
      - name: Materialize protected runtime inputs
        id: inputs
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
          APP_RESTORE_BEARER_TOKEN: ${{ secrets.APP_RESTORE_BEARER_TOKEN }}
        run: |
          $encoded = if ('${{ inputs.environment }}' -eq 'production') { $env:KUBECONFIG_PRODUCTION_B64 } else { $env:KUBECONFIG_STAGING_B64 }
          if ([string]::IsNullOrWhiteSpace($encoded) -or [string]::IsNullOrWhiteSpace($env:APP_RESTORE_BEARER_TOKEN)) { throw 'Kubeconfig and APP_RESTORE_BEARER_TOKEN secrets are required.' }
          $kubeconfig = Join-Path $env:RUNNER_TEMP "kubeconfig-${{ inputs.environment }}.yaml"
          [IO.File]::WriteAllBytes($kubeconfig, [Convert]::FromBase64String($encoded))
          "kubeconfig=$kubeconfig" >> $env:GITHUB_OUTPUT
      - name: Run application restore smoke
        shell: pwsh
        env:
          APP_RESTORE_BEARER_TOKEN: ${{ secrets.APP_RESTORE_BEARER_TOKEN }}
        run: |
          $args = @('-ContinuityUrl', '${{ inputs.continuity_url }}', '-ApplicationUrl', '${{ inputs.application_url }}', '-OidcDiscoveryUrl', '${{ inputs.oidc_discovery_url }}', '-AuthenticatedSmokePath', '${{ inputs.authenticated_smoke_path }}', '-Kubeconfig', '${{ steps.inputs.outputs.kubeconfig }}', '-Environment', '${{ inputs.environment }}', '-RpoMinutes', '${{ inputs.rpo_minutes }}', '-OutputPath', 'artifacts/evidence/application-restore-smoke.json')
          if ('${{ inputs.apply }}' -eq 'true') { $args += @('-Apply'); if ('${{ inputs.environment }}' -eq 'production') { $args += @('-AllowProduction') } } else { $args += @('-WhatIf') }
          & ./scripts/test-application-restore-smoke.ps1 @args
      - name: Validate measured evidence
        if: ${{ inputs.apply == true }}
        shell: pwsh
        run: ./scripts/validate-dr-evidence.ps1 -EvidenceDirectory artifacts/evidence -OnlyFile application-restore-smoke.json -OutputPath artifacts/evidence/dr-evidence-contract.json
      - name: Upload application restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-restore-smoke-${{ github.run_id }}
          path: artifacts/evidence/application-restore-smoke.json
          if-no-files-found: error
      - name: Remove protected inputs
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.inputs.outputs.kubeconfig }}' -Force -ErrorAction SilentlyContinue
