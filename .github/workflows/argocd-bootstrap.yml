name: Argo CD Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target protected GitOps environment
        required: true
        type: choice
        options:
          - staging
          - production
      apply:
        description: Apply the verified manifest (false performs checksum/dry-run only)
        required: true
        default: false
        type: boolean
      manifest_sha256:
        description: Reviewed SHA-256 for the pinned Argo CD HA manifest
        required: true
        default: 2E6211D381B84394B5A7C98F5B285D24D48CBE2A2917C4181623D825109BD088
        type: string
      change_reference:
        description: Approved change/ticket reference (required for any apply)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: argocd-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Argo CD (${{ inputs.environment }})
    # The production API is on the private 172.16.102.0/24 network. Run the
    # protected bootstrap on the self-hosted runner that has internal routing.
    runs-on: [self-hosted, Linux, X64, gitops-mirror]
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.35.5'

      - name: Materialize target kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
          K3S_API_SERVER: ${{ secrets.K3S_API_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = '${{ inputs.environment }}'
          $encoded = if ($environment -eq 'production') { $env:KUBECONFIG_PRODUCTION_B64 } else { $env:KUBECONFIG_STAGING_B64 }
          if ([string]::IsNullOrWhiteSpace($encoded)) {
            throw "Kubeconfig secret is missing for protected environment '$environment'."
          }
          $path = Join-Path $env:RUNNER_TEMP "kubeconfig-$environment.yaml"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($encoded))
          if ($environment -eq 'production') {
            if ([string]::IsNullOrWhiteSpace($env:K3S_API_SERVER)) {
              throw 'K3S_API_SERVER is required for production runner connectivity.'
            }
            $server = $env:K3S_API_SERVER.TrimEnd('/')
            $yaml = Get-Content -LiteralPath $path -Raw
            $yaml = [regex]::Replace($yaml, '(?m)^(\s*server:\s*)https?://(?:127\.0\.0\.1|localhost):\d+\s*$', ('$1' + $server))
            Set-Content -LiteralPath $path -Value $yaml -NoNewline
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Verify and optionally bootstrap Argo CD
        shell: pwsh
        run: |
          $args = @(
            '-File', './scripts/bootstrap-argocd.ps1',
            '-Environment', '${{ inputs.environment }}',
            '-Kubeconfig', '${{ steps.kubeconfig.outputs.path }}',
            '-Version', 'v3.4.1',
            '-ManifestSha256', '${{ inputs.manifest_sha256 }}',
            '-HighAvailability'
          )
          if ('${{ inputs.environment }}' -eq 'production') { $args += '-AllowProduction' }
          if ('${{ inputs.apply }}' -ne 'true') { $args += '-WhatIf' }
          & pwsh @args

      - name: Apply reviewed GitOps bootstrap applications
        if: ${{ inputs.apply == true }}
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.change_reference }}' -notmatch '^[A-Za-z0-9][A-Za-z0-9._:/-]{2,79}$') {
            throw 'change_reference must identify the approved change ticket.'
          }
          "Applying reviewed Argo bootstrap with change reference: ${{ inputs.change_reference }}"
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=5m
          if ($LASTEXITCODE -ne 0) { throw 'Argo CD Application CRD did not become Established.' }
          kubectl apply --server-side --force-conflicts -k k8s/gitops/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'GitOps bootstrap resources could not be applied.' }
          # argocd-repo-server reads argocd-tls-certs-cm at process start. Roll
          # it after applying the reviewed internal CA so HTTPS Gitea sources
          # reconcile without manual cluster intervention.
          kubectl -n argocd rollout restart deployment/argocd-repo-server
          if ($LASTEXITCODE -ne 0) { throw 'Argo repo-server restart could not be requested.' }
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=5m
          if ($LASTEXITCODE -ne 0) { throw 'Argo repo-server did not become ready after CA reload.' }
          kubectl get appproject his-hope -n argocd
          kubectl get applications -n argocd -o name

      - name: Validate GitOps bootstrap contract
        shell: pwsh
        run: ./scripts/validate-argocd-bootstrap.ps1 -OutputPath artifacts/evidence/argocd-bootstrap-contract.json

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argocd-bootstrap-${{ github.run_id }}
          path: artifacts/evidence/argocd-bootstrap-contract.json
          if-no-files-found: error

      - name: Remove target kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
