name: Argo CD Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target protected GitOps environment
        required: true
        type: choice
        options:
          - staging
          - production
      apply:
        description: Apply the verified manifest (false performs checksum/dry-run only)
        required: true
        default: false
        type: boolean
      manifest_sha256:
        description: Reviewed SHA-256 for the pinned Argo CD standard manifest
        required: true
        default: 17F17C65A93A1D5E63822D4E6ADFC62D172E677A8F870A07A3F45F182EED657B
        type: string

permissions:
  contents: read

concurrency:
  group: argocd-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Argo CD (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.35.5'

      - name: Materialize target kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = '${{ inputs.environment }}'
          $encoded = if ($environment -eq 'production') { $env:KUBECONFIG_PRODUCTION_B64 } else { $env:KUBECONFIG_STAGING_B64 }
          if ([string]::IsNullOrWhiteSpace($encoded)) {
            throw "Kubeconfig secret is missing for protected environment '$environment'."
          }
          $path = Join-Path $env:RUNNER_TEMP "kubeconfig-$environment.yaml"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($encoded))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Verify and optionally bootstrap Argo CD
        shell: pwsh
        run: |
          $args = @(
            '-File', './scripts/bootstrap-argocd.ps1',
            '-Environment', '${{ inputs.environment }}',
            '-Kubeconfig', '${{ steps.kubeconfig.outputs.path }}',
            '-Version', 'v3.4.1',
            '-HighAvailability',
            '-ManifestSha256', '${{ inputs.manifest_sha256 }}',
          )
          if ('${{ inputs.environment }}' -eq 'production') { $args += '-AllowProduction' }
          if ('${{ inputs.apply }}' -ne 'true') { $args += '-WhatIf' }
          & pwsh @args

      - name: Apply reviewed GitOps bootstrap applications
        if: ${{ inputs.apply == true }}
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=5m
          if ($LASTEXITCODE -ne 0) { throw 'Argo CD Application CRD did not become Established.' }
          kubectl apply --server-side --force-conflicts -k k8s/gitops/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'GitOps bootstrap resources could not be applied.' }
          kubectl get appproject his-hope -n argocd
          kubectl get applications -n argocd -o name

      - name: Validate GitOps bootstrap contract
        shell: pwsh
        run: ./scripts/validate-argocd-bootstrap.ps1 -OutputPath artifacts/evidence/argocd-bootstrap-contract.json

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argocd-bootstrap-${{ github.run_id }}
          path: artifacts/evidence/argocd-bootstrap-contract.json
          if-no-files-found: error

      - name: Remove target kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
