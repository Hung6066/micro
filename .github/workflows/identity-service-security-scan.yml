name: Identity Service Security Scan
on:
  push:
    paths:
      - 'src/Services/IdentityService/**'
  pull_request:
    paths:
      - 'src/Services/IdentityService/**'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore src/Services/IdentityService/IdentityService.Api/
      - name: Build
        run: dotnet build src/Services/IdentityService/IdentityService.Api/ --no-restore
      - name: Check for known vulnerable packages
        run: dotnet list src/Services/IdentityService/IdentityService.Api/ package --vulnerable --include-transitive
