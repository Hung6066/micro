name: Identity Service Security Scan
on:
  push:
    paths:
      - 'src/Services/IdentityService/**'
  pull_request:
    paths:
      - 'src/Services/IdentityService/**'
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore src/Services/IdentityService/IdentityService.Api/
      - name: Build
        run: dotnet build src/Services/IdentityService/IdentityService.Api/ --no-restore
      - name: Check for known vulnerable packages
        run: dotnet list src/Services/IdentityService/IdentityService.Api/ package --vulnerable --include-transitive
