name: Coverage Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore
        run: dotnet restore
      
      - name: Backend Tests with Coverage
        run: |
          find tests/Services -type f -name '*.csproj' -print0 |
            xargs -0 -n1 dotnet test --collect:'XPlat Code Coverage' --results-directory:coverage-results
      
      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: 'coverage-results/**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'Html;HtmlSummary;Cobertura;lcov'
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          cd src/Frontend/his-hope-app
          npm ci
      
      - name: Frontend Tests with Coverage
        run: |
          cd src/Frontend/his-hope-app
          npm run test:coverage -- --runInBand
      
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/Frontend/his-hope-app/coverage
