name: Shared Package Governance

on:
    push:
        paths:
            - "config/shared-package-catalog*.json"
            - "shared/frontend-foundation/**"
            - "shared/mobile-foundation/**"
            - "src/Shared/**"
            - "scripts/validate-shared-package-governance.ps1"
            - "scripts/validate-shared-platform-boundaries.ps1"
            - "scripts/pack-shared-platform.ps1"
            - ".github/workflows/shared-package-governance.yml"
    pull_request:
        paths:
            - "config/shared-package-catalog*.json"
            - "shared/frontend-foundation/**"
            - "shared/mobile-foundation/**"
            - "src/Shared/**"
            - "scripts/validate-shared-package-governance.ps1"
            - "scripts/validate-shared-platform-boundaries.ps1"
            - "scripts/pack-shared-platform.ps1"
            - ".github/workflows/shared-package-governance.yml"

permissions:
    contents: read

jobs:
    governance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
            - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: "8.0.x"
            - run: npm ci --ignore-scripts
            - run: npm run validate:shared-packages
            - run: pwsh -NoProfile -File scripts/validate-shared-platform-boundaries.ps1
            - run: npm --workspace @his-hope/frontend-foundation run build
            - run: npm --workspace @his-hope/mobile-foundation run build
