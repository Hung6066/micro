name: Pod Security Production Rollout

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply boundary namespaces and restricted labels (false is preflight only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pod-security-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.35.5'

      - name: Materialize protected kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_PRODUCTION_B64)) {
            throw 'KUBECONFIG_PRODUCTION_B64 is required in the protected production environment.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'kubeconfig-production.yaml'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KUBECONFIG_PRODUCTION_B64))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Preflight boundary and restricted workload contract
        shell: pwsh
        run: |
          ./scripts/bootstrap-k3s-security-boundaries.ps1 -Kubeconfig '${{ steps.kubeconfig.outputs.path }}'

      - name: Apply approved security boundary rollout
        if: ${{ inputs.apply == true }}
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/validate-live-image-drift.ps1 -Environment prod -Kubeconfig $env:KUBECONFIG -Namespace his-hope
          ./scripts/bootstrap-k3s-security-boundaries.ps1 -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' -Apply -AllowProduction
          ./scripts/rollout-pod-security-production.ps1 -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' -WhatIf
          ./scripts/rollout-pod-security-production.ps1 -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' -Apply -AllowProduction
          ./scripts/validate-k3s-release.ps1 -Environment prod -Kubeconfig $env:KUBECONFIG -RequireCluster -RequirePodSecurity -OutputPath artifacts/evidence/production-release-after-pod-security.json

      - name: Upload rollout evidence
        if: always() && inputs.apply == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-security-production-${{ github.run_id }}
          path: artifacts/evidence/production-release-after-pod-security.json
          if-no-files-found: error

      - name: Remove protected kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
