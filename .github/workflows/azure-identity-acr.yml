name: Azure Identity ACR

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'src/Services/IdentityService/**'
      - 'infra/azure/phase0/**'
      - '.github/workflows/azure-identity-acr.yml'

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: identity-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then
            echo "AZURE_ACR_NAME repository variable is required (e.g. hishopacr)."
            exit 1
          fi
          az acr login --name "$ACR_NAME"

      - name: Build and push Identity image
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "AZURE_ACR_LOGIN_SERVER repository variable is required."
            exit 1
          fi
          TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
          STAGING_TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:staging"
          docker build \
            -f src/Services/IdentityService/IdentityService.Api/Dockerfile \
            -t "$TAG" \
            -t "$STAGING_TAG" \
            .
          docker push "$TAG"
          docker push "$STAGING_TAG"

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-identity-acr-metadata
          path: src/Services/IdentityService/IdentityService.Api/Dockerfile
          if-no-files-found: error
