name: His.Hope Policy Gate

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      # Avoid npm's workspace prepare hook racing secondary ng-packagr entry
      # points during install; the policy gate explicitly builds the package.
      - run: npm ci --ignore-scripts
      - name: Run mandatory His.Hope policy gate
        shell: pwsh
        run: ./scripts/verify-his-hope-policy.ps1 -Ci
