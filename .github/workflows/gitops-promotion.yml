name: GitOps Promotion PR

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Image name as listed in k8s/overlays/prod/image-digests/kustomization.yaml
        required: true
        type: string
      digest:
        description: Immutable sha256 digest
        required: true
        type: string
      environment:
        description: Production digest promotion target (staging is reconciled from its own application)
        required: true
        default: prod
        type: choice
        options: [prod]

permissions:
  contents: write
  pull-requests: write

jobs:
  promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Harbor trust chain
        shell: bash
        env:
          HARBOR_CA_CHAIN_B64: ${{ secrets.HARBOR_CA_CHAIN_B64 }}
        run: |
          set -euo pipefail
          test -n "${HARBOR_CA_CHAIN_B64:-}" || { echo 'HARBOR_CA_CHAIN_B64 environment secret is required for private Harbor TLS' >&2; exit 1; }
          printf '%s' "$HARBOR_CA_CHAIN_B64" | base64 --decode > /tmp/harbor-ca.crt
          test -s /tmp/harbor-ca.crt
          openssl x509 -in /tmp/harbor-ca.crt -noout -subject -issuer >/dev/null
          sudo install -m 0644 /tmp/harbor-ca.crt /usr/local/share/ca-certificates/his-hope-harbor.crt
          sudo update-ca-certificates

      - name: Update only the approved digest source
        shell: pwsh
        run: ./scripts/update-gitops-digest.ps1 -ImageName '${{ inputs.image_name }}' -Digest '${{ inputs.digest }}' -ReleaseSha '${{ github.sha }}' -Path 'k8s/overlays/prod/image-digests/kustomization.yaml'

      - name: Install pinned Cosign verifier
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o "$RUNNER_TOOL_CACHE/cosign"
          echo '8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  '"$RUNNER_TOOL_CACHE/cosign" | sha256sum --check --status
          chmod +x "$RUNNER_TOOL_CACHE/cosign"
          echo "$RUNNER_TOOL_CACHE" >> "$GITHUB_PATH"

      - name: Verify promoted digest signature and provenance
        shell: bash
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$HARBOR_REGISTRY" =~ ^[^/]+(:[0-9]+)?$ ]] || { echo 'HARBOR_REGISTRY must be a host[:port]' >&2; exit 1; }
          [[ "$HARBOR_PROJECT" == 'his-hope' ]] || { echo 'Production promotion is restricted to the his-hope Harbor project' >&2; exit 1; }
          [[ "$IMAGE_NAME" =~ ^his-hope/[a-z0-9][a-z0-9-]*$ ]] || { echo 'Invalid production image name' >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Promotion requires a lowercase sha256 digest' >&2; exit 1; }
          image="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME#his-hope/}@${IMAGE_DIGEST}"
          pwsh ./scripts/verify-image-attestations.ps1 \
            -ImageRef "$image" \
            -CertificateIdentityRegex "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-release.yml@refs/(heads/main|tags/v[0-9]+\\.[0-9]+\\.[0-9]+)$"

      - name: Render production overlay and inspect diff
        shell: pwsh
        run: |
          ./scripts/validate-kustomize-release.ps1 -Environment prod
          git diff --exit-code -- ':!k8s/overlays/prod/image-digests/kustomization.yaml' ':!k8s/overlays/prod/release-metadata.yaml' ':!artifacts/**'

      - name: Install runtime contract validation dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input pyyaml==6.0.2

      - name: Validate production runtime contracts
        shell: pwsh
        run: ./scripts/config/validate-kustomize-runtime.ps1 -Overlay prod

      - name: Create promotion PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: codex/gitops-${{ inputs.environment }}-${{ inputs.image_name }}-${{ github.run_id }}
          base: main
          title: "chore(gitops): promote ${{ inputs.image_name }} to ${{ inputs.environment }}"
          commit-message: "chore(gitops): promote ${{ inputs.image_name }} by digest"
          body: |
            Promotion is digest-only and was rendered before this PR was opened.

            - Environment: `${{ inputs.environment }}`
            - Image: `${{ inputs.image_name }}`
            - Digest: `${{ inputs.digest }}`
            - Admission/signature verification remains required before sync.
          labels: gitops,security-review
