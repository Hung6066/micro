name: Harbor Clean Node DR Drill

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [staging, production]
      apply:
        description: Run the real isolated pull drill (false is dry-run)
        required: true
        default: false
        type: boolean
      node_name:
        description: Clean node name selected by the operator
        required: true
        type: string
      test_image:
        description: Approved Harbor shell-capable image digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harbor-clean-node-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.35.5'

      - name: Materialize target kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
        run: |
          $encoded = if ('${{ inputs.environment }}' -eq 'production') { $env:KUBECONFIG_PRODUCTION_B64 } else { $env:KUBECONFIG_STAGING_B64 }
          if ([string]::IsNullOrWhiteSpace($encoded)) { throw 'Kubeconfig secret is missing.' }
          $path = Join-Path $env:RUNNER_TEMP "kubeconfig-${{ inputs.environment }}.yaml"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($encoded))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Run isolated Harbor pull drill
        shell: pwsh
        run: |
          $args = @('-File', './scripts/test-harbor-clean-node.ps1',
            '-Environment', '${{ inputs.environment }}',
            '-Kubeconfig', '${{ steps.kubeconfig.outputs.path }}',
            '-TestImage', '${{ inputs.test_image }}',
            '-NodeName', '${{ inputs.node_name }}',
            '-OutputPath', 'artifacts/evidence/harbor-clean-node-test.json')
          if ('${{ inputs.environment }}' -eq 'production') { $args += '-AllowProduction' }
          if ('${{ inputs.apply }}' -eq 'true') { $args += '-WhatIf:$false' } else { $args += '-WhatIf' }
          & pwsh @args

      - name: Validate measured evidence
        if: ${{ inputs.apply == true }}
        shell: pwsh
        run: ./scripts/validate-dr-evidence.ps1 -EvidenceDirectory artifacts/evidence -OnlyFile harbor-clean-node-test.json -OutputPath artifacts/evidence/dr-evidence-contract.json

      - name: Upload Harbor drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbor-clean-node-drill-${{ github.run_id }}
          path: artifacts/evidence/harbor-clean-node-test.json
          if-no-files-found: error

      - name: Remove kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
