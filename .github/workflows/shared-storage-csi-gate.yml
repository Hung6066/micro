name: Shared CSI Storage Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected cluster to inspect
        required: true
        type: choice
        options:
          - staging
          - production
      storage_class:
        description: Reviewed Viettel vSAN/NFS CSI StorageClass name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-storage-csi-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate external shared CSI (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.35.5'

      - name: Materialize protected kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = if ('${{ inputs.environment }}' -eq 'production') { $env:KUBECONFIG_PRODUCTION_B64 } else { $env:KUBECONFIG_STAGING_B64 }
          if ([string]::IsNullOrWhiteSpace($encoded)) { throw 'Protected kubeconfig secret is missing.' }
          $path = Join-Path $env:RUNNER_TEMP 'kubeconfig-shared-storage.yaml'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($encoded))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Validate shared CSI contract (read-only)
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
          REVIEWED_STORAGE_CLASS: ${{ inputs.storage_class }}
        run: |
          New-Item -ItemType Directory -Force artifacts/evidence | Out-Null
          ./scripts/validate-shared-storage-contract.ps1 `
            -Kubeconfig $env:KUBECONFIG `
            -StorageClassName $env:REVIEWED_STORAGE_CLASS `
            -RequireSnapshotClass `
            -RequireApprovalAnnotation `
            -OutputPath artifacts/evidence/shared-storage-${{ inputs.environment }}.json

      - name: Upload shared CSI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-storage-csi-${{ inputs.environment }}-${{ github.run_id }}
          path: artifacts/evidence/shared-storage-${{ inputs.environment }}.json
          if-no-files-found: error

      - name: Remove protected kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
