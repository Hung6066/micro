name: K3s Secrets Encryption Rotation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [staging, production]
      apply:
        description: Rotate keys and re-encrypt existing Secrets (false is dry-run)
        required: true
        default: false
        type: boolean
      snapshot_path:
        description: Reviewed etcd snapshot path on the first control-plane host
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: k3s-secrets-encryption-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Materialize protected Ansible inputs
        id: inputs
        shell: bash
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANSIBLE_SSH_PRIVATE_KEY" -a -n "$ANSIBLE_VAULT_PASSWORD"
          ssh_key="$RUNNER_TEMP/id_deploy"
          vault_password="$RUNNER_TEMP/ansible-vault-password"
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > "$ssh_key"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$vault_password"
          chmod 600 "$ssh_key" "$vault_password"
          echo "ssh_key=$ssh_key" >> "$GITHUB_OUTPUT"
          echo "vault_password=$vault_password" >> "$GITHUB_OUTPUT"
      - name: Install pinned Ansible
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input ansible-core==2.17.10
      - name: Run guarded rotation procedure
        shell: pwsh
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ steps.inputs.outputs.ssh_key }}
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ steps.inputs.outputs.vault_password }}
        run: |
          $args = @('-Environment', '${{ inputs.environment }}', '-Inventory', 'ansible/enterprise-k3s/inventory/production.yml', '-Playbook', 'ansible/enterprise-k3s/playbooks/45-rotate-k3s-secrets-encryption.yml', '-SshKeyPath', '${{ steps.inputs.outputs.ssh_key }}', '-VaultPasswordPath', '${{ steps.inputs.outputs.vault_password }}', '-SnapshotPath', '${{ inputs.snapshot_path }}', '-OutputPath', 'artifacts/evidence/k3s-secrets-encryption-rotation.json')
          if ('${{ inputs.apply }}' -eq 'true') { $args += '-Apply'; if ('${{ inputs.environment }}' -eq 'production') { $args += '-AllowProduction' } }
          & ./scripts/rotate-k3s-secrets-encryption.ps1 @args
      - name: Upload rotation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k3s-secrets-encryption-rotation-${{ github.run_id }}
          path: artifacts/evidence/k3s-secrets-encryption-rotation.json
          if-no-files-found: error
      - name: Remove protected inputs
        if: always()
        shell: bash
        run: rm -f '${{ steps.inputs.outputs.ssh_key }}' '${{ steps.inputs.outputs.vault_password }}'
