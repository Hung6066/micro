name: Deploy to Openship

on:
  push:
    branches: [developer]
    paths:
      - "src/**"
      - "admin-app/**"
      - "internal-operator-app/**"
      - "manufacturing-buyer-app/**"
      - "docker/docker-compose.yml"
      - "docker/openship/**"
      - "openship.yaml"
      - "scripts/openship/**"
      - ".github/workflows/openship-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running rollout.
concurrency:
  group: openship-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Base URL of the Openship API, e.g. https://dashboard.nacoms.com.vn/api/proxy
      OPENSHIP_API_URL: ${{ vars.OPENSHIP_API_URL }}
      OPENSHIP_PROJECT: ${{ vars.OPENSHIP_PROJECT || 'micro' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Openship CLI
        run: npm install --global openship

      - name: Log in to Openship
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
        run: |
          openship login \
            --token "$OPENSHIP_TOKEN" \
            --api-url "$OPENSHIP_API_URL" \
            --dashboard-url "$OPENSHIP_API_URL"

      - name: Sync per-service environment
        env:
          MICRO_JWT_ISSUER: ${{ vars.MICRO_JWT_ISSUER }}
          MICRO_JWT_AUTHORITY: ${{ vars.MICRO_JWT_AUTHORITY }}
          MICRO_OIDC_ISSUER: ${{ vars.MICRO_OIDC_ISSUER }}
          MICRO_AUTHZ_PDP_MODE: ${{ vars.MICRO_AUTHZ_PDP_MODE }}
          MICRO_IDENTITY_BOOTSTRAP_PASSWORD: ${{ secrets.MICRO_IDENTITY_BOOTSTRAP_PASSWORD }}
          MICRO_REDIS_URL: ${{ secrets.MICRO_REDIS_URL }}
          MICRO_REDIS_CA: ${{ secrets.MICRO_REDIS_CA }}
          MICRO_REDIS_CLIENT_CRT: ${{ secrets.MICRO_REDIS_CLIENT_CRT }}
          MICRO_REDIS_CLIENT_KEY: ${{ secrets.MICRO_REDIS_CLIENT_KEY }}
          MICRO_PG_CA: ${{ secrets.MICRO_PG_CA }}
          MICRO_PG_CLIENT_CRT: ${{ secrets.MICRO_PG_CLIENT_CRT }}
          MICRO_PG_CLIENT_KEY: ${{ secrets.MICRO_PG_CLIENT_KEY }}
          MICRO_IDENTITY_DB_CONNECTION: ${{ secrets.MICRO_IDENTITY_DB_CONNECTION }}
          MICRO_COMMERCE_DB_CONNECTION: ${{ secrets.MICRO_COMMERCE_DB_CONNECTION }}
          MICRO_CONTENT_DB_CONNECTION: ${{ secrets.MICRO_CONTENT_DB_CONNECTION }}
          MICRO_MANUFACTURING_DB_CONNECTION: ${{ secrets.MICRO_MANUFACTURING_DB_CONNECTION }}
          MICRO_RABBITMQ_CA: ${{ secrets.MICRO_RABBITMQ_CA }}
          MICRO_RABBITMQ_CLIENT_CRT: ${{ secrets.MICRO_RABBITMQ_CLIENT_CRT }}
          MICRO_RABBITMQ_CLIENT_KEY: ${{ secrets.MICRO_RABBITMQ_CLIENT_KEY }}
          MICRO_COMMERCE_RABBITMQ_USER: ${{ secrets.MICRO_COMMERCE_RABBITMQ_USER }}
          MICRO_COMMERCE_RABBITMQ_PASSWORD: ${{ secrets.MICRO_COMMERCE_RABBITMQ_PASSWORD }}
          MICRO_MANUFACTURING_RABBITMQ_USER: ${{ secrets.MICRO_MANUFACTURING_RABBITMQ_USER }}
          MICRO_MANUFACTURING_RABBITMQ_PASSWORD: ${{ secrets.MICRO_MANUFACTURING_RABBITMQ_PASSWORD }}
        run: node scripts/openship/sync-service-env.mjs --project "$OPENSHIP_PROJECT" --env production

      - name: Deploy
        run: |
          openship deploy \
            --project "$OPENSHIP_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --env production \
            --watch
