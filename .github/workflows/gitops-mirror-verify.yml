name: GitOps Mirror and Argo Verification

on:
  workflow_run:
    workflows: ["GitOps Mirror Synchronization"]
    types: [completed]
    branches: [production]
  workflow_dispatch:
    inputs:
      revision:
        description: 40-character production commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitops-mirror-verify-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, gitops-mirror]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run evaluates this workflow from the default branch. The
          # verifier must execute the reviewed synchronization revision so
          # production does not fall back to stale verifier code from main.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Validate trusted mirror synchronization event
        shell: pwsh
        env:
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || 'production' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'GitOps Mirror Synchronization' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HEAD_REPOSITORY -ne '${{ github.repository }}' -or
              $env:HEAD_BRANCH -ne 'production' -or
              $env:WORKFLOW_NAME -ne 'GitOps Mirror Synchronization') {
            throw 'Mirror verification requires a successful synchronization run from this repository production branch.'
          }

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.5

      - name: Materialize production kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
          K3S_API_SERVER: ${{ secrets.K3S_API_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_PRODUCTION_B64)) {
            throw 'KUBECONFIG_PRODUCTION_B64 is required for read-only mirror verification.'
          }
          if ($env:K3S_API_SERVER -notmatch '^https://[^/:]+(?::[0-9]+)?$') {
            throw 'Production secret K3S_API_SERVER must be an HTTPS Kubernetes API endpoint.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'kubeconfig-production.yaml'
          $yaml = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:KUBECONFIG_PRODUCTION_B64))
          $serverPattern = '(?m)^(\s*server:\s*)https://[^\s]+\s*$'
          if ($yaml -notmatch $serverPattern) {
            throw 'Production kubeconfig does not contain a Kubernetes server endpoint.'
          }
          $yaml = [Text.RegularExpressions.Regex]::Replace($yaml, $serverPattern, ('$1' + $env:K3S_API_SERVER))
          [IO.File]::WriteAllText($path, $yaml, [Text.UTF8Encoding]::new($false))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Capture Argo application status
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          kubectl --kubeconfig $env:KUBECONFIG -n argocd get applications -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REV:.status.sync.revision

      - name: Verify all Git mirror and Argo revisions
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
          EXPECTED_REPO_URL: ${{ vars.GITOPS_MIRROR_REPO_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'Expected production revision must be a 40-character lowercase commit SHA.'
          }
          if ($env:EXPECTED_REPO_URL -notmatch '^https://[^/]+/[^/]+/[^/]+\.git$') {
            throw 'GITOPS_MIRROR_REPO_URL must be an HTTPS repository URL.'
          }
          $verificationOutput = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $verificationOutput = & ./scripts/verify-git-mirror.ps1 `
              -ExpectedRevision $env:EXPECTED_REVISION `
              -ExpectedRepoUrl $env:EXPECTED_REPO_URL `
              -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' `
              -RequireSynced `
              -OutputPath artifacts/evidence/gitops-mirror-verification.json 2>&1
            if ($LASTEXITCODE -eq 0) {
              $verificationOutput
              exit 0
            }
            Write-Warning "Mirror/Argo verification attempt $attempt/30 is not ready yet."
            if ($attempt -lt 30) { Start-Sleep -Seconds 20 }
          }
          $verificationOutput
          throw 'Git mirror and Argo verification did not converge within 10 minutes.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitops-mirror-verification-${{ github.run_id }}
          path: artifacts/evidence/gitops-mirror-verification.json
          if-no-files-found: error

      - name: Remove production kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
