name: GitOps Mirror and Argo Verification

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      expected_revision:
        description: 40-character production commit to verify in the mirror and Argo CD
        required: true
        type: string
      max_attempts:
        description: Maximum convergence attempts (use 1 for read-only diagnostics)
        required: false
        default: '30'
        type: string
permissions:
  contents: read

concurrency:
  group: gitops-mirror-verify-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, gitops-mirror]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Run from the production push itself so this verifier is not loaded
          # from a stale default-branch workflow definition. The retry loop
          # below allows mirror synchronization to complete concurrently.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}

      - name: Install pinned kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: v1.35.5

      - name: Materialize production kubeconfig
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_PRODUCTION_B64: ${{ secrets.KUBECONFIG_PRODUCTION_B64 }}
          K3S_API_SERVER: ${{ secrets.K3S_API_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_PRODUCTION_B64)) {
            throw 'KUBECONFIG_PRODUCTION_B64 is required for read-only mirror verification.'
          }
          if ([string]::IsNullOrWhiteSpace($env:K3S_API_SERVER)) {
            throw 'K3S_API_SERVER is required for production runner connectivity.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'kubeconfig-production.yaml'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KUBECONFIG_PRODUCTION_B64))
          $server = $env:K3S_API_SERVER.TrimEnd('/')
          $yaml = Get-Content -LiteralPath $path -Raw
          $yaml = [regex]::Replace($yaml, '(?m)^(\s*server:\s*)https?://(?:127\.0\.0\.1|localhost):\d+\s*$', ('$1' + $server))
          Set-Content -LiteralPath $path -Value $yaml -NoNewline
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Capture identity runtime diagnostics
        if: always()
        shell: pwsh
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          $ErrorActionPreference = 'Continue'
          $output = 'artifacts/evidence/identity-runtime'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope get deployment identity-service -o json > "$output/deployment.json"
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope get pods -l app.kubernetes.io/name=identity-service -o wide > "$output/pods.txt"
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope get endpoints identity-service -o yaml > "$output/endpoints.yaml"
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope get events --sort-by=.lastTimestamp > "$output/events.txt"
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope describe deployment identity-service > "$output/deployment-describe.txt"
          kubectl --kubeconfig $env:KUBECONFIG -n his-hope describe pods -l app.kubernetes.io/name=identity-service > "$output/pods-describe.txt"
          $pod = (kubectl --kubeconfig $env:KUBECONFIG -n his-hope get pods -l app.kubernetes.io/name=identity-service -o jsonpath='{.items[0].metadata.name}').Trim()
          if (-not [string]::IsNullOrWhiteSpace($pod)) {
            kubectl --kubeconfig $env:KUBECONFIG -n his-hope logs $pod -c identity-service --previous --tail=200 > "$output/identity-service-previous.log"
          }

      - name: Upload identity runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-runtime-diagnostics-${{ github.run_id }}
          path: artifacts/evidence/identity-runtime
          if-no-files-found: warn

      - name: Verify all Git mirror and Argo revisions
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_revision || github.sha }}
          EXPECTED_REPO_URL: ${{ vars.GITOPS_MIRROR_REPO_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'Expected production revision must be a 40-character lowercase commit SHA.'
          }
          if ($env:EXPECTED_REPO_URL -notmatch '^https://[^/]+/[^/]+/[^/]+\.git$') {
            throw 'GITOPS_MIRROR_REPO_URL must be an HTTPS repository URL.'
          }
          $maxAttempts = [int]'${{ inputs.max_attempts || 30 }}'
          if ($maxAttempts -lt 1 -or $maxAttempts -gt 30) {
            throw 'max_attempts must be between 1 and 30.'
          }
          $verificationOutput = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $verificationOutput = & ./scripts/verify-git-mirror.ps1 `
              -ExpectedRevision $env:EXPECTED_REVISION `
              -ExpectedRepoUrl $env:EXPECTED_REPO_URL `
              -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' `
              -RequireSynced `
              -OutputPath artifacts/evidence/gitops-mirror-verification.json 2>&1
            if ($LASTEXITCODE -eq 0) {
              $verificationOutput
              exit 0
            }
            Write-Warning "Mirror/Argo verification attempt $attempt/$maxAttempts is not ready yet."
            if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 20 }
          }
          $verificationOutput
          throw "Git mirror and Argo verification did not converge within $maxAttempts attempt(s)."

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitops-mirror-verification-${{ github.run_id }}
          path: artifacts/evidence/gitops-mirror-verification.json
          if-no-files-found: error

      - name: Remove production kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
