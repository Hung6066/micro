name: Admission Policy Staging Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-policy-staging-gate
  cancel-in-progress: false

jobs:
  positive-negative-admission:
    name: Positive and negative API admission tests
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.35.5'
      - name: Materialize staging kubeconfig in runner workspace
        id: kubeconfig
        shell: pwsh
        env:
          KUBECONFIG_STAGING_B64: ${{ secrets.KUBECONFIG_STAGING_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_STAGING_B64)) {
            throw 'KUBECONFIG_STAGING_B64 GitHub environment secret is required for this manual gate.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'kubeconfig-staging.yaml'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KUBECONFIG_STAGING_B64))
          "path=$path" >> $env:GITHUB_OUTPUT
          $env:KUBECONFIG = $path
          kubectl version --output=json --request-timeout=10s | Out-Null
      - name: Run fail-closed admission tests
        shell: pwsh
        run: ./scripts/test-admission-policy.ps1 -Kubeconfig '${{ steps.kubeconfig.outputs.path }}' -RequireCluster -OutputPath artifacts/evidence/admission-policy-tests.json
      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admission-policy-staging
          path: artifacts/evidence/admission-policy-tests.json
          if-no-files-found: error
      - name: Remove kubeconfig
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.kubeconfig.outputs.path }}' -Force -ErrorAction SilentlyContinue
