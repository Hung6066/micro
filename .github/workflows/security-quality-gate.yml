name: Security Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dotnet-security:
    name: .NET restore and vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.319'
      - name: Restore with dependency warnings as errors
        run: dotnet restore His.Hope.sln -warnAsError:NU1605 -warnAsError:NU1901 -warnAsError:NU1902 -warnAsError:NU1903 -warnAsError:NU1904
      - name: Build with dependency warnings as errors
        run: dotnet build His.Hope.sln --no-restore --warnaserror:NU1605 --warnaserror:NU1901 --warnaserror:NU1902 --warnaserror:NU1903 --warnaserror:NU1904
      - name: Dependency vulnerability report
        shell: bash
        run: |
          set -euo pipefail
          dotnet list His.Hope.sln package --vulnerable --include-transitive

  frontend-security:
    name: Angular production dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          (cd admin-app && npm audit --omit=dev --audit-level=high)
          (cd dashboard-app && npm audit --omit=dev --audit-level=high)
          (cd src/Frontend/his-hope-app && npm audit --omit=dev --audit-level=high)
      - name: Build all Angular applications
        run: |
          npm run build:shared
          npm --workspace admin-app run build -- --configuration production
          npm --workspace dashboard-app run build -- --configuration production
          npm --workspace his-hope-app run build

  filesystem-security:
    name: Repository and container security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Kubernetes misconfiguration is scanned against rendered manifests
          # in the dedicated K3s DevSecOps gate.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The action's SARIF build step currently exits non-zero when the
          # scanner emits informational findings, even when the configured
          # HIGH/CRITICAL gate is clean. Keep the gate strict by parsing the
          # severity-filtered SARIF below instead of trusting that wrapper exit.
          exit-code: '0'
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
      - name: Enforce Trivy SARIF severity gate
        shell: node {0}
        run: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
          const findings = (report.runs ?? []).flatMap(run => run.results ?? []);
          if (findings.length) {
            console.error(`Trivy HIGH/CRITICAL findings: ${findings.length}`);
            process.exit(1);
          }
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          sarif_file: trivy-results.sarif
      - name: Generate SBOM
        uses: anchore/sbom-action@f5e124a5e5e1d497a692818ae907d3c45829d033 # v0.17.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: his-hope-sbom.cdx.json
          output-file: his-hope-sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: his-hope-sbom
          path: his-hope-sbom.cdx.json
      - name: Kubernetes manifest policy scan
        shell: pwsh
        run: |
          ./scripts/validate-kustomize-release.ps1 -Environment prod
          ./scripts/verify-admission-policy.ps1
          python scripts/validate-manifest-secret-contract.py
      - name: Validate container build contract
        run: python scripts/validate-container-build-contract.py
      - name: Verify SBOM artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s his-hope-sbom.cdx.json
          node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync('his-hope-sbom.cdx.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components)) process.exit(1);"
      - name: Build and scan every repository container
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find . -type f -name Dockerfile -not -path './docs/*' -not -path './node_modules/*' | sort)
          test "${#dockerfiles[@]}" -gt 0
          mkdir -p security-container-logs
          for dockerfile in "${dockerfiles[@]}"; do
            safe_name="${dockerfile#./}"
            safe_name="${safe_name//\//-}"
            safe_name="${safe_name//./-}"
            image="his-hope-scan:${safe_name//[^a-zA-Z0-9_-]/-}"
            # Repository Dockerfiles restore shared projects from the repository
            # root; using dirname(Dockerfile) would silently change the build
            # context and produce false security-gate failures.
            echo "Building and scanning $dockerfile as $image"
            build_log="security-container-logs/${safe_name}.build.log"
            scan_log="security-container-logs/${safe_name}.trivy.log"
            for attempt in 1 2 3; do
              if docker build --file "$dockerfile" --tag "$image" . 2>&1 | tee "$build_log"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Docker build failed after 3 attempts: $dockerfile" >&2
                echo "::error title=Docker build failed::$dockerfile"
                exit 1
              fi
              echo "Docker build attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
            for attempt in 1 2 3; do
              if trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image" 2>&1 | tee "$scan_log"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Trivy image gate failed after 3 attempts: $dockerfile" >&2
                echo "::error title=Trivy image gate failed::$dockerfile"
                exit 1
              fi
              echo "Trivy attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
          done
      - name: Upload container security logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-container-logs
          path: security-container-logs
          if-no-files-found: warn
