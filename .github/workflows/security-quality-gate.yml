name: Security Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dotnet-security:
    name: .NET restore and vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.319'
      - name: Restore with dependency warnings as errors
        run: dotnet restore His.Hope.sln -warnAsError:NU1605 -warnAsError:NU1901 -warnAsError:NU1902 -warnAsError:NU1903 -warnAsError:NU1904
      - name: Build with dependency warnings as errors
        run: dotnet build His.Hope.sln --no-restore --warnaserror:NU1605 --warnaserror:NU1901 --warnaserror:NU1902 --warnaserror:NU1903 --warnaserror:NU1904
      - name: Dependency vulnerability report
        shell: bash
        run: |
          set -euo pipefail
          dotnet list His.Hope.sln package --vulnerable --include-transitive

  frontend-security:
    name: Angular production dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          (cd admin-app && npm audit --omit=dev --audit-level=high)
          (cd dashboard-app && npm audit --omit=dev --audit-level=high)
          (cd src/Frontend/his-hope-app && npm audit --omit=dev --audit-level=high)
      - name: Build all Angular applications
        run: |
          npm run build:shared
          npm --workspace admin-app run build -- --configuration production
          npm --workspace dashboard-app run build -- --configuration production
          npm --workspace his-hope-app run build

  filesystem-security:
    name: Repository and container security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Validate scan coverage contract
        run: python scripts/validate-security-quality-gate-contract.py
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          sarif_file: trivy-results.sarif
      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-filesystem-report
          path: trivy-results.sarif
          if-no-files-found: error
      - name: Generate SBOM
        uses: anchore/sbom-action@f5e124a5e5e1d497a692818ae907d3c45829d033 # v0.17.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: his-hope-sbom.cdx.json
          output-file: his-hope-sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: his-hope-sbom
          path: his-hope-sbom.cdx.json
      - name: Kubernetes manifest policy scan
        shell: pwsh
        run: |
          ./scripts/validate-kustomize-release.ps1 -Environment prod
          ./scripts/verify-admission-policy.ps1
          python scripts/validate-manifest-secret-contract.py
      - name: Validate container build contract
        run: python scripts/validate-container-build-contract.py
      - name: Verify SBOM artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s his-hope-sbom.cdx.json
          node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync('his-hope-sbom.cdx.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components)) process.exit(1);"
      - name: Build and scan every production container
        shell: bash
        run: |
          set -euo pipefail
          # docker/sandbox is a developer-only SDK utility, not a production
          # workload image. Its pinned .NET 8 SDK is retained for local
          # compatibility; production images remain fail-closed below.
          mapfile -t dockerfiles < <(find . -type f -name Dockerfile -not -path './docs/*' -not -path './node_modules/*' -not -path './docker/sandbox/Dockerfile' | sort)
          test "${#dockerfiles[@]}" -gt 0
          scan_one() {
            set -euo pipefail
            dockerfile="$1"
            dockerfile_path="${dockerfile#./}"
            image="his-hope-scan:$(echo "$dockerfile_path" | tr '/._' '-')"
            trivy_lock="$RUNNER_TEMP/trivy-cache.lock"
            # Repository Dockerfiles restore shared projects from the repository
            # root; using dirname(Dockerfile) would silently change the build
            # context and produce false security-gate failures.
            timeout --signal=TERM --kill-after=30s 10m docker build --file "$dockerfile" --tag "$image" .
            # Trivy's default filesystem cache is process-exclusive. Builds may
            # run in parallel, but scans must serialize cache access or a
            # concurrent scan fails with exit code 123 before reporting findings.
            (
              flock 9
              timeout --signal=TERM --kill-after=30s 5m trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image"
            ) 9>"$trivy_lock"
          }
          export -f scan_one
          # Keep concurrency bounded for the hosted runner while avoiding a
          # 23-image sequential queue that can exhaust the 45-minute job.
          set +e
          timeout --signal=TERM --kill-after=60s 40m \
            xargs -0 -r -n1 -P3 bash -c 'scan_one "$1"' _ \
            < <(printf '%s\0' "${dockerfiles[@]}")
          scan_status=$?
          set -e
          if [ "$scan_status" -eq 124 ] || [ "$scan_status" -eq 137 ]; then
            echo "Timed out while building/scanning production containers" >&2
            exit 124
          fi
          exit "$scan_status"
