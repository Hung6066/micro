name: Legacy GitOps Release Promotion (Retired)

# Kept as an inert workflow record so historical DORA runs remain queryable.
# Application image build, signing, and K3s rollout are owned by OpenShip.
on:
  workflow_run:
    workflows: [Container Release Supply Chain]
    types: [completed]

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Application release promotion is retired; use OpenShip."
