apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
    environment: dev
  name: api-gateway
  namespace: his-hope-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: his-hope
      app.kubernetes.io/version: latest
      environment: dev
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
      labels:
        app: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        environment: dev
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: api-gateway-config
        image: his-hope/api-gateway:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        name: api-gateway
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        - containerPort: 5001
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 128m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1654
          runAsUser: 1654
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api-gateway
---
