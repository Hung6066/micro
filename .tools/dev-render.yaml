          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - SETGID
            - SETUID
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
          subPath: pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: postgres-init
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 493
          name: postgres-init
        name: postgres-init
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        environment: dev
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: local-path
