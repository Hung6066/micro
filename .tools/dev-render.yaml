metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
    environment: dev
  name: identity-service
  namespace: his-hope-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: identity-service
      app.kubernetes.io/part-of: his-hope
      app.kubernetes.io/version: latest
      environment: dev
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
      labels:
        app: identity-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        environment: dev
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: Vault__RequireVault
          value: "false"
        - name: Vault__Address
          valueFrom:
            configMapKeyRef:
              key: vault_address
              name: identity-service-config
        - name: Vault__AuthMount
          value: kubernetes
        - name: Vault__Role
          value: identity-service
        - name: Vault__JwtTokenFile
          value: /var/run/secrets/tokens/vault
        - name: Vault__AllowStaticToken
          value: "false"
        - name: Vault__Transit__KeyName
          value: jwt-signing
        - name: OpenIddict__Issuer
          value: https://identity.his-hope.local
        envFrom:
        - configMapRef:
            name: identity-service-config
        image: his-hope/identity-service:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        name: identity-service
        ports:
        - containerPort: 5003
          name: http
          protocol: TCP
        - containerPort: 5007
          name: grpc
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health/ready
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 128m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1654
          runAsUser: 1654
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /health/ready
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/run/secrets/tokens
          name: vault-workload-token
          readOnly: true
      initContainers: []
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: identity-service
      volumes:
      - name: pgbouncer-volume
        projected:
          sources:
          - configMap:
              items:
              - key: pgbouncer.ini
                path: pgbouncer.ini
              name: pgbouncer-config
          - secret:
              items:
              - key: userlist.txt
                path: userlist.txt
              name: pgbouncer-secret
      - name: vault-workload-token
        projected:
          sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 3600
              path: vault
