apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: security
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
    environment: dev
  name: seccomp-profile-installer
  namespace: his-hope-dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: seccomp-profile-installer
      app.kubernetes.io/part-of: his-hope
      app.kubernetes.io/version: latest
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: seccomp-profile-installer
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        environment: dev
    spec:
      containers:
      - command:
        - sleep
        - infinity
        image: busybox:1.36
        name: sleep
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -e
          echo "Installing seccomp profiles..."
          mkdir -p /host
          for f in /profiles/*.json; do
            echo "  Copying $(basename "$f")"
            cp "$f" /host/
          done
          echo "Done. Profiles installed to /var/lib/kubelet/seccomp/"
        image: busybox:1.36
        name: copy-profiles
        volumeMounts:
        - mountPath: /profiles
          name: profiles
          readOnly: true
        - mountPath: /host
          name: host
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          name: seccomp-profiles
        name: profiles
      - hostPath:
          path: /var/lib/kubelet/seccomp
          type: DirectoryOrCreate
        name: host
---
