    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
    environment: dev
  name: postgres
  namespace: his-hope-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: his-hope
      app.kubernetes.io/version: latest
      environment: dev
  serviceName: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        environment: dev
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          value: his_hope
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-secret
        - name: POSTGRES_MULTIPLE_DATABASES
          value: patientdb,identitydb,appointmentdb,clinicaldb,billingdb,labdb,pharmacydb,unleashdb
        - name: POSTGRES_DB
          value: patientdb
        image: postgres:16
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - his_hope
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - his_hope
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
