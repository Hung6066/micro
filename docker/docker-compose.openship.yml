name: manufacturing

# Standalone Manufacturing backend stack.
# This file intentionally does not include Patient, Appointment, Clinical,
# Lab, Billing, Pharmacy, API Gateway, or frontend apps.
# Identity/OIDC, Commerce and Content are included because they are shared
# dependencies of the Manufacturing business flow. Unrelated clinical and
# hospital services are intentionally absent.
# Openship variant: Postgres, Redis and RabbitMQ are provided by Openship service
# bindings. Identity signing/encryption PEMs are injected as env (*_PEM) per service,
# so only the 8 application services are declared here with no volumes.

services:
  identityservice:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ..
      dockerfile: src/Services/IdentityService/IdentityService.Api/Dockerfile
    container_name: manufacturing-standalone-identity
    ports:
      - "${MANUFACTURING_IDENTITY_PORT:-5001}:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5003
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      Persistence__RunMigrationsOnStartup: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Jwt__AllowHttp: "true"
      OpenIddict__Issuer: ${MANUFACTURING_OIDC_ISSUER:-http://localhost:5001}
      OpenIddict__InternalJwksUri: http://identityservice:5003/.well-known/jwks
      OpenIddict__Encryption__KeyId: manufacturing-oidc-encryption-v1
      Identity__BootstrapAdmin__Password: ${MANUFACTURING_IDENTITY_BOOTSTRAP_PASSWORD:-}
      Identity__BootstrapAdmin__ResetPassword: ${MANUFACTURING_IDENTITY_RESET_PASSWORD:-false}
      Conglomerate__Enabled: "true"
      Conglomerate__Organization__Key: manufacturing
      Conglomerate__Organization__DisplayName: Manufacturing
      Conglomerate__SeedPilotMemberships: "true"
      Conglomerate__SeedPilotUsers: "true"
      Conglomerate__Tenants__0__Key: manufacturing
      Conglomerate__Tenants__0__DisplayName: Manufacturing
      Conglomerate__Tenants__1__Key: tech-vendor
      Conglomerate__Tenants__1__DisplayName: Technology Vendor
      Conglomerate__Tenants__2__Key: group-hq
      Conglomerate__Tenants__2__DisplayName: Group Headquarters
      Conglomerate__Tenants__3__Key: customer-acme
      Conglomerate__Tenants__3__DisplayName: Acme Healthcare
      Conglomerate__Tenants__4__Key: customer-factory-x
      Conglomerate__Tenants__4__DisplayName: Factory X Industrial
      Conglomerate__OidcClientTenantsJson: '{"manufacturing-app":"manufacturing","his-hope-operator-mobile":"manufacturing","tech-console":"tech-vendor","group-hq-admin":"group-hq","his-hope-admin":"group-hq","customer-acme-portal":"customer-acme","customer-acme-app":"customer-acme","customer-factory-x-portal":"customer-factory-x","customer-factory-x-app":"customer-factory-x"}'
      AUTHZ_PDP_MODE: disabled
      Vault__Address: ""
      Vault__RequireVault: "false"
      Vault__EnableTransit: "false"
      Vault__AllowStaticToken: "true"
    networks: [manufacturing, openship_observability]
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  commerceservice:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ../src
      dockerfile: Services/CommerceService/CommerceService.Api/Dockerfile
    container_name: manufacturing-standalone-commerce
    ports:
      - "${MANUFACTURING_COMMERCE_PORT:-5015}:5015"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5015
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      Persistence__RunMigrationsOnStartup: "true"
      TenantPlacement__Enabled: "true"
      TenantPlacement__Services__commerce__DefaultConnectionName: CommerceDb
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: http://identityservice:5003
      Jwt__MetadataAddress: http://identityservice:5003/.well-known/openid-configuration
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Outbox__Enabled: "true"
    networks: [manufacturing, openship_observability]
    depends_on:
      identityservice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  contentservice:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ../src
      dockerfile: Services/ContentService/ContentService.Api/Dockerfile
    container_name: manufacturing-standalone-content
    ports:
      - "${MANUFACTURING_CONTENT_PORT:-5016}:5016"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5016
      Persistence__RunMigrationsOnStartup: "true"
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: http://identityservice:5003
      Jwt__MetadataAddress: http://identityservice:5003/.well-known/openid-configuration
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
    networks: [manufacturing, openship_observability]
    depends_on:
      identityservice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  manufacturingservice:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ../src
      dockerfile: Services/ManufacturingService/ManufacturingService.Api/Dockerfile
    container_name: manufacturing-standalone-api
    ports:
      - "${MANUFACTURING_API_PORT:-5050}:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5050
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}

      Persistence__RunMigrationsOnStartup: "true"
      TenantPlacement__Enabled: "false"
      TenantPlacement__Services__manufacturing__DefaultConnectionName: ManufacturingDb
      TenantPlacement__Services__commerce__DefaultConnectionName: CommerceDb
      TenantPlacement__Services__content__DefaultConnectionName: ContentDb

      # Configure these when an external Identity/OIDC authority is available.
      Jwt__Authority: ${MANUFACTURING_JWT_AUTHORITY:-http://identityservice:5003}
      Jwt__MetadataAddress: ${MANUFACTURING_JWT_METADATA_ADDRESS:-http://identityservice:5003/.well-known/openid-configuration}
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}

      Outbox__Enabled: "true"
      Manufacturing__Automation__Enabled: "true"
      Manufacturing__Automation__IntervalSeconds: "300"
      Manufacturing__Automation__BatchSize: "100"
      Manufacturing__SeedDemoData: ${MANUFACTURING_SEED_DEMO_DATA:-true}
      Consumers__AnalyticsEnabled: "true"
      Consumers__CommerceOrdersEnabled: "true"
    networks: [manufacturing, openship_observability]
    depends_on:
      identityservice: { condition: service_healthy }
    restart: unless-stopped

  api-gateway:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ..
      dockerfile: src/ApiGateway/Dockerfile
    container_name: manufacturing-standalone-gateway
    ports:
      - "${MANUFACTURING_GATEWAY_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "0"
      SERVICE_IDENTITY_URL: http://identityservice:5003
      SERVICE_IDENTITY_API_URL: http://identityservice:5003
      SERVICE_COMMERCE_URL: http://commerceservice:5015
      SERVICE_CONTENT_URL: http://contentservice:5016
      SERVICE_MANUFACTURING_URL: http://manufacturingservice:5050
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
      CORS__AllowedOrigins: "http://localhost:8083,http://localhost:4205,http://localhost:4300"
    networks: [manufacturing, openship_observability]
    depends_on:
      identityservice: { condition: service_healthy }
      commerceservice: { condition: service_healthy }
      contentservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  manufacturing-buyer-app:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ..
      dockerfile: manufacturing-buyer-app/Dockerfile
    container_name: manufacturing-standalone-buyer
    ports:
      - "${MANUFACTURING_BUYER_APP_PORT:-4205}:8080"
    networks: [manufacturing]
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  internal-operator-app:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ..
      dockerfile: internal-operator-app/Dockerfile
    container_name: manufacturing-standalone-operator
    ports:
      - "${MANUFACTURING_OPERATOR_APP_PORT:-4300}:8080"
    networks: [manufacturing]
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  admin-app:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.05"
    build:
      context: ..
      dockerfile: admin-app/Dockerfile
    container_name: manufacturing-standalone-admin
    ports:
      - "${MANUFACTURING_ADMIN_APP_PORT:-8083}:8080"
    networks: [manufacturing]
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  manufacturing:
    name: manufacturing-standalone
  openship_observability:
    external: true
    name: openship_observability


