name: micro

# OpenShip Compose source for the Micro project.
# Keep only application services here; PostgreSQL, Redis, RabbitMQ and identity
# key files are supplied by OpenShip service bindings and Vault-backed mounts.
# Database credentials, bootstrap passwords and PEM values are service-scoped
# OpenShip/Vault secrets; never put them in this Compose file or Shared env.
# Production telemetry is sent to the OpenShip-managed in-cluster collector.
# OpenShip reads service build, ports, environment, volumes, dependencies,
# restart policy and healthcheck from Compose. Replica counts and Kubernetes
# resource requests/limits are configured on the OpenShip service, not with
# Compose deploy.* fields.

services:
  openfga:
    build:
      context: ..
      dockerfile: docker/openfga/Dockerfile
    ports:
      - "8080"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "10"
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  identityservice:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/IdentityService.Api/Dockerfile
    ports:
      - "${MANUFACTURING_IDENTITY_PORT:-5001}:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5003
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      Persistence__RunMigrationsOnStartup: "false"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Jwt__AllowHttp: "false"
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      OpenIddict__Issuer: ${MANUFACTURING_OIDC_ISSUER:-https://identity-api.nacoms.com.vn/}
      OpenIddict__InternalJwksUri: http://identityservice:5003/.well-known/jwks
      OpenIddict__Signing__PrivateKeyPath: /etc/hishop/certs/jwt-private-key.pem
      OpenIddict__Encryption__PrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      OpenIddict__Encryption__KeyId: manufacturing-oidc-encryption-v1
      Identity__BootstrapAdmin__ResetPassword: ${MANUFACTURING_IDENTITY_RESET_PASSWORD:-false}
      Identity__SuperAdmin__SeedHqMembership: "true"
      Conglomerate__Enabled: "true"
      Conglomerate__Organization__Key: nacoms
      Conglomerate__Organization__DisplayName: Nacoms Group
      Conglomerate__SeedPilotMemberships: "false"
      Conglomerate__SeedPilotUsers: "false"
      Conglomerate__Tenants__0__Key: manufacturing
      Conglomerate__Tenants__0__DisplayName: Manufacturing
      Conglomerate__Tenants__1__Key: tech-vendor
      Conglomerate__Tenants__1__DisplayName: Technology Vendor
      Conglomerate__Tenants__2__Key: nacoms-group
      Conglomerate__Tenants__2__DisplayName: Nacoms Group
      Conglomerate__Tenants__3__Key: customer-acme
      Conglomerate__Tenants__3__DisplayName: Acme Healthcare
      Conglomerate__Tenants__4__Key: customer-factory-x
      Conglomerate__Tenants__4__DisplayName: Factory X Industrial
      Conglomerate__OidcClientTenantsJson: '{"manufacturing-app":"manufacturing","his-hope-operator-mobile":"manufacturing","tech-console":"tech-vendor","group-hq-admin":"nacoms-group","his-hope-admin":"nacoms-group","customer-acme-portal":"customer-acme","customer-acme-app":"customer-acme","customer-factory-x-portal":"customer-factory-x","customer-factory-x-app":"customer-factory-x"}'
      AUTHZ_PDP_MODE: ${AUTHZ_PDP_MODE:-canary}
      AUTHZ_OPENFGA_PERMISSION_RELATION: ${AUTHZ_OPENFGA_PERMISSION_RELATION:-}
      AUTHZ_OPENFGA_PERMISSION_SYNC_ENABLED: ${AUTHZ_OPENFGA_PERMISSION_SYNC_ENABLED:-false}
      Vault__Address: https://vault.openship-vault.svc.cluster.local:8200
      Vault__RequireVault: "true"
      Vault__EnableTransit: "true"
      Vault__AllowStaticToken: "false"
    volumes:
      - identity_keys:/etc/hishop/certs
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  commerceservice:
    build:
      context: ../src
      dockerfile: Services/CommerceService/CommerceService.Api/Dockerfile
    ports:
      - "${MANUFACTURING_COMMERCE_PORT:-5015}:5015"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5015
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      Persistence__RunMigrationsOnStartup: "false"
      TenantPlacement__Enabled: "true"
      TenantPlacement__Services__commerce__DefaultConnectionName: CommerceDb
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: https://identity-api.nacoms.com.vn/
      Jwt__MetadataAddress: https://identity-api.nacoms.com.vn/.well-known/openid-configuration
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RequireHttpsMetadata: "true"
      Jwt__AllowHttp: "false"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Outbox__Enabled: "true"
    volumes:
      - identity_keys:/etc/hishop/certs
    depends_on:
      identityservice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  contentservice:
    build:
      context: ../src
      dockerfile: Services/ContentService/ContentService.Api/Dockerfile
    ports:
      - "${MANUFACTURING_CONTENT_PORT:-5016}:5016"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5016
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      Persistence__RunMigrationsOnStartup: "false"
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: https://identity-api.nacoms.com.vn/
      Jwt__MetadataAddress: https://identity-api.nacoms.com.vn/.well-known/openid-configuration
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RequireHttpsMetadata: "true"
      Jwt__AllowHttp: "false"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
    volumes:
      - identity_keys:/etc/hishop/certs
    depends_on:
      identityservice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  manufacturingservice:
    build:
      context: ../src
      dockerfile: Services/ManufacturingService/ManufacturingService.Api/Dockerfile
    ports:
      - "${MANUFACTURING_API_PORT:-5050}:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5050
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}

      Persistence__RunMigrationsOnStartup: "false"
      TenantPlacement__Enabled: "false"
      TenantPlacement__Services__manufacturing__DefaultConnectionName: ManufacturingDb
      TenantPlacement__Services__commerce__DefaultConnectionName: CommerceDb
      TenantPlacement__Services__content__DefaultConnectionName: ContentDb

      # Production Identity metadata is served through the HTTPS Tunnel hostname.
      Jwt__Authority: ${MANUFACTURING_JWT_AUTHORITY:-https://identity-api.nacoms.com.vn/}
      Jwt__MetadataAddress: ${MANUFACTURING_JWT_METADATA_ADDRESS:-https://identity-api.nacoms.com.vn/.well-known/openid-configuration}
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RequireHttpsMetadata: "true"
      Jwt__AllowHttp: "false"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-https://identity-api.nacoms.com.vn/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}

      Outbox__Enabled: "true"
      Manufacturing__Automation__Enabled: "true"
      Manufacturing__Automation__IntervalSeconds: "300"
      Manufacturing__Automation__BatchSize: "100"
      Manufacturing__SeedDemoData: ${MANUFACTURING_SEED_DEMO_DATA:-false}
      Consumers__AnalyticsEnabled: "true"
      Consumers__CommerceOrdersEnabled: "true"
    volumes:
      - identity_keys:/etc/hishop/certs
    depends_on:
      identityservice: { condition: service_healthy }
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "${MANUFACTURING_GATEWAY_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "0"
      SERVICE_IDENTITY_URL: http://identityservice:5003
      SERVICE_IDENTITY_API_URL: http://identityservice:5003
      SERVICE_COMMERCE_URL: http://commerceservice:5015
      SERVICE_CONTENT_URL: http://contentservice:5016
      SERVICE_MANUFACTURING_URL: http://manufacturingservice:5050
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      OpenTelemetry__OtlpEndpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-http://openship-otel-collector.openship-tracing.svc.cluster.local:4317}
      CORS__AllowedOrigins: "http://localhost:8083,http://localhost:4205,http://localhost:4300"
    depends_on:
      identityservice: { condition: service_healthy }
      commerceservice: { condition: service_healthy }
      contentservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  manufacturing-buyer-app:
    build:
      context: ..
      dockerfile: manufacturing-buyer-app/Dockerfile
    ports:
      - "${MANUFACTURING_BUYER_APP_PORT:-4205}:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  internal-operator-app:
    build:
      context: ..
      dockerfile: internal-operator-app/Dockerfile
    ports:
      - "${MANUFACTURING_OPERATOR_APP_PORT:-4300}:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
      manufacturingservice: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  admin-app:
    build:
      context: ..
      dockerfile: admin-app/Dockerfile
    ports:
      - "${MANUFACTURING_ADMIN_APP_PORT:-8083}:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
      identityservice: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  identity_keys:
    name: micro-identity-keys
