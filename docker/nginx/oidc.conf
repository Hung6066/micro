server {
    listen 443 ssl;
    server_name oidc.his-hope.local;
    ssl_certificate /run/secrets/oidc_cert.pem;
    ssl_certificate_key /run/secrets/oidc_key.pem;
    ssl_protocols TLSv1.3;
    location / {
        proxy_pass http://spire-oidc:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
