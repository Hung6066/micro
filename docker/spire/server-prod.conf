server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/sockets/server.sock"
    trust_domain = "his-hope.local"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "15m"
    jwt_key_type = "ec-p256"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "dbname=spiredb user=spire_server password=$SPIRE_DB_PASSWORD host=postgres port=5432 sslmode=verify-full sslrootcert=/run/secrets/postgres_ca.pem"
        }
    }
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/run/secrets/spire_node_ca.pem"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/keys/keys.json"
        }
    }
}
