global:
  resolve_timeout: 5m

route:
  group_by: ['severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Local Compose exposes alerts through the authenticated dashboard GET API.
    # Auto-remediation is wired only by the production Kubernetes receiver to
    # the authenticated Remediation Operator endpoint.
