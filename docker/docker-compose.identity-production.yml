name: his-hope-identity-production

services:
  postgres:
    build: { context: ., dockerfile: postgres-production.Dockerfile }
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_MULTIPLE_DATABASES: spiredb,identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - ./pg_hba-pitr.conf:/etc/postgresql/pg_hba-pitr.conf:ro
      - ./postgres-workload-identity-init.sh:/run/postgres/workload-identity-init.sh:ro
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_ca_file=/var/lib/postgresql/tls/postgres_ca.pem", "-c", "ssl_cert_file=/var/lib/postgresql/tls/postgres_cert.pem", "-c", "ssl_key_file=/var/lib/postgresql/tls/postgres_key.pem", "-c", "hba_file=/etc/postgresql/pg_hba-pitr.conf"]
    secrets:
      - postgres_admin_password
      - spire_database_password
      - postgres_ca.pem
      - postgres_cert.pem
      - postgres_key.pem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    restart: unless-stopped

  postgres-identity-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/run/postgres/workload-identity-init.sh"]
    environment:
      PGPASSWORD: ""
    volumes:
      - ./postgres-workload-identity-init.sh:/run/postgres/workload-identity-init.sh:ro
    secrets:
      - postgres_admin_password
      - spire_database_password
    depends_on:
      postgres: { condition: service_healthy }

  postgres-migrator-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/run/postgres/postgres-migrator-init.sh"]
    volumes:
      - ./postgres-migrator-init.sh:/run/postgres/postgres-migrator-init.sh:ro
    secrets: [postgres_admin_password, postgres_migrator_password]
    depends_on:
      postgres: { condition: service_healthy }

  vault-1:
    build: { context: ./vault, dockerfile: production.Dockerfile }
    hostname: vault-1
    user: "0:0"
    entrypoint: ["/bin/sh", "/run/vault/production-entrypoint.sh"]
    environment:
      VAULT_RAFT_NODE_ID: vault-1
      VAULT_SEAL_TYPE: ${VAULT_SEAL_TYPE:?set transit or azurekeyvault}
      VAULT_TRANSIT_SEAL_ADDR: ${VAULT_TRANSIT_SEAL_ADDR:-}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-}
      VAULT_TRANSIT_MOUNT_PATH: ${VAULT_TRANSIT_MOUNT_PATH:-transit/}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_ENVIRONMENT: ${AZURE_ENVIRONMENT:-AZUREPUBLICCLOUD}
      VAULT_AZUREKEYVAULT_VAULT_NAME: ${VAULT_AZUREKEYVAULT_VAULT_NAME:-}
      VAULT_AZUREKEYVAULT_KEY_NAME: ${VAULT_AZUREKEYVAULT_KEY_NAME:-}
    volumes:
      - vault_1_data:/vault/data
      - ./vault/vault-raft.hcl:/run/vault/vault-raft.hcl:ro
      - ./vault/production-entrypoint.sh:/run/vault/production-entrypoint.sh:ro
    secrets: [vault_ca.pem, vault_cert.pem, vault_key.pem]
    ports: ["8200:8200"]
    restart: unless-stopped

  vault-2:
    extends: { service: vault-1 }
    hostname: vault-2
    environment:
      VAULT_RAFT_NODE_ID: vault-2
    volumes:
      - vault_2_data:/vault/data
      - ./vault/vault-raft.hcl:/run/vault/vault-raft.hcl:ro
      - ./vault/production-entrypoint.sh:/run/vault/production-entrypoint.sh:ro

  vault-3:
    extends: { service: vault-1 }
    hostname: vault-3
    environment:
      VAULT_RAFT_NODE_ID: vault-3
    volumes:
      - vault_3_data:/vault/data
      - ./vault/vault-raft.hcl:/run/vault/vault-raft.hcl:ro
      - ./vault/production-entrypoint.sh:/run/vault/production-entrypoint.sh:ro

  spire-server-1:
    build: { context: ./spire, dockerfile: server.Dockerfile }
    hostname: spire-server-1
    volumes:
      - ./spire/server-prod.conf:/run/spire/config/server-prod.conf:ro
      - spire_1_data:/run/spire/data
      - spire_server_keys:/run/spire/keys
      - spire_1_sockets:/run/spire/sockets
    secrets: [spire_database_password, postgres_ca.pem, spire_node_ca.pem]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/spire/sockets/server.sock"]
      interval: 3s
      timeout: 2s
      retries: 20
    depends_on:
      postgres-identity-init: { condition: service_completed_successfully }
    restart: unless-stopped

  spire-server-2:
    extends: { service: spire-server-1 }
    hostname: spire-server-2
    volumes:
      - ./spire/server-prod.conf:/run/spire/config/server-prod.conf:ro
      - spire_2_data:/run/spire/data
      - spire_server_keys:/run/spire/keys
      - spire_2_sockets:/run/spire/sockets
    depends_on:
      spire-server-1: { condition: service_healthy }

  spire-agent:
    build: { context: ./spire, dockerfile: agent.Dockerfile }
    command: ["/opt/spire/bin/spire-agent", "run", "-config", "/run/spire/config/agent-prod.conf"]
    volumes:
      - ./spire/agent-prod.conf:/run/spire/config/agent-prod.conf:ro
      - spire_agent_data:/run/spire/data
      - spire_agent_sockets:/run/spire/sockets
    secrets: [spire_agent_cert.pem, spire_agent_key.pem, spire_server_bundle.pem]
    depends_on:
      spire-server-1: { condition: service_healthy }
    restart: unless-stopped

  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.12.4
    command: ["-config", "/run/spire/config/oidc-provider-prod.conf"]
    volumes:
      - ./spire/oidc-provider-prod.conf:/run/spire/config/oidc-provider-prod.conf:ro
      - spire_agent_sockets:/run/spire/sockets:ro
    depends_on: { spire-agent: { condition: service_started } }
    restart: unless-stopped

  oidc-proxy:
    image: nginx:1.27-alpine
    volumes: ["./nginx/oidc.conf:/etc/nginx/conf.d/default.conf:ro"]
    secrets: [oidc_cert.pem, oidc_key.pem]
    ports: ["8443:443"]
    networks:
      default:
        aliases: [oidc.his-hope.local]
    depends_on: { spire-oidc: { condition: service_started } }

  vault-production-bootstrap:
    build: { context: ./vault, dockerfile: production.Dockerfile }
    entrypoint: ["/bin/sh", "/run/vault/production-bootstrap.sh"]
    environment:
      VAULT_ADDR: https://vault-1:8200
      VAULT_CACERT: /run/secrets/vault_ca.pem
      SPIRE_OIDC_DISCOVERY_URL: https://oidc.his-hope.local
      VAULT_DB_ADMIN_USER: ${VAULT_DB_ADMIN_USER:?set dynamic database admin user}
    volumes: ["./vault/production-bootstrap.sh:/run/vault/production-bootstrap.sh:ro"]
    secrets: [vault_bootstrap_token, spire_oidc_ca.pem, vault_db_admin_password, postgres_ca.pem, vault_ca.pem]
    depends_on:
      vault-1: { condition: service_started }
      postgres-identity-init: { condition: service_completed_successfully }
      oidc-proxy: { condition: service_started }
    profiles: [provision]

  vault-snapshot:
    build: { context: ./vault, dockerfile: production.Dockerfile }
    entrypoint: ["/bin/sh", "/run/vault/raft-snapshot.sh"]
    environment:
      VAULT_ADDR: https://vault-1:8200
      VAULT_CACERT: /run/secrets/vault_ca.pem
    volumes:
      - vault_backups:/vault/backups
      - ./vault/raft-snapshot.sh:/run/vault/raft-snapshot.sh:ro
    secrets: [vault_snapshot_token, vault_ca.pem]
    profiles: [backup]

  vault-rotation-probe:
    build: { context: ./vault, dockerfile: rotation-probe.Dockerfile }
    entrypoint: ["/bin/sh", "/run/vault/rotation-revoke-probe.sh"]
    environment:
      VAULT_ADDR: https://vault-1:8200
      VAULT_CACERT: /run/secrets/vault_ca.pem
    volumes: ["./vault/rotation-revoke-probe.sh:/run/vault/rotation-revoke-probe.sh:ro"]
    secrets: [vault_test_token, vault_ca.pem, postgres_ca.pem]
    depends_on:
      vault-1: { condition: service_started }
      postgres: { condition: service_healthy }
    profiles: [validate]

secrets:
  postgres_admin_password: { file: "${POSTGRES_ADMIN_PASSWORD_FILE:?set secret file}" }
  spire_database_password: { file: "${SPIRE_DATABASE_PASSWORD_FILE:?set secret file}" }
  vault_db_admin_password: { file: "${VAULT_DB_ADMIN_PASSWORD_FILE:?set secret file}" }
  vault_bootstrap_token: { file: "${VAULT_BOOTSTRAP_TOKEN_FILE:?set one-shot token file}" }
  vault_snapshot_token: { file: "${VAULT_SNAPSHOT_TOKEN_FILE:?set snapshot token file}" }
  vault_test_token: { file: "${VAULT_TEST_TOKEN_FILE:?set rotation test token file}" }
  postgres_migrator_password: { file: "${POSTGRES_MIGRATOR_PASSWORD_FILE:?set migration password file}" }
  postgres_ca.pem: { file: "${POSTGRES_CA_FILE:?set CA file}" }
  postgres_cert.pem: { file: "${POSTGRES_CERT_FILE:?set certificate file}" }
  postgres_key.pem: { file: "${POSTGRES_KEY_FILE:?set key file}" }
  spire_node_ca.pem: { file: "${SPIRE_NODE_CA_FILE:?set CA file}" }
  spire_server_bundle.pem: { file: "${SPIRE_SERVER_BUNDLE_FILE:?set bundle file}" }
  spire_agent_cert.pem: { file: "${SPIRE_AGENT_CERT_FILE:?set certificate file}" }
  spire_agent_key.pem: { file: "${SPIRE_AGENT_KEY_FILE:?set key file}" }
  spire_oidc_ca.pem: { file: "${SPIRE_OIDC_CA_FILE:?set CA file}" }
  vault_ca.pem: { file: "${VAULT_CA_FILE:?set CA file}" }
  vault_cert.pem: { file: "${VAULT_CERT_FILE:?set certificate file}" }
  vault_key.pem: { file: "${VAULT_KEY_FILE:?set key file}" }
  oidc_cert.pem: { file: "${OIDC_CERT_FILE:?set certificate file}" }
  oidc_key.pem: { file: "${OIDC_KEY_FILE:?set key file}" }

volumes:
  identity_postgres_data:
  vault_1_data:
  vault_2_data:
  vault_3_data:
  vault_backups:
  spire_1_data:
  spire_2_data:
  spire_server_keys:
  spire_1_sockets:
  spire_2_sockets:
  spire_agent_data:
  spire_agent_sockets:
