name: manufacturing

# Standalone Manufacturing backend stack.
# This file intentionally does not include Patient, Appointment, Clinical,
# Lab, Billing, Pharmacy, API Gateway, or frontend apps.
# Identity/OIDC, Commerce and Content are included because they are shared
# dependencies of the Manufacturing business flow. Unrelated clinical and
# hospital services are intentionally absent.

services:
  manufacturing-postgres:
    image: pgvector/pgvector:pg16
    container_name: manufacturing-standalone-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${MANUFACTURING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MANUFACTURING_POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: identitydb,manufacturingdb,commercedb,contentdb
    ports:
      - "${MANUFACTURING_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks: [manufacturing]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d manufacturingdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  manufacturing-redis:
    image: redis:7-alpine
    container_name: manufacturing-standalone-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MANUFACTURING_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [manufacturing]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  manufacturing-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: manufacturing-standalone-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MANUFACTURING_RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${MANUFACTURING_RABBITMQ_PASSWORD:-admin}
    ports:
      - "${MANUFACTURING_RABBITMQ_PORT:-5672}:5672"
      - "${MANUFACTURING_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [manufacturing]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  identityservice:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/IdentityService.Api/Dockerfile
    container_name: manufacturing-standalone-identity
    ports:
      - "${MANUFACTURING_IDENTITY_PORT:-5001}:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__IdentityDb: "Host=manufacturing-postgres;Database=identitydb;Username=${MANUFACTURING_POSTGRES_USER:-postgres};Password=${MANUFACTURING_POSTGRES_PASSWORD:-postgres}"
      Persistence__RunMigrationsOnStartup: "true"
      ConnectionStrings__Redis: redis://manufacturing-redis:6379
      Redis__ConnectionString: manufacturing-redis
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Jwt__AllowHttp: "true"
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      OpenIddict__Issuer: ${MANUFACTURING_OIDC_ISSUER:-http://localhost:5001}
      OpenIddict__InternalJwksUri: http://identityservice:5003/.well-known/jwks
      OpenIddict__Signing__PrivateKeyPath: /etc/hishop/certs/jwt-private-key.pem
      OpenIddict__Encryption__PrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      OpenIddict__Encryption__KeyId: manufacturing-oidc-encryption-v1
      Identity__BootstrapAdmin__Password: ${MANUFACTURING_IDENTITY_BOOTSTRAP_PASSWORD:-}
      Identity__BootstrapAdmin__ResetPassword: ${MANUFACTURING_IDENTITY_RESET_PASSWORD:-false}
      Conglomerate__Enabled: "true"
      Conglomerate__SeedPilotMemberships: "true"
      Conglomerate__SeedPilotUsers: "true"
      Conglomerate__Tenants__0__Key: manufacturing
      Conglomerate__Tenants__0__DisplayName: Manufacturing
      AUTHZ_PDP_MODE: disabled
      Vault__RequireVault: "false"
      Vault__EnableTransit: "false"
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
      - ../config/conglomerate:/app/config/conglomerate:ro
    networks: [manufacturing]
    depends_on:
      manufacturing-postgres: { condition: service_healthy }
      manufacturing-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  commerceservice:
    build:
      context: ../src
      dockerfile: Services/CommerceService/CommerceService.Api/Dockerfile
    container_name: manufacturing-standalone-commerce
    ports:
      - "${MANUFACTURING_COMMERCE_PORT:-5015}:5015"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5015
      ConnectionStrings__CommerceDb: "Host=manufacturing-postgres;Database=commercedb;Username=${MANUFACTURING_POSTGRES_USER:-postgres};Password=${MANUFACTURING_POSTGRES_PASSWORD:-postgres}"
      REDIS_URL: redis://manufacturing-redis:6379
      ConnectionStrings__Redis: redis://manufacturing-redis:6379
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: http://identityservice:5003
      Jwt__MetadataAddress: http://identityservice:5003/.well-known/openid-configuration
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
      Outbox__Enabled: "true"
      EventBus__HostName: manufacturing-rabbitmq
      EventBus__Port: "5672"
      EventBus__UserName: ${MANUFACTURING_RABBITMQ_USER:-admin}
      EventBus__Password: ${MANUFACTURING_RABBITMQ_PASSWORD:-admin}
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    networks: [manufacturing]
    depends_on:
      identityservice: { condition: service_healthy }
      manufacturing-postgres: { condition: service_healthy }
      manufacturing-redis: { condition: service_healthy }
      manufacturing-rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  contentservice:
    build:
      context: ../src
      dockerfile: Services/ContentService/ContentService.Api/Dockerfile
    container_name: manufacturing-standalone-content
    ports:
      - "${MANUFACTURING_CONTENT_PORT:-5016}:5016"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5016
      ConnectionStrings__ContentDb: "Host=manufacturing-postgres;Database=contentdb;Username=${MANUFACTURING_POSTGRES_USER:-postgres};Password=${MANUFACTURING_POSTGRES_PASSWORD:-postgres}"
      REDIS_URL: redis://manufacturing-redis:6379
      ConnectionStrings__Redis: redis://manufacturing-redis:6379
      SERVICE_IDENTITY_URL: http://identityservice:5003
      Jwt__Authority: http://identityservice:5003
      Jwt__MetadataAddress: http://identityservice:5003/.well-known/openid-configuration
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    networks: [manufacturing]
    depends_on:
      identityservice: { condition: service_healthy }
      manufacturing-postgres: { condition: service_healthy }
      manufacturing-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  manufacturingservice:
    build:
      context: ../src
      dockerfile: Services/ManufacturingService/ManufacturingService.Api/Dockerfile
    container_name: manufacturing-standalone-api
    ports:
      - "${MANUFACTURING_API_PORT:-5050}:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5050

      ConnectionStrings__ManufacturingDb: "Host=manufacturing-postgres;Database=manufacturingdb;Username=${MANUFACTURING_POSTGRES_USER:-manufacturing};Password=${MANUFACTURING_POSTGRES_PASSWORD:-manufacturing-local-only}"
      ConnectionStrings__Redis: redis://manufacturing-redis:6379
      TenantPlacement__Enabled: "false"
      TenantPlacement__Services__manufacturing__DefaultConnectionName: ManufacturingDb

      # Configure these when an external Identity/OIDC authority is available.
      Jwt__Authority: ${MANUFACTURING_JWT_AUTHORITY:-http://identityservice:5003}
      Jwt__MetadataAddress: ${MANUFACTURING_JWT_METADATA_ADDRESS:-http://identityservice:5003/.well-known/openid-configuration}
      Jwt__RequireHttpsMetadata: "false"
      Jwt__AllowHttp: "true"
      Jwt__Issuer: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__0: ${MANUFACTURING_JWT_ISSUER:-http://localhost:5001/}
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: ${MANUFACTURING_JWT_AUDIENCE:-manufacturing-api}

      Outbox__Enabled: "true"
      Manufacturing__Automation__Enabled: "true"
      Manufacturing__Automation__IntervalSeconds: "300"
      Manufacturing__Automation__BatchSize: "100"
      Manufacturing__SeedDemoData: ${MANUFACTURING_SEED_DEMO_DATA:-true}
      EventBus__HostName: manufacturing-rabbitmq
      EventBus__Port: "5672"
      EventBus__UserName: ${MANUFACTURING_RABBITMQ_USER:-admin}
      EventBus__Password: ${MANUFACTURING_RABBITMQ_PASSWORD:-admin}
      Consumers__AnalyticsEnabled: "true"
      Consumers__CommerceOrdersEnabled: "true"
    networks: [manufacturing]
    depends_on:
      identityservice: { condition: service_healthy }
      manufacturing-postgres: { condition: service_healthy }
      manufacturing-redis: { condition: service_healthy }
      manufacturing-rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: manufacturing-standalone-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${MANUFACTURING_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [manufacturing]
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kibana:
    image: kibana:8.12.0
    container_name: manufacturing-standalone-kibana
    ports:
      - "${MANUFACTURING_KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks: [manufacturing]
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: manufacturing-standalone-jaeger
    user: "0:0"
    ports:
      - "${MANUFACTURING_JAEGER_PORT:-16686}:16686"
      - "${MANUFACTURING_JAEGER_OTLP_GRPC_PORT:-24317}:4317"
      - "${MANUFACTURING_JAEGER_OTLP_HTTP_PORT:-24318}:4318"
      - "${MANUFACTURING_JAEGER_AGENT_PORT:-6831}:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_DIRECTORY_VALUE: /badger/data
    volumes:
      - jaeger_data:/badger
    networks: [manufacturing]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: manufacturing-standalone-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${MANUFACTURING_OTEL_GRPC_PORT:-4317}:4317"
      - "${MANUFACTURING_OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [manufacturing]
    depends_on:
      jaeger: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: manufacturing-standalone-prometheus
    ports:
      - "${MANUFACTURING_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.manufacturing.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks: [manufacturing]
    depends_on:
      manufacturing-postgres: { condition: service_healthy }
      manufacturing-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: manufacturing-standalone-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "${MANUFACTURING_LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [manufacturing]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: manufacturing-standalone-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${MANUFACTURING_POSTGRES_USER:-postgres}:${MANUFACTURING_POSTGRES_PASSWORD:-postgres}@manufacturing-postgres:5432/postgres?sslmode=disable
    networks: [manufacturing]
    depends_on:
      manufacturing-postgres: { condition: service_healthy }
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: manufacturing-standalone-redis-exporter
    environment:
      REDIS_ADDR: redis://manufacturing-redis:6379
    networks: [manufacturing]
    depends_on:
      manufacturing-redis: { condition: service_healthy }
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: manufacturing-standalone-alertmanager
    ports:
      - "${MANUFACTURING_ALERTMANAGER_PORT:-9093}:9093"
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager.manufacturing.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [manufacturing]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: manufacturing-standalone-grafana
    ports:
      - "${MANUFACTURING_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [manufacturing]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  manufacturing:
    name: manufacturing-standalone

volumes:
  postgres_data:
    external: true
    name: docker_postgres_data
  redis_data:
    external: true
    name: docker_redis_data
  rabbitmq_data:
    external: true
    name: docker_rabbitmq_data
  es_data:
    external: true
    name: docker_es_data
  jaeger_data:
    external: true
    name: docker_jaeger_data
  prometheus_data:
    external: true
    name: docker_prometheus_data
  loki_data:
    external: true
    name: docker_loki_data
  grafana_data:
    external: true
    name: docker_grafana_data
