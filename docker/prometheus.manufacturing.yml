global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: identityservice
    metrics_path: /metrics
    static_configs:
      - targets: ['identityservice:5003']
  - job_name: manufacturingservice
    metrics_path: /metrics
    static_configs:
      - targets: ['manufacturingservice:5050']
  - job_name: commerceservice
    metrics_path: /metrics
    static_configs:
      - targets: ['commerceservice:5015']
  - job_name: contentservice
    metrics_path: /metrics
    static_configs:
      - targets: ['contentservice:5016']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: rabbitmq
    metrics_path: /api/metrics
    static_configs:
      - targets: ['manufacturing-rabbitmq:15672']
