global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'apigateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['apigateway:5000']
        labels: { service: 'api-gateway' }

  - job_name: 'patientservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['patientservice:5002']
        labels: { service: 'patient-service' }

  - job_name: 'appointmentservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['appointmentservice:5003']
        labels: { service: 'appointment-service' }

  - job_name: 'clinicalservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clinicalservice:5004']
        labels: { service: 'clinical-service' }

  - job_name: 'identityservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['identityservice:5003']
        labels: { service: 'identity-service' }

  - job_name: 'database-continuity-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['database-continuity-service:5800']
        labels: { service: 'database-continuity-service' }

  - job_name: 'labservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['labservice:5010']
        labels: { service: 'lab-service' }

  - job_name: 'billingservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['billingservice:5020']
        labels: { service: 'billing-service' }

  - job_name: 'pharmacyservice'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pharmacyservice:5030']
        labels: { service: 'pharmacy-service' }

  - job_name: 'consul'
    metrics_path: '/v1/agent/metrics'
    static_configs:
      - targets: ['consul:8500']

  - job_name: 'rabbitmq'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['rabbitmq:15672']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
