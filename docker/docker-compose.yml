services:
  postgres-wal-archive-init:
    image: alpine:3.20
    container_name: his-hope-postgres-wal-archive-init
    command: ["/bin/sh", "-c", "mkdir -p /var/lib/postgresql/wal-archive && chown -R 999:999 /var/lib/postgresql/wal-archive"]
    volumes:
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: his-hope-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb,harnessdb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=/bin/sh /usr/local/bin/archive-wal.sh %p %f
      - -c
      - hba_file=/etc/postgresql/pg_hba-pitr.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - ./archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - ./pg_hba-pitr.conf:/etc/postgresql/pg_hba-pitr.conf:ro
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
    ports:
      - "5433:5432"
    healthcheck:
      # Check the database used by Identity, not only the postmaster socket.
      # This prevents dependent services from starting during PostgreSQL recovery.
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g }
        reservations: { memory: 256m }

  postgres-replica:
    image: postgres:16-alpine
    container_name: his-hope-postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    depends_on:
      - postgres
    profiles: ["replica"]

  postgres-restore-drill:
    image: postgres:16
    container_name: his-hope-postgres-restore-drill
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb
    volumes:
      - postgres_restore_drill_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: his-hope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: his-hope-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: his-hope-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:8.12.0
    container_name: his-hope-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }

  consul:
    image: hashicorp/consul:1.18
    container_name: his-hope-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    volumes:
      - consul_data:/consul/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: his-hope-jaeger
    user: "0:0"
    ports:
      - "16686:16686"
      - "24317:4317"
      - "24318:4318"
      - "6831:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: "/badger/key"
      BADGER_DIRECTORY_VALUE: "/badger/data"
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: his-hope-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger: { condition: service_healthy }
    restart: unless-stopped

  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: his-hope-glitchtip-postgres
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip-dev-change-me}
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    container_name: his-hope-glitchtip-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - glitchtip_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  glitchtip:
    image: ${GLITCHTIP_IMAGE:-glitchtip/glitchtip:6}
    container_name: his-hope-glitchtip
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip-dev-change-me}@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret-key}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@his-hope.local}
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_USER_REGISTRATION:-false}
      ENABLE_ORGANIZATION_CREATION: ${GLITCHTIP_ENABLE_ORGANIZATION_CREATION:-false}
      SERVER_ROLE: all_in_one
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
      glitchtip-valkey: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: his-hope-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres-wal-archive-init: { condition: service_completed_successfully }

  loki:
    image: grafana/loki:3.1.0
    container_name: his-hope-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Persistent local Vault Transit instance. Replace the bootstrap token and
  # file storage with Raft/auto-unseal/workload identity outside Compose.
  vault:
    image: hashicorp/vault:1.17
    container_name: his-hope-vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_ADDR: http://127.0.0.1:8200
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status -format=json >/dev/null 2>&1; code=$$?; test $$code -le 2"]
      interval: 10s
      timeout: 5s
      retries: 12

  vault-init:
    image: hashicorp/vault:1.17
    container_name: his-hope-vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-his-hope-backup-encryption}
    volumes:
      - vault_data:/vault/file
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        until wget -qO- 'http://vault:8200/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200' >/dev/null 2>&1; do sleep 2; done;
        if [ ! -f /vault/file/bootstrap.json ]; then
          VAULT_ADDR=$$VAULT_ADDR vault operator init -key-shares=1 -key-threshold=1 -format=json > /vault/file/bootstrap.json;
          chmod 600 /vault/file/bootstrap.json;
        fi;
        UNSEAL_KEY=$$(sed -n '/"unseal_keys_b64"/{n;s/.*"\([^\"]*\)".*/\1/p;}' /vault/file/bootstrap.json);
        INIT_ROOT=$$(sed -n 's/.*"root_token"[[:space:]]*:[[:space:]]*"\([^\"]*\)".*/\1/p' /vault/file/bootstrap.json);
        VAULT_ADDR=$$VAULT_ADDR vault operator unseal "$$UNSEAL_KEY" >/dev/null 2>&1 || true;
        VAULT_ADDR=$$VAULT_ADDR VAULT_TOKEN="$$INIT_ROOT" vault token create -id="$${VAULT_DEV_ROOT_TOKEN_ID:-root}" -policy=root -orphan -ttl=0s >/dev/null 2>&1 || true;
        VAULT_ADDR=$$VAULT_ADDR VAULT_TOKEN="$${VAULT_DEV_ROOT_TOKEN_ID:-root}" vault secrets enable -path=transit transit 2>/dev/null || true;
        VAULT_ADDR=$$VAULT_ADDR VAULT_TOKEN="$${VAULT_DEV_ROOT_TOKEN_ID:-root}" vault write -f transit/keys/$${VAULT_TRANSIT_KEY_NAME:-his-hope-backup-encryption} 2>/dev/null || true;
        VAULT_ADDR=$$VAULT_ADDR VAULT_TOKEN="$${VAULT_DEV_ROOT_TOKEN_ID:-root}" vault read transit/keys/$${VAULT_TRANSIT_KEY_NAME:-his-hope-backup-encryption}
    depends_on:
      vault: { condition: service_healthy }
    restart: "no"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: his-hope-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: his-hope-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: his-hope-alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: his-hope-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Application Services
  identityservice:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/IdentityService.Api/Dockerfile
    container_name: his-hope-identity
    networks:
      default:
        aliases:
          - identity
    ports:
      # Identity's Kestrel web endpoint is 5003; 5007 is the internal gRPC
      # endpoint. Keep host port 5001 for the public local OIDC origin.
      - "5001:5003"
      - "5012:5012"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5003
      # Self-contained development default; production must provide the full
      # connection string through the runtime contract/secret provider.
      ConnectionStrings__IdentityDb: ${DATABASE_IDENTITY_URL:-Host=postgres;Database=identitydb;Username=postgres;Password=postgres}
      Persistence__RunMigrationsOnStartup: "true"
      # Keep the local service name as a safe default when no host .env file is
      # loaded; an empty connection string causes the Identity process to crash
      # before health checks can run.
      ConnectionStrings__Redis: ${REDIS_URL:-redis://redis:6379}
      # Use the public OIDC issuer for both OIDC and service-issued JWTs.
      # This keeps the fallback JwtBearer handler aligned with OpenIddict validation.
      Jwt__Issuer: http://localhost:5000/
      # Keep the internal hostname as an explicit legacy issuer during migration.
      Jwt__ValidIssuers__0: http://localhost:5000/
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: http://localhost:5000/
      Jwt__Expiry: "08:00:00"
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__AllowHttp: "true"
      Redis__ConnectionString: redis
      Vault__Address: ${VAULT_ADDR:-}
      Vault__Token: ${VAULT_TOKEN:-}
      Vault__AllowStaticToken: ${VAULT_ALLOW_STATIC_TOKEN:-true}
      Vault__RequireVault: ${VAULT_REQUIRE:-false}
      Vault__EnableTransit: ${VAULT_ENABLE_TRANSIT:-false}
      # Development-only fallback for seeded M2M clients when Vault is not
      # configured. Identity derives the secret from this seed and never uses
      # it outside ASPNETCORE_ENVIRONMENT=Development.
      Vault__DevelopmentSecretSeed: ${IDENTITY_DEV_CLIENT_SECRET_SEED:-his-hope-local-only-m2m-seed}
      # Firebase is optional in local compose. Do not bind-mount a missing host
      # file: Docker creates it as a directory and the Identity container then
      # fails before startup. Production can provide the JSON through a secret
      # or set PushProviders__FirebaseCredentialsFile explicitly.
      PushProviders__FirebaseCredentialsFile: ${FIREBASE_CREDENTIALS_FILE:-}
      PushProviders__FirebaseCredentialsJson: ${FIREBASE_ACCOUNT_JSON:-}
      PushProviders__ApnsEndpoint: ${APNS_ENDPOINT:-https://api.push.apple.com}
      OpenIddict__Signing__PrivateKeyPath: ${OPENIDDICT_SIGNING_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-private-key.pem}
      # Nested legacy JWTs used by session exchange must remain JWE encrypted.
      Jwt__RsaEncryptionPrivateKeyPath: ${JWT_RSA_ENCRYPTION_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-encryption-private-key.pem}
      # OIDC access-token encryption must use the same persistent key as every
      # downstream JWT validator. Do not fall back to an ephemeral development key.
      OpenIddict__Encryption__PrivateKeyPath: ${JWT_RSA_ENCRYPTION_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-encryption-private-key.pem}
      OpenIddict__Encryption__KeyId: oidc-encryption-v1
      Otlp__Endpoint: ${OBSERVABILITY_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # ─── OpenIddict OIDC Configuration ───
      OpenIddict__Issuer: ${OIDC_ISSUER:-http://localhost:5000}
      OpenIddict__InternalJwksUri: ${SERVICE_IDENTITY_URL:-http://identityservice:5003}/.well-known/jwks
      OpenIddict__AccessTokenLifetime: ${OIDC_ACCESS_TOKEN_LIFETIME:-01:00:00}
      OpenIddict__RefreshTokenLifetime: ${OIDC_REFRESH_TOKEN_LIFETIME:-7.00:00:00}
      OpenIddict__AuthorizationCodeLifetime: ${OIDC_CODE_LIFETIME:-00:01:00}
      # WebAuthn origins used by the local identity login page and admin app.
      # Production deployments should override these with the public HTTPS origins.
      Passkeys__RpId: ${PASSKEYS_RP_ID:-}
      Passkeys__Origins__0: ${PASSKEYS_ORIGIN_0:-}
      Passkeys__Origins__1: ${PASSKEYS_ORIGIN_1:-}
      Passkeys__Origins__2: ${PASSKEYS_ORIGIN_2:-}
      Passkeys__Origins__3: ${PASSKEYS_ORIGIN_3:-}
      Passkeys__Origins__4: ${PASSKEYS_ORIGIN_4:-}
      Mobile__AppPolicy__MinimumVersion: 1.0.0
      Mobile__AppPolicy__LatestVersion: 1.0.0
      Mobile__AppPolicy__ForceUpgrade: "false"
      Mobile__AppPolicy__Maintenance: "false"
      AUTHZ_PDP_MODE: ${AUTHZ_PDP_MODE:-disabled}
      AUTHZ_OPENFGA_URL: ${AUTHZ_OPENFGA_URL:-}
      AUTHZ_OPENFGA_STORE_ID: ${AUTHZ_OPENFGA_STORE_ID:-}
      AUTHZ_OPENFGA_MODEL_ID: ${AUTHZ_OPENFGA_MODEL_ID:-}
      AUTHZ_OPENFGA_TOKEN: ${AUTHZ_OPENFGA_TOKEN:-}
      DEVICE_POSTURE_MODE: ${DEVICE_POSTURE_MODE:-observe}
      DEVICE_POSTURE_PROVIDERS: ${DEVICE_POSTURE_PROVIDERS:-chrome-enterprise,advanced-compliance,windows-local-login,play-integrity,app-attest}
      DEVICE_POSTURE_TTL_SECONDS: ${DEVICE_POSTURE_TTL_SECONDS:-900}
      DEVICE_POSTURE_REQUIRED_SIGNALS: ${DEVICE_POSTURE_REQUIRED_SIGNALS:-device_secure,not_rooted}
      DEVICE_POSTURE_ENFORCE_CLINICAL: ${DEVICE_POSTURE_ENFORCE_CLINICAL:-false}
      PASSWORD_HISTORY_ENABLED: ${PASSWORD_HISTORY_ENABLED:-true}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      AUDIT_APPEND_ONLY: ${AUDIT_APPEND_ONLY:-true}
      AUDIT_REDACTION_ENABLED: ${AUDIT_REDACTION_ENABLED:-true}
      EXTERNAL_FEDERATION_ENABLED: ${EXTERNAL_FEDERATION_ENABLED:-false}
      SCIM_M2M_ENABLED: ${SCIM_M2M_ENABLED:-true}
      PROVISIONING_MODE: ${PROVISIONING_MODE:-dry-run}
      PROVISIONING_TARGETS: ${PROVISIONING_TARGETS:-scim,entra,google-workspace}
      SSF_ENABLED: ${SSF_ENABLED:-false}
      MTLS_ENABLED: ${MTLS_ENABLED:-false}
      RADIUS_EAP_TLS_ENABLED: ${RADIUS_EAP_TLS_ENABLED:-false}
      CSV_EXPORT_ENABLED: ${CSV_EXPORT_ENABLED:-true}
      # Outbound adapters remain disabled/dry-run until their tenant endpoint
      # and Vault-backed credential reference are explicitly configured.
      Provisioning__Scim__BaseUrl: ${PROVISIONING_SCIM_BASE_URL:-}
      Provisioning__Scim__TokenUrl: ${PROVISIONING_SCIM_TOKEN_URL:-}
      Provisioning__Scim__ClientId: ${PROVISIONING_SCIM_CLIENT_ID:-}
      Provisioning__Scim__Scope: ${PROVISIONING_SCIM_SCOPE:-scim.write}
      Provisioning__Entra__Enabled: ${PROVISIONING_ENTRA_ENABLED:-false}
      Provisioning__Entra__BaseUrl: ${PROVISIONING_ENTRA_BASE_URL:-https://graph.microsoft.com/v1.0}
      Provisioning__Entra__TokenUrl: ${PROVISIONING_ENTRA_TOKEN_URL:-}
      Provisioning__Entra__ClientId: ${PROVISIONING_ENTRA_CLIENT_ID:-}
      Provisioning__Entra__Scope: ${PROVISIONING_ENTRA_SCOPE:-https://graph.microsoft.com/.default}
      Provisioning__GoogleWorkspace__Enabled: ${PROVISIONING_GOOGLE_WORKSPACE_ENABLED:-false}
      Provisioning__GoogleWorkspace__BaseUrl: ${PROVISIONING_GOOGLE_WORKSPACE_BASE_URL:-https://admin.googleapis.com/admin/directory/v1}
      Provisioning__GoogleWorkspace__TokenUrl: ${PROVISIONING_GOOGLE_WORKSPACE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      Provisioning__GoogleWorkspace__ServiceAccountSecretId: ${PROVISIONING_GOOGLE_WORKSPACE_SECRET_ID:-google-workspace-service-account}
      Provisioning__GoogleWorkspace__DelegatedAdmin: ${PROVISIONING_GOOGLE_WORKSPACE_DELEGATED_ADMIN:-}
      SecuritySignals__Enabled: ${SSF_ENABLED:-false}
      SecuritySignals__Subscriptions__0__Url: ${SSF_RECEIVER_URL:-}
      SecuritySignals__Subscriptions__0__Audience: ${SSF_RECEIVER_AUDIENCE:-}
      Mtls__TrustedCaFile: ${MTLS_TRUSTED_CA_FILE:-/etc/hishop/certs/client-ca.pem}
