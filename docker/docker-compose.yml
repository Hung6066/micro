      retries: 5
      start_period: 30s

  external-integration-service:
    build:
      context: ..
      dockerfile: src/Services/ExternalIntegrationService/ExternalIntegrationService.Api/Dockerfile
    container_name: his-hope-external-integration
    ports:
      - "5060:5060"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5060
      EventBus__HostName: ${RABBITMQ_HOST:-rabbitmq}
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      EventBus__InternalExchangeName: his_hope_exchange
      EventBus__PublisherChannelPoolSize: "8"
      EventBus__PublisherConfirmTimeoutMilliseconds: "5000"
      ExternalIntegration__Enabled: ${EXTERNAL_INTEGRATION_ENABLED:-false}
      ExternalIntegration__Provider: ${EXTERNAL_INTEGRATION_PROVIDER:-default}
      ExternalIntegration__ExchangeName: ${EXTERNAL_INTEGRATION_EXCHANGE:-his_hope_external_exchange}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ..
      dockerfile: src/ApiGateway/Dockerfile
    container_name: his-hope-gateway
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "0"
      REDIS_URL: redis://redis:6379
      ConnectionStrings__Redis: redis:6379
      Redis__ConnectionString: redis:6379
      SERVICE_IDENTITY_URL: http://identityservice:5003
      SERVICE_IDENTITY_API_URL: http://identityservice:5003
      SERVICE_PATIENT_URL: http://patientservice:5002
      SERVICE_PATIENT_API_URL: http://patientservice:5002
      SERVICE_APPOINTMENT_URL: http://appointmentservice:5003
      SERVICE_APPOINTMENT_API_URL: http://appointmentservice:5003
      SERVICE_CLINICAL_URL: http://clinicalservice:5004
      SERVICE_CLINICAL_API_URL: http://clinicalservice:5004
      SERVICE_LAB_URL: http://labservice:5010
      SERVICE_LAB_API_URL: http://labservice:5010
      SERVICE_BILLING_URL: http://billingservice:5020
      SERVICE_BILLING_API_URL: http://billingservice:5020
      SERVICE_PHARMACY_URL: http://pharmacyservice:5030
      SERVICE_PHARMACY_API_URL: http://pharmacyservice:5030
      SERVICE_DASHBOARD_BFF_URL: http://dashboard-bff:5600
      SERVICE_SYSTEMDASHBOARD_BFF_URL: http://systemdashboard-bff:5700
      SERVICE_DATABASE_CONTINUITY_URL: http://database-continuity-service:5800
      SERVICE_MANUFACTURING_URL: http://manufacturingservice:5050
      Vault__Address: ${VAULT_ADDR:-http://vault:8200}
      Vault__Token: ${VAULT_TOKEN:-}
      Vault__RequireVault: ${VAULT_REQUIRE:-false}
      Vault__AllowStaticToken: ${VAULT_ALLOW_STATIC_TOKEN:-true}
      Vault__EnableTransit: ${VAULT_ENABLE_TRANSIT:-true}
      # Docker Compose uses the service DNS name; Kubernetes overrides this
      # destination from the production manifest/service configuration.
      "ReverseProxy__Clusters__dashboard-bff__Destinations__dashboard-bff/dest__Address": ${SERVICE_DASHBOARD_BFF_URL:-http://dashboard-bff:5600}/
      CORS__AllowedOrigins: "http://localhost,http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4205,http://localhost:4300,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://frontend:8080,https://app.his-hope.internal,https://localhost,capacitor://localhost"
    depends_on:
      identityservice: { condition: service_healthy }
      database-continuity-service: { condition: service_healthy }
      patientservice: { condition: service_healthy }
      appointmentservice: { condition: service_healthy }
      clinicalservice: { condition: service_healthy }
      dashboard-bff: { condition: service_healthy }
      manufacturingservice: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Nacoms manufacturing traceability vertical slice.
  # The first slice is intentionally in-memory; persistence/outbox is the next
  # migration step after the API contract is validated.
  manufacturingservice:
    build:
      context: ../src/Services/ManufacturingService/ManufacturingService.Api
      dockerfile: Dockerfile
    container_name: his-hope-manufacturing
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5050
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: src/Frontend/his-hope-app/Dockerfile
    container_name: his-hope-frontend
    networks:
      default:
        aliases:
          - frontend
    ports:
      - "8081:8080"
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Clinical dashboard aggregation BFF (distinct from the Aspire observability BFF below).
  dashboard-bff:
    build:
      context: ..
      dockerfile: src/Bff/DashboardBff/Dockerfile
    container_name: his-hope-dashboard-bff
    ports:
      - "5600:5600"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5600
      # DashboardBff binds all downstream clients through the canonical
      # SERVICE_*_URL runtime contract (not ad-hoc Services__/ConnectionStrings__).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVICE_PATIENT_GRPC_URL: http://patientservice:5006
      SERVICE_CLINICAL_GRPC_URL: http://clinicalservice:5009
      SERVICE_LAB_GRPC_URL: http://labservice:5018
      SERVICE_BILLING_GRPC_URL: http://billingservice:5022
      SERVICE_PHARMACY_GRPC_URL: http://pharmacyservice:5032
      SERVICE_APPOINTMENT_API_URL: http://appointmentservice:5004
      Services__Patient: http://patientservice:5002
      Services__Clinical: http://clinicalservice:5004
      Services__Lab: http://labservice:5010
      Services__Billing: http://billingservice:5020
      Services__Pharmacy: http://pharmacyservice:5030
      Services__Appointment: http://appointmentservice:5003
    depends_on:
      patientservice: { condition: service_healthy }
      clinicalservice: { condition: service_healthy }
      labservice: { condition: service_healthy }
      billingservice: { condition: service_healthy }
      pharmacyservice: { condition: service_healthy }
      appointmentservice: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Aspire Dashboard BFF
  systemdashboard-bff:
    build:
      context: ..
      dockerfile: src/Bff/SystemDashboard.Bff/Dockerfile
    ports:
      - "5700:5700"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5700
      - REDIS_URL=redis://redis:6379
      - SERVICE_IDENTITY_URL=http://identityservice:5003
      - SERVICE_IDENTITY_API_URL=http://identityservice:5003
      - SERVICE_IDENTITY_GRPC_URL=http://identityservice:5007
      - SERVICE_PATIENT_API_URL=http://patientservice:5002
      - SERVICE_PATIENT_GRPC_URL=http://patientservice:5006
      - SERVICE_APPOINTMENT_API_URL=http://appointmentservice:5003
      - SERVICE_APPOINTMENT_GRPC_URL=http://appointmentservice:5008
      - SERVICE_CLINICAL_API_URL=http://clinicalservice:5004
      - SERVICE_CLINICAL_GRPC_URL=http://clinicalservice:5009
      - SERVICE_LAB_API_URL=http://labservice:5010
      - SERVICE_LAB_GRPC_URL=http://labservice:5018
      - SERVICE_BILLING_API_URL=http://billingservice:5020
      - SERVICE_BILLING_GRPC_URL=http://billingservice:5022
      - SERVICE_PHARMACY_API_URL=http://pharmacyservice:5030
      - SERVICE_PHARMACY_GRPC_URL=http://pharmacyservice:5032
      - Consul__Address=${SERVICE_CONSUL_URL:-http://consul:8500}
      - Elasticsearch__Url=${OBSERVABILITY_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - Jaeger__QueryUrl=${OBSERVABILITY_JAEGER_URL:-http://jaeger:16686}
      - Prometheus__Url=${OBSERVABILITY_PROMETHEUS_URL:-}
      # RuntimeConfiguration binds the Prometheus client from SERVICE_*_URL;
      # keep the Compose DNS target explicit instead of appsettings localhost.
      - SERVICE_PROMETHEUS_URL=http://prometheus:9090
      - Loki__Url=${OBSERVABILITY_LOKI_URL:-http://loki:3100}
      - AlertManager__Url=${OBSERVABILITY_ALERTMANAGER_URL:-http://alertmanager:9093}
      - Jwt__Authority=${SERVICE_IDENTITY_URL:-http://identityservice:5003}
      - Jwt__AllowHttp=true
      - Jwt__Issuer=http://localhost:5000/
      - Jwt__ValidIssuers__0=http://localhost:5000/
      - Jwt__ValidIssuers__1=his-hope-identity
      - Jwt__Audience=http://localhost:5000/
      - Jwt__RsaPublicKeyPath=/etc/hishop/certs/jwt-public-key.pem
      - Jwt__RsaEncryptionPrivateKeyPath=/etc/hishop/certs/jwt-encryption-private-key.pem
      - Jwt__SessionKey=${SYSTEMDASHBOARD_JWT_SESSION_KEY:-}
      # Keep BFF traversal and dashboard bootstrap below the same shared
      # sliding-window limits used by the gateway and identity service.
      - RateLimiting__MaxRequestsPerIp=1000
      - RateLimiting__MaxRequestsPerUser=2000
      - RateLimiting__WindowMinutes=1
      - Redis__ConnectionString=${REDIS_URL:-redis://redis:6379}
      - Docker__Enabled=false
      - Cors__AllowedOrigins__0=http://localhost:4201
      - Cors__AllowedOrigins__1=http://localhost:8082
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      - consul
      - elasticsearch
      - jaeger
      - prometheus
      - loki
      - alertmanager
      - redis
    restart: unless-stopped

  # Admin App (Angular)
  admin-app:
    build:
      context: ..
      dockerfile: admin-app/Dockerfile
    container_name: his-hope-admin
    networks:
      default:
        aliases:
          - admin
    ports:
      - "8083:8080"
    depends_on:
      identityservice: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Aspire Dashboard App (Angular)
  dashboard-app:
    build:
      context: ..
      dockerfile: dashboard-app/Dockerfile
    container_name: his-hope-dashboard
    networks:
      default:
        aliases:
          - dashboard
    ports:
      - "8082:8080"
    environment:
      - API_URL=${SERVICE_SYSTEMDASHBOARD_BFF_URL:-http://systemdashboard-bff:5700}
    depends_on:
      - systemdashboard-bff
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Temporal distributed workflow engine
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: his-hope-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_VALUE=frontend.visibilityMaxPageSize=1000
      - SERVICES=seed,frontend,history,matching,worker
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["temporal"]
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:1.24
    container_name: his-hope-temporal-admin
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    profiles: ["temporal", "admin"]

  temporal-worker:
    build:
      context: ..
      dockerfile: src/Infrastructure/AgentHarness/src/AgentHarness.TemporalWorker/Dockerfile
    container_name: his-hope-temporal-worker
    ports:
      - "5270:5270"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Temporal__ServerUrl: temporal:7233
      AgentHarness__DatabaseConnectionString: ${DATABASE_HARNESS_URL:-};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      temporal:
        condition: service_healthy
    profiles: ["temporal"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Agent Harness MCP Server
  agentharness:
    build:
      context: ..
      dockerfile: src/Infrastructure/AgentHarness/Dockerfile
    container_name: his-hope-agentharness
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AgentHarness__DatabaseConnectionString: ${DATABASE_HARNESS_URL:-};Password=${POSTGRES_PASSWORD:-postgres}
      AgentHarness__RabbitMQConnectionString: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@${RABBITMQ_URL:-rabbitmq}:5672/
      AgentHarness__ApiKey: ${AGENT_HARNESS_API_KEY:-}
      AgentHarness__UseTemporal: ${AGENT_HARNESS_USE_TEMPORAL:-false}
      AgentHarness__TemporalServerUrl: temporal:7233
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    profiles: ["default", "temporal"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Certificate Generator (one-time)
  certgen:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: his-hope-certgen
    profiles: ["setup"]
    volumes:
      - certs_data:/certs
    entrypoint:
      - /bin/sh
      - -c
      - |
        dotnet dev-certs https --export-path /certs/server.pfx --password "${CERT_PASSWORD:-his-hope-dev}" --format Pfx &&
        dotnet dev-certs https --trust &&
        echo "Certificates generated"
    restart: "no"

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:
  es_data:
  consul_data:
  jaeger_data:
  prometheus_data:
  loki_data:
  grafana_data:
  certs_data:
  glitchtip_postgres_data:
  glitchtip_valkey_data:
  glitchtip_uploads:
  vault_data:
  database_continuity_backups:
  postgres_wal_archive:
  postgres_restore_drill_data:
