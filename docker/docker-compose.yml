services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: his-hope-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb,harnessdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g }
        reservations: { memory: 256m }

  postgres-replica:
    image: postgres:16-alpine
    container_name: his-hope-postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    depends_on:
      - postgres
    profiles: ["replica"]

  redis:
    image: redis:7-alpine
    container_name: his-hope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: his-hope-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: his-hope-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:8.12.0
    container_name: his-hope-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }

  consul:
    image: hashicorp/consul:1.18
    container_name: his-hope-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    volumes:
      - consul_data:/consul/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: his-hope-jaeger
    user: "0:0"
    ports:
      - "16686:16686"
      - "24317:4317"
      - "24318:4318"
      - "6831:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: "/badger/key"
      BADGER_DIRECTORY_VALUE: "/badger/data"
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: his-hope-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger: { condition: service_healthy }
    restart: unless-stopped

  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: his-hope-glitchtip-postgres
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip-dev-change-me}
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    container_name: his-hope-glitchtip-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - glitchtip_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  glitchtip:
    image: ${GLITCHTIP_IMAGE:-glitchtip/glitchtip:6}
    container_name: his-hope-glitchtip
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip-dev-change-me}@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret-key}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@his-hope.local}
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_USER_REGISTRATION:-false}
      ENABLE_ORGANIZATION_CREATION: ${GLITCHTIP_ENABLE_ORGANIZATION_CREATION:-false}
      SERVER_ROLE: all_in_one
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
      glitchtip-valkey: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: his-hope-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: his-hope-alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: his-hope-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Application Services
  identityservice:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/IdentityService.Api/Dockerfile
    container_name: his-hope-identity
    ports:
      - "5001:5001"
      - "5012:5012"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__IdentityDb: Host=postgres;Database=identitydb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      # Use the public OIDC issuer for both OIDC and service-issued JWTs.
      # This keeps the fallback JwtBearer handler aligned with OpenIddict validation.
      Jwt__Issuer: http://localhost:5000/
      # Keep the internal hostname as an explicit legacy issuer during migration.
      Jwt__ValidIssuers__0: http://localhost:5000/
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__Audience: http://localhost:5000/
      Jwt__Expiry: "08:00:00"
      Redis__ConnectionString: redis:6379
      Vault__Address: ${VAULT_ADDR:-}
      Vault__Token: ${VAULT_TOKEN:-}
      Vault__RequireVault: ${VAULT_REQUIRE:-false}
      Vault__EnableTransit: ${VAULT_ENABLE_TRANSIT:-false}
      OpenIddict__Signing__PrivateKeyPath: ${OPENIDDICT_SIGNING_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-private-key.pem}
      # Nested legacy JWTs used by session exchange must remain JWE encrypted.
      Jwt__RsaEncryptionPrivateKeyPath: ${JWT_RSA_ENCRYPTION_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-encryption-private-key.pem}
      # OIDC access-token encryption must use the same persistent key as every
      # downstream JWT validator. Do not fall back to an ephemeral development key.
      OpenIddict__Encryption__PrivateKeyPath: ${JWT_RSA_ENCRYPTION_PRIVATE_KEY_PATH:-/etc/hishop/certs/jwt-encryption-private-key.pem}
      OpenIddict__Encryption__KeyId: oidc-encryption-v1
      Otlp__Endpoint: http://otel-collector:4317
      # ─── OpenIddict OIDC Configuration ───
      OpenIddict__Issuer: ${OIDC_ISSUER:-http://localhost:5000}
      OpenIddict__InternalJwksUri: http://identityservice:5001/.well-known/jwks
      OpenIddict__AccessTokenLifetime: ${OIDC_ACCESS_TOKEN_LIFETIME:-01:00:00}
      OpenIddict__RefreshTokenLifetime: ${OIDC_REFRESH_TOKEN_LIFETIME:-7.00:00:00}
      OpenIddict__AuthorizationCodeLifetime: ${OIDC_CODE_LIFETIME:-00:01:00}
      # WebAuthn origins used by the local identity login page and admin app.
      # Production deployments should override these with the public HTTPS origins.
      Passkeys__RpId: ${PASSKEYS_RP_ID:-localhost}
      Passkeys__Origins__0: ${PASSKEYS_ORIGIN_0:-http://localhost:5000}
      Passkeys__Origins__1: ${PASSKEYS_ORIGIN_1:-http://localhost:8083}
      Passkeys__Origins__2: ${PASSKEYS_ORIGIN_2:-https://localhost}
      Mobile__AppPolicy__MinimumVersion: 1.0.0
      Mobile__AppPolicy__LatestVersion: 1.0.0
      Mobile__AppPolicy__ForceUpgrade: "false"
      Mobile__AppPolicy__Maintenance: "false"
      # ─── Federation (optional) ───
      Identity__BootstrapAdmin__Password: Admin@123
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Microsoft__ClientId: ${MS_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${MS_CLIENT_SECRET:-}
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  patientservice:
    build:
      context: ..
      dockerfile: src/Services/PatientService/PatientService.Api/Dockerfile
    container_name: his-hope-patient
    ports:
      - "5002:5002"
      - "5006:5006"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__PatientDb: Host=postgres;Database=patientdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  appointmentservice:
    build:
      context: ..
      dockerfile: src/Services/AppointmentService/AppointmentService.Api/Dockerfile
    container_name: his-hope-appointment
    ports:
      - "5003:5003"
      - "5007:5007"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__AppointmentDb: Host=postgres;Database=appointmentdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      GrpcServices__PatientService: http://patientservice:5006
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      patientservice: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  clinicalservice:
    build:
      context: ..
      dockerfile: src/Services/ClinicalService/ClinicalService.Api/Dockerfile
    container_name: his-hope-clinical
    ports:
      - "5004:5004"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__ClinicalDb: Host=postgres;Database=clinicaldb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      GrpcServices__PatientService: http://patientservice:5006
      GrpcServices__AppointmentService: http://appointmentservice:5007
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      patientservice: { condition: service_healthy }
      appointmentservice: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  labservice:
    build:
      context: ..
      dockerfile: src/Services/LabService/LabService.Api/Dockerfile
    container_name: his-hope-lab
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5010
      ConnectionStrings__LabDb: Host=postgres;Database=labdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      GrpcServices__PatientService: http://patientservice:5006
      GrpcServices__ClinicalService: http://clinicalservice:5004
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  billingservice:
    build:
      context: ..
      dockerfile: src/Services/BillingService/BillingService.Api/Dockerfile
    container_name: his-hope-billing
    ports:
      - "5020:5020"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5020
      ConnectionStrings__BillingDb: Host=postgres;Database=billingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      GrpcServices__PatientService: http://patientservice:5006
      GrpcServices__AppointmentService: http://appointmentservice:5007
      GrpcServices__LabService: http://labservice:5010
      GrpcServices__PharmacyService: http://pharmacyservice:5030
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pharmacyservice:
    build:
      context: ..
      dockerfile: src/Services/PharmacyService/PharmacyService.Api/Dockerfile
    container_name: his-hope-pharmacy
    ports:
      - "5030:5030"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5030
      ConnectionStrings__PharmacyDb: Host=postgres;Database=pharmacydb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      GrpcServices__PatientService: http://patientservice:5006
      GrpcServices__ClinicalService: http://clinicalservice:5004
      EventBus__HostName: rabbitmq
      EventBus__UserName: ${RABBITMQ_USER:-admin}
      EventBus__Password: ${RABBITMQ_PASSWORD:-admin}
      Redis__ConnectionString: redis:6379
      Jwt__Authority: http://identityservice:5001
      Jwt__MetadataAddress: http://identityservice:5001/.well-known/internal-openid-configuration
      Jwt__Issuer: http://localhost:5000/
      Jwt__AllowHttp: "true"
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  apigateway:
    build:
      context: ..
      dockerfile: src/ApiGateway/Dockerfile
    container_name: his-hope-gateway
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Redis__ConnectionString: redis:6379
      CORS__AllowedOrigins: "http://localhost,http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4300,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://frontend:8080,https://app.his-hope.internal,https://localhost,capacitor://localhost"
    depends_on:
      identityservice: { condition: service_healthy }
      patientservice: { condition: service_healthy }
      appointmentservice: { condition: service_healthy }
      clinicalservice: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: src/Frontend/his-hope-app/Dockerfile
    container_name: his-hope-frontend
    ports:
      - "8081:8080"
    depends_on:
      apigateway: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  # Aspire Dashboard BFF
  systemdashboard-bff:
    build:
      context: ..
      dockerfile: src/Bff/SystemDashboard.Bff/Dockerfile
    ports:
      - "5700:5700"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5700
      - Consul__Address=http://consul:8500
      - Elasticsearch__Url=http://elasticsearch:9200
      - Jaeger__QueryUrl=http://jaeger:16686
      - Prometheus__Url=http://prometheus:9090
      - AlertManager__Url=http://alertmanager:9093
      - Jwt__Authority=http://identityservice:5001
      - Jwt__AllowHttp=true
      - Jwt__Issuer=http://localhost:5000/
      - Jwt__ValidIssuers__0=http://localhost:5000/
      - Jwt__ValidIssuers__1=his-hope-identity
      - Jwt__Audience=http://localhost:5000/
      - Jwt__RsaPublicKeyPath=/etc/hishop/certs/jwt-public-key.pem
      - Jwt__RsaEncryptionPrivateKeyPath=/etc/hishop/certs/jwt-encryption-private-key.pem
      - Jwt__SessionKey=ThisIsADevelopmentKeyThatIsLongEnoughForHmacSha256!
      - Redis__ConnectionString=redis:6379
      - Docker__Enabled=false
      - Cors__AllowedOrigins__0=http://localhost:4201
      - Cors__AllowedOrigins__1=http://localhost:8082
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
    depends_on:
      - consul
      - elasticsearch
      - jaeger
      - prometheus
      - alertmanager
      - redis
    restart: unless-stopped

  # Admin App (Angular)
  admin-app:
    build:
      context: ..
      dockerfile: admin-app/Dockerfile
    container_name: his-hope-admin
    ports:
      - "8083:80"
    depends_on:
      identityservice: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Aspire Dashboard App (Angular)
  dashboard-app:
    build:
      context: ..
      dockerfile: dashboard-app/Dockerfile
    container_name: his-hope-dashboard
    ports:
      - "8082:80"
    environment:
      - API_URL=http://systemdashboard-bff:5700
    depends_on:
      - systemdashboard-bff
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Temporal distributed workflow engine
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: his-hope-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_VALUE=frontend.visibilityMaxPageSize=1000
      - SERVICES=seed,frontend,history,matching,worker
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["temporal"]
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:1.24
    container_name: his-hope-temporal-admin
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    profiles: ["temporal", "admin"]

  temporal-worker:
    build:
      context: ..
      dockerfile: src/Infrastructure/AgentHarness/src/AgentHarness.TemporalWorker/Dockerfile
    container_name: his-hope-temporal-worker
    ports:
      - "5270:5270"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Temporal__ServerUrl: temporal:7233
      AgentHarness__DatabaseConnectionString: Host=postgres;Database=harnessdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      temporal:
        condition: service_healthy
    profiles: ["temporal"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Agent Harness MCP Server
  agentharness:
    build:
      context: ..
      dockerfile: src/Infrastructure/AgentHarness/Dockerfile
    container_name: his-hope-agentharness
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AgentHarness__DatabaseConnectionString: Host=postgres;Database=harnessdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      AgentHarness__RabbitMQConnectionString: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
      AgentHarness__ApiKey: ${AGENT_HARNESS_API_KEY:-dev-key-change-in-production}
      AgentHarness__UseTemporal: ${AGENT_HARNESS_USE_TEMPORAL:-false}
      AgentHarness__TemporalServerUrl: temporal:7233
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    profiles: ["default", "temporal"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--list-runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Certificate Generator (one-time)
  certgen:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: his-hope-certgen
    profiles: ["setup"]
    volumes:
      - certs_data:/certs
    entrypoint:
      - /bin/sh
      - -c
      - |
        dotnet dev-certs https --export-path /certs/server.pfx --password "${CERT_PASSWORD:-his-hope-dev}" --format Pfx &&
        dotnet dev-certs https --trust &&
        echo "Certificates generated"
    restart: "no"

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:
  es_data:
  consul_data:
  jaeger_data:
  prometheus_data:
  grafana_data:
  certs_data:
  glitchtip_postgres_data:
  glitchtip_valkey_data:
  glitchtip_uploads:
