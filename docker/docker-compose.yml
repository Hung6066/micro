  database-continuity-service:
    build:
      context: ..
      dockerfile: src/Services/DatabaseContinuityService/DatabaseContinuityService.Api/Dockerfile
    container_name: his-hope-database-continuity
    ports:
      - "5800:5800"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5800
      ConnectionStrings__Redis: ${REDIS_URL:-redis://redis:6379}
      Redis__ConnectionString: ${REDIS_URL:-redis://redis:6379}
      Vault__Address: ${VAULT_ADDR:-http://vault:8200}
      Vault__Token: ${VAULT_TOKEN:-}
      Vault__RequireVault: ${VAULT_REQUIRE:-false}
      Vault__AllowStaticToken: ${VAULT_ALLOW_STATIC_TOKEN:-false}
      Vault__EnableTransit: ${VAULT_ENABLE_TRANSIT:-true}
      Jwt__Authority: ${SERVICE_IDENTITY_URL:-http://identityservice:5003}
      Jwt__MetadataAddress: ${SERVICE_IDENTITY_URL:-http://identityservice:5003}/.well-known/internal-openid-configuration
      Jwt__AllowHttp: "true"
      Jwt__Issuer: http://localhost:5000/
      Jwt__ValidIssuers__0: http://localhost:5000/
      Jwt__ValidIssuers__1: his-hope-identity
      Jwt__ValidIssuers__2: His.Hope.IdentityService
      Jwt__Audience: http://localhost:5000/
      Jwt__RsaPublicKeyPath: /etc/hishop/certs/jwt-public-key.pem
      Jwt__RsaEncryptionPrivateKeyPath: /etc/hishop/certs/jwt-encryption-private-key.pem
      DatabaseContinuity__Enabled: ${DATABASE_CONTINUITY_ENABLED:-true}
      DatabaseContinuity__SchedulerEnabled: ${DATABASE_CONTINUITY_SCHEDULER_ENABLED:-true}
      DatabaseContinuity__BackupIntervalHours: ${DATABASE_CONTINUITY_BACKUP_INTERVAL_HOURS:-24}
      DatabaseContinuity__Provider: ${DATABASE_CONTINUITY_PROVIDER:-postgresql}
      DatabaseContinuity__StorageUri: ${DATABASE_CONTINUITY_STORAGE_URI:-file:///var/lib/his-hope/backups}
      DatabaseContinuity__StorageProvider: ${DATABASE_CONTINUITY_STORAGE_PROVIDER:-auto}
      DatabaseContinuity__StorageFallbackEnabled: ${DATABASE_CONTINUITY_STORAGE_FALLBACK_ENABLED:-true}
      DatabaseContinuity__LocalStoragePath: /var/lib/his-hope/backups
      DatabaseContinuity__EncryptionProvider: ${DATABASE_CONTINUITY_ENCRYPTION_PROVIDER:-vault-kms}
      DatabaseContinuity__RetentionDays: ${DATABASE_CONTINUITY_RETENTION_DAYS:-30}
      DatabaseContinuity__KeepLastBackupsPerDatabase: ${DATABASE_CONTINUITY_KEEP_LAST_BACKUPS_PER_DATABASE:-1}
      DatabaseContinuity__PitrEnabled: ${DATABASE_CONTINUITY_PITR_ENABLED:-true}
      PITR_ENABLED: ${DATABASE_CONTINUITY_PITR_ENABLED:-true}
      PITR_WAL_ARCHIVE_PATH: /var/lib/his-hope/wal-archive
      PITR_BASE_BACKUP_PATH: /var/lib/his-hope/backups/pitr-base
      PITR_BASE_BACKUP_INTERVAL_HOURS: ${DATABASE_CONTINUITY_PITR_BASE_BACKUP_INTERVAL_HOURS:-24}
      RETENTION_DAYS: ${DATABASE_CONTINUITY_RETENTION_DAYS:-30}
      DatabaseContinuity__TargetRpoMinutes: ${DATABASE_CONTINUITY_TARGET_RPO_MINUTES:-5}
      DatabaseContinuity__TargetRtoMinutes: ${DATABASE_CONTINUITY_TARGET_RTO_MINUTES:-30}
      DatabaseContinuity__ExecutorPath: ${DATABASE_CONTINUITY_EXECUTOR_PATH:-/opt/his-hope/bin/database-continuity-executor.sh}
      DatabaseContinuity__ExecutorWorkingDirectory: ${DATABASE_CONTINUITY_EXECUTOR_WORKING_DIRECTORY:-/opt/his-hope/bin}
      DatabaseContinuity__RestoreDrillIntervalHours: ${DATABASE_CONTINUITY_RESTORE_DRILL_INTERVAL_HOURS:-168}
      DatabaseContinuity__MaxAttempts: ${DATABASE_CONTINUITY_MAX_ATTEMPTS:-3}
      DatabaseContinuity__RestoreDrillTargetEnvironment: ${DATABASE_CONTINUITY_RESTORE_DRILL_TARGET:-isolated}
      # This component opens Npgsql directly (not through shared persistence),
      # so keep its audit connection in native key/value syntax.
      DatabaseContinuity__AuditConnectionString: Host=postgres;Port=5432;Database=auditdb;Username=his_hope_app;Password=${POSTGRES_PASSWORD:-postgres}
      BACKUP_STORAGE_PATH: /var/lib/his-hope/backups
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY_NAME:-his-hope-backup-encryption}
      DATABASE_CONTINUITY_DATABASES: ${DATABASE_CONTINUITY_DATABASES:-identitydb,patientdb,appointmentdb,clinicaldb,labdb,billingdb,pharmacydb}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RESTORE_DRILL_PGHOST: postgres-restore-drill
      RESTORE_DRILL_PGPORT: "5432"
      RESTORE_DRILL_PGUSER: postgres
      RESTORE_DRILL_PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PITR_DRILL_PORT: "55432"
      DatabaseContinuity__VaultAddress: http://vault:8200
      DatabaseContinuity__VaultToken: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      DatabaseContinuity__VaultTransitKeyName: ${VAULT_TRANSIT_KEY_NAME:-his-hope-backup-encryption}
      Vault__TransitMount: transit
    volumes:
      - ../.runtime/identity-keys:/etc/hishop/certs:ro
      - database_continuity_backups:/var/lib/his-hope/backups
      - postgres_wal_archive:/var/lib/his-hope/wal-archive:ro
    depends_on:
