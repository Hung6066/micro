apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  annotations:
    config.linkerd.io/proxy-cpu-request: 10m
    config.linkerd.io/proxy-memory-request: 20Mi
  labels:
    app.kubernetes.io/component: secrets-provider
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
  name: his-hope-identity-service-secrets
  namespace: his-hope
spec:
  parameters:
    audience: vault
    objects: |
      - objectName: db_host
        secretPath: secret/data/his-hope/database/identitydb
        secretKey: host
      - objectName: db_port
        secretPath: secret/data/his-hope/database/identitydb
        secretKey: port
      - objectName: db_name
        secretPath: secret/data/his-hope/database/identitydb
        secretKey: database
      - objectName: db_user
        secretPath: secret/data/his-hope/database/identitydb
        secretKey: username
      - objectName: db_password
        secretPath: secret/data/his-hope/database/identitydb
        secretKey: password
      - objectName: jwt_private_key
        secretPath: secret/data/his-hope/identity-service/jwt
        secretKey: private_key
      - objectName: jwt_public_key
        secretPath: secret/data/his-hope/identity-service/jwt
        secretKey: public_key
      - objectName: jwt_key_id
        secretPath: secret/data/his-hope/identity-service/jwt
        secretKey: key_id
      - objectName: jwt_issuer
        secretPath: secret/data/his-hope/identity-service/jwt
        secretKey: issuer
      - objectName: oidc_encryption_private_key
        secretPath: secret/data/his-hope/identity-service/oidc-encryption
        secretKey: private_key
      - objectName: saml_idp_metadata
        secretPath: secret/data/his-hope/identity-service/federation/saml
        secretKey: idp_metadata
      - objectName: ldap_server
        secretPath: secret/data/his-hope/identity-service/federation/ldap
        secretKey: server
      - objectName: ldap_bind_dn
        secretPath: secret/data/his-hope/identity-service/federation/ldap
        secretKey: bind_dn
      - objectName: ldap_bind_password
        secretPath: secret/data/his-hope/identity-service/federation/ldap
        secretKey: bind_password
      - objectName: ldap_search_base
        secretPath: secret/data/his-hope/identity-service/federation/ldap
        secretKey: search_base
      - objectName: firebase_credentials_json
        secretPath: secret/data/his-hope/identity-service/push/firebase
        secretKey: credentials_json
      - objectName: apns_key_id
        secretPath: secret/data/his-hope/identity-service/push/apns
        secretKey: key_id
      - objectName: apns_team_id
        secretPath: secret/data/his-hope/identity-service/push/apns
        secretKey: team_id
      - objectName: apns_private_key
        secretPath: secret/data/his-hope/identity-service/push/apns
        secretKey: private_key
      - objectName: apns_bundle_id
        secretPath: secret/data/his-hope/identity-service/push/apns
        secretKey: bundle_id
      - objectName: mtls_cert
        secretPath: secret/data/his-hope/identity-service/mtls
        secretKey: cert
      - objectName: mtls_key
        secretPath: secret/data/his-hope/identity-service/mtls
        secretKey: key
      - objectName: mtls_ca
        secretPath: secret/data/his-hope/identity-service/mtls
        secretKey: ca_cert
      - objectName: admin_bootstrap_password
        secretPath: secret/data/his-hope/identity-service/bootstrap-admin
        secretKey: password
    roleName: identity-service
    vaultAddress: https://vault-active.his-hope.svc.cluster.local:8200
    vaultAuthMountPath: kubernetes-jwt
    vaultCACertPath: /vault/tls/ca.crt
    vaultSkipTLSVerify: "false"
  provider: vault
  secretObjects:
  - data:
    - key: host
      objectName: db_host
    - key: port
      objectName: db_port
    - key: database
      objectName: db_name
    - key: username
      objectName: db_user
    - key: password
      objectName: db_password
    secretName: identity-service-db-creds
    type: Opaque
  - data:
    - key: private_key
      objectName: jwt_private_key
    - key: public_key
      objectName: jwt_public_key
    - key: key_id
      objectName: jwt_key_id
    - key: issuer
      objectName: jwt_issuer
    secretName: identity-service-jwt
    type: Opaque
  - data:
    - key: Saml2__IdPMetadata
      objectName: saml_idp_metadata
    - key: Ldap__Server
      objectName: ldap_server
    - key: Ldap__BindDn
      objectName: ldap_bind_dn
    - key: Ldap__BindPassword
      objectName: ldap_bind_password
    - key: Ldap__SearchBase
      objectName: ldap_search_base
    - key: PushProviders__FirebaseCredentialsJson
      objectName: firebase_credentials_json
    - key: PushProviders__ApnsKeyId
      objectName: apns_key_id
    - key: PushProviders__ApnsTeamId
      objectName: apns_team_id
    - key: PushProviders__ApnsPrivateKey
      objectName: apns_private_key
    - key: PushProviders__ApnsBundleId
      objectName: apns_bundle_id
    secretName: identity-service-security
    type: Opaque
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  annotations:
    config.linkerd.io/proxy-cpu-request: 10m
    config.linkerd.io/proxy-memory-request: 20Mi
  labels:
    app.kubernetes.io/component: secrets-provider
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: runtime-contract-config
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
  name: his-hope-runtime-contract-secrets
  namespace: his-hope
spec:
  parameters:
    audience: vault
    objects: |
      - objectName: "SECRET_POSTGRES_PASSWORD"
        secretPath: "secret/data/his-hope/production/postgres"
        secretKey: "password"
      - objectName: "SECRET_RABBITMQ_PASSWORD"
        secretPath: "secret/data/his-hope/production/rabbitmq"
        secretKey: "password"
      - objectName: "SECRET_REDIS_PASSWORD"
        secretPath: "secret/data/his-hope/production/redis"
        secretKey: "password"
      - objectName: "SECRET_OIDC_CLIENT_SECRET"
        secretPath: "secret/data/his-hope/production/oidc"
        secretKey: "client-secret"
    roleName: database-continuity
    vaultAddress: https://vault-active.his-hope.svc.cluster.local:8200
    vaultAuthMountPath: kubernetes
    vaultCACertPath: /vault/tls/ca.crt
    vaultSkipTLSVerify: "false"
  provider: vault
  secretObjects:
  - data:
    - key: SECRET_POSTGRES_PASSWORD
      objectName: SECRET_POSTGRES_PASSWORD
    - key: SECRET_RABBITMQ_PASSWORD
      objectName: SECRET_RABBITMQ_PASSWORD
    - key: SECRET_REDIS_PASSWORD
      objectName: SECRET_REDIS_PASSWORD
    - key: SECRET_OIDC_CLIENT_SECRET
      objectName: SECRET_OIDC_CLIENT_SECRET
    secretName: runtime-contract-secrets
    type: Opaque