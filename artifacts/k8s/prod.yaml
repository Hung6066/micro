          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1654
          runAsNonRoot: true
          runAsUser: 1654
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: runtime-tmp
        - mountPath: /etc/tls/vault
          name: vault-tls-ca
          readOnly: true
        - mountPath: /var/run/secrets/tokens
          name: vault-jwt
          readOnly: true
        - mountPath: /etc/tls/redis
          name: redis-tls-ca
          readOnly: true
      imagePullSecrets:
      - name: harbor-pull
      initContainers: []
      restartPolicy: Never
      securityContext:
        fsGroup: 1654
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: his-hope-appointment-service
      volumes:
      - emptyDir: {}
        name: runtime-tmp
      - name: vault-tls-ca
        secret:
          defaultMode: 288
          secretName: vault-tls-ca
      - name: vault-jwt
        projected:
          sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 3600
              path: vault
      - name: redis-tls-ca
        secret:
          defaultMode: 288
          secretName: redis-tls
  ttlSecondsAfterFinished: 86400
