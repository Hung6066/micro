metadata:
  annotations:
    config.linkerd.io/proxy-cpu-request: 10m
    config.linkerd.io/proxy-memory-request: 20Mi
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: patient-service
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
  name: his-hope-patient-service
  namespace: his-hope
spec:
  maxReplicas: 1
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: his-hope-patient-service
---
