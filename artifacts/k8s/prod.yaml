apiVersion: v1
data:
  pgbouncer.ini: |
    [databases]
    * = host=his-hope-postgres.his-hope-data.svc.cluster.local port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir = /tmp
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    default_pool_size = 20
    reserve_pool_size = 5
    max_client_conn = 100
    max_db_connections = 25
    server_idle_timeout = 600
    server_check_query = SELECT 1
    server_check_delay = 60
    query_timeout = 30
    idle_transaction_timeout = 300
