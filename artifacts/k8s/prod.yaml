  namespace: his-hope
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/part-of: his-hope
          app.kubernetes.io/version: latest
          k8s-app: kube-dns
