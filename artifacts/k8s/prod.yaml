        - name: Vault__AuthMethod
          value: kubernetes
        - name: Vault__AuthMount
          value: kubernetes
        - name: Vault__Role
          value: appointment-service-db
        - name: Vault__RequireVault
          value: "true"
        - name: Vault__AllowStaticToken
          value: "false"
        - name: Vault__Database__Enabled
          value: "true"
        - name: Vault__TlsCaFile
          value: /etc/tls/vault/ca.crt
        - name: Outbox__WorkerCount
          value: "0"
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              key: redis-connection
              name: systemdashboard-bff-secrets
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              key: redis-connection
              name: systemdashboard-bff-secrets
        - name: Redis__TlsCaFile
