    config.linkerd.io/proxy-cpu-request: 10m
    config.linkerd.io/proxy-memory-request: 20Mi
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: his-hope
    app.kubernetes.io/version: latest
  name: his-hope-allow-vault-oidc-egress
  namespace: his-hope
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 8082
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: spire-oidc
          app.kubernetes.io/part-of: his-hope
          app.kubernetes.io/version: latest
  - ports:
    - port: 8201
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: vault
          app.kubernetes.io/part-of: his-hope
          app.kubernetes.io/version: latest
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - vault
  policyTypes:
  - Egress
---
