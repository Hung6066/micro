        app.kubernetes.io/part-of: his-hope
        app.kubernetes.io/version: latest
        his-hope.io/operation: database-migration
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: ConnectionStrings__AppointmentDb
          valueFrom:
            configMapKeyRef:
              key: ADAPTER_CONNECTIONSTRINGS_APPOINTMENTDB
              name: his-hope-runtime-contract-config
        - name: Persistence__RunMigrationsOnStartup
          value: "true"
        - name: Persistence__MigrationOnly
          value: "true"
        - name: Vault__Address
