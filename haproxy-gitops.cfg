global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend k3s-api
    bind *:6443
    mode tcp
    default_backend k3s-api-backend

backend k3s-api-backend
    mode tcp
    balance roundrobin
    option tcp-check
    server k3s-server-1 172.16.102.7:6443 check
    server k3s-server-2 172.16.102.8:6443 check
    server k3s-server-3 172.16.102.9:6443 check

frontend ingress-http
    bind *:80
    mode tcp
    default_backend ingress-http-backend

backend ingress-http-backend
    mode tcp
    balance roundrobin
    option tcp-check
    server k3s-worker-1 172.16.102.10:30080 check
    server k3s-worker-2 172.16.102.12:30080 check

frontend harbor-https
    bind *:443 ssl crt /etc/haproxy/certs/harbor-public.pem crt /etc/haproxy/certs/git-mirror-public.pem
    mode tcp
    timeout client 1h
    use_backend git-mirror-https-backend if { ssl_fc_sni -i git-mirror.his-hope.local }
    default_backend harbor-https-backend

backend harbor-https-backend
    mode tcp
    balance roundrobin
    option tcp-check
    timeout server 1h
    timeout tunnel 1h
    server k3s-worker-1 172.16.102.10:30003 ssl verify required ca-file /etc/haproxy/certs/harbor-backend-ca.pem verifyhost harbor.his-hope.local sni str(harbor.his-hope.local) check-sni harbor.his-hope.local check
    server k3s-worker-2 172.16.102.12:30003 ssl verify required ca-file /etc/haproxy/certs/harbor-backend-ca.pem verifyhost harbor.his-hope.local sni str(harbor.his-hope.local) check-sni harbor.his-hope.local check

backend git-mirror-https-backend
    mode tcp
    balance roundrobin
    option tcp-check
    timeout server 1h
    timeout tunnel 1h
    server k3s-worker-1 172.16.102.10:30443 ssl verify required ca-file /etc/haproxy/certs/git-mirror-backend-ca.pem verifyhost git-mirror.his-hope.local sni str(git-mirror.his-hope.local) check-sni git-mirror.his-hope.local check
    server k3s-worker-2 172.16.102.12:30443 ssl verify required ca-file /etc/haproxy/certs/git-mirror-backend-ca.pem verifyhost git-mirror.his-hope.local sni str(git-mirror.his-hope.local) check-sni git-mirror.his-hope.local check

